AWSTemplateFormatVersion: '2010-09-09'
Description: 'Shared Managed Policies for Hybrid Infrastructure'

Resources:
  # This policy allows Terraform to Read/Write State and Lock DB
  TerraformStatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-TerraformState-Common
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3TerraformStateAccess
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
            Resource:
              - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state
              - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state/*
          - Sid: DynamoDBStateLocking
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
            Resource: arn:aws:dynamodb:eu-west-2:969041180300:table/hybrid-cloud-infrastructure-terraform-state-lock

Outputs:
  # We export this ARN so the Roles stack can grab it
  TerraformStatePolicyArn:
    Value: !Ref TerraformStatePolicy
    Export:
      Name: HybridCloud-TerraformStatePolicy-Arn



# ... (Your existing S3/DynamoDB Policy is above here) ...

  # ============================================================================
  # NEW: The "Separation of Duties" Security Policy
  # ============================================================================
  TerraformSecurityBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-Terraform-SecurityBoundary
      Description: "Prevents Terraform from modifying IAM but allows passing roles to Compute"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Rule 1: Allow Passing Roles (so Terraform can launch EC2/EKS)
          # Note: We use '*' for now (Phase 1). Later, you list specific roles here.
          - Sid: AllowPassRole
            Effect: Allow
            Action: 'iam:PassRole'
            Resource: '*'
            Condition:
              StringEquals:
                'iam:PassedToService': 'ec2.amazonaws.com'

          # Rule 2: STRICTLY FORBID creating/deleting IAM resources
          # This prevents a hacker from creating a "Super Admin" backdoor.
          - Sid: BlockIAMMutation
            Effect: Deny
            Action:
              - 'iam:CreateUser'
              - 'iam:CreateRole'
              - 'iam:CreatePolicy'
              - 'iam:DeleteUser'
              - 'iam:DeleteRole'
              - 'iam:DeletePolicy'
              - 'iam:AttachRolePolicy'
              - 'iam:PutRolePolicy'
            Resource: '*'

Outputs:
  # ... (Your existing exports) ...

  # EXPORT the new policy so the Roles stack can find it
  TerraformSecurityBoundaryPolicyArn:
    Value: !Ref TerraformSecurityBoundaryPolicy
    Export:
      Name: HybridCloud-TerraformSecurityBoundary-Arn
## ansible-playbook -i ../inventory 03-configure_ansible_vm_ssh.yml
---
- name: Configure Ansible VM to Trust Vault CA (2 Tasks)
  hosts: ansible  # Replace with the group or hostname of your Ansible VM in inventory
  become: yes              # Needs sudo to edit /etc/ssh/
  vars:
    ca_public_key_src: "./vault-ca.pub"
    ca_trusted_path: "/etc/ssh/trusted-user-ca-keys.pem"

  tasks:
    - name: 00-Copy Vault CA Public Key to Target
      copy:
        src: "{{ ca_public_key_src }}"
        dest: "{{ ca_trusted_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart SSH

    - name: 01-Update sshd_config to trust the CA
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^TrustedUserCAKeys'
        line: "TrustedUserCAKeys {{ ca_trusted_path }}"
        state: present
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      service:
        name: sshd  # Use 'ssh' if on Ubuntu/Debian, 'sshd' for RHEL/Rocky
        state: restarted

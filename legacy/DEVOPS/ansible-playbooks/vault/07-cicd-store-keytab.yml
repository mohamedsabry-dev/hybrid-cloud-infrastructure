---
# ============================================================================
# Playbook: Store Kerberos Keytab in HashiCorp Vault
# ============================================================================
# Purpose: Securely store keytab in Vault and remove from local filesystem
# Target: Ansible VM (reads keytab) + localhost (writes to Vault)
# Security: Keytab encrypted at rest in Vault, audit trail enabled
# ============================================================================

- name: Store Kerberos Keytab in Vault and Remove Local Copy
  hosts: localhost
  become: yes
  gather_facts: yes

  vars_prompt:
    - name: admin_user
      prompt: "Enter Vault Admin Username"
      private: no
    - name: admin_password
      prompt: "Enter Vault Admin Password"
      private: yes

  vars:
    keytab_file: /etc/security/keytabs/super_ansible.keytab
    keytab_principal: super_ansible@HOME.LAB
    vault_addr: "http://10.0.20.192:8200"
    vault_path: secret/data/cicd/kerberos/super_ansible
    vault_verify_path: secret/data/cicd/kerberos/super_ansible

  tasks:
    # ========================================================================
    # Vault Authentication
    # ========================================================================
    - name: Authenticate to Vault using userpass
      community.hashi_vault.vault_login:
        url: "{{ vault_addr }}"
        auth_method: userpass
        username: "{{ admin_user }}"
        password: "{{ admin_password }}"
      register: vault_auth_result
      tags: [vault, auth]

    - name: Display Vault authentication status
      debug:
        msg:
          - "✅ Vault authentication successful"
          - "Token received and will be used for all operations"
      tags: [vault, auth]

    # ========================================================================
    # Pre-flight Checks
    # ========================================================================
    - name: 00-Verify keytab file exists
      stat:
        path: "{{ keytab_file }}"
      register: keytab_exists
      tags: [verify, preflight]

    - name: 00a-Fail if keytab does not exist
      fail:
        msg: "Keytab file {{ keytab_file }} not found! Run 04-generate-kerberos-keytab.yml first."
      when: not keytab_exists.stat.exists
      tags: [verify, preflight]

    - name: 00b-Display keytab information
      debug:
        msg:
          - "Keytab file found: {{ keytab_file }}"
          - "Size: {{ keytab_exists.stat.size }} bytes"
          - "Owner: {{ keytab_exists.stat.pw_name }}"
          - "Permissions: {{ keytab_exists.stat.mode }}"
      tags: [verify, preflight]

    # ========================================================================
    # Step 1: Read Keytab and Encode to Base64
    # ========================================================================
    - name: 01-Read keytab file and encode to base64
      slurp:
        src: "{{ keytab_file }}"
      register: keytab_content
      tags: [read, encode]

    - name: 01a-Verify base64 encoding successful
      debug:
        msg:
          - "Keytab successfully read and encoded"
          - "Encoded size: {{ keytab_content.content | length }} characters"
      tags: [read, encode]

    # ========================================================================
    # Step 2: Store Keytab in Vault KV Engine
    # ========================================================================
    - name: 02-Store keytab in Vault KV engine
      uri:
        url: "{{ vault_addr }}/v1/{{ vault_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_auth_result.login.auth.client_token }}"
        body_format: json
        body:
          data:
            keytab: "{{ keytab_content.content }}"
            principal: "{{ keytab_principal }}"
            created_at: "{{ ansible_date_time.iso8601 }}"
            created_by: "{{ ansible_user_id }}"
            source_host: "{{ ansible_hostname }}"
        status_code: [200, 204]
        validate_certs: no
      delegate_to: localhost
      register: vault_store_result
      tags: [vault, store]

    - name: 02a-Display Vault storage result
      debug:
        msg:
          - "✅ Keytab stored in Vault successfully"
          - "Path: {{ vault_path }}"
          - "Status: {{ vault_store_result.status }}"
      tags: [vault, store]

    # ========================================================================
    # Step 3: Verify Keytab Stored Successfully in Vault
    # ========================================================================
    - name: 03-Verify keytab stored successfully in Vault
      uri:
        url: "{{ vault_addr }}/v1/{{ vault_verify_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_auth_result.login.auth.client_token }}"
        return_content: yes
        status_code: 200
        validate_certs: no
      delegate_to: localhost
      register: vault_verify
      tags: [vault, verify]

    - name: 03a-Extract and verify keytab metadata from Vault
      set_fact:
        vault_keytab_metadata:
          principal: "{{ vault_verify.json.data.data.principal }}"
          created_at: "{{ vault_verify.json.data.data.created_at }}"
          created_by: "{{ vault_verify.json.data.data.created_by }}"
          source_host: "{{ vault_verify.json.data.data.source_host }}"
      tags: [vault, verify]

    - name: 03b-Display Vault verification result
      debug:
        msg:
          - "✅ Keytab verification SUCCESSFUL"
          - "Principal: {{ vault_keytab_metadata.principal }}"
          - "Created at: {{ vault_keytab_metadata.created_at }}"
          - "Created by: {{ vault_keytab_metadata.created_by }}"
          - "Source host: {{ vault_keytab_metadata.source_host }}"
      tags: [vault, verify]

    # ========================================================================
    # Step 4: Test Keytab Retrieval from Vault
    # ========================================================================
    - name: 04-Test retrieve keytab from Vault
      uri:
        url: "{{ vault_addr }}/v1/{{ vault_verify_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_auth_result.login.auth.client_token }}"
        return_content: yes
        status_code: 200
        validate_certs: no
      delegate_to: localhost
      register: vault_retrieve_test
      tags: [vault, test]

    - name: 04a-Decode retrieved keytab and compare with original
      set_fact:
        retrieved_keytab: "{{ vault_retrieve_test.json.data.data.keytab }}"
        original_keytab: "{{ keytab_content.content }}"
      tags: [vault, test]

    - name: 04b-Verify keytab integrity (compare hashes)
      debug:
        msg:
          - "✅ Keytab integrity verified"
          - "Original and retrieved keytabs match!"
      when: retrieved_keytab == original_keytab
      tags: [vault, test]

    - name: 04c-Fail if keytab integrity check fails
      fail:
        msg: "❌ Keytab integrity check FAILED! Retrieved keytab does not match original."
      when: retrieved_keytab != original_keytab
      tags: [vault, test]

    # ========================================================================
    # Step 5: Backup Keytab to Temp Location (Safety)
    # ========================================================================
    - name: 05-Create temporary backup of keytab
      copy:
        src: "{{ keytab_file }}"
        dest: "{{ keytab_file }}.backup"
        remote_src: yes
        owner: super_ansible
        group: super_ansible
        mode: '0400'
      tags: [backup, safety]

    - name: 05a-Display backup location
      debug:
        msg:
          - "🔒 Safety backup created: {{ keytab_file }}.backup"
          - "This backup will be deleted after final verification"
      tags: [backup, safety]

    # ========================================================================
    # Step 6: Delete Local Keytab File (SECURITY)
    # ========================================================================
    - name: 06-Delete local keytab file
      file:
        path: "{{ keytab_file }}"
        state: absent
      when: vault_verify.status == 200 and retrieved_keytab == original_keytab
      register: keytab_deletion
      tags: [cleanup, security]

    - name: 06a-Verify keytab deleted
      stat:
        path: "{{ keytab_file }}"
      register: keytab_deleted_check
      tags: [cleanup, verify]

    - name: 06b-Display deletion result
      debug:
        msg:
          - "✅ Local keytab deleted successfully"
          - "File {{ keytab_file }} no longer exists"
      when: not keytab_deleted_check.stat.exists
      tags: [cleanup, verify]

    # ========================================================================
    # Step 7: Delete Backup After Verification
    # ========================================================================
    - name: 07-Delete backup keytab file
      file:
        path: "{{ keytab_file }}.backup"
        state: absent
      when: not keytab_deleted_check.stat.exists
      tags: [cleanup, security]

    - name: 07a-Confirm backup deleted
      debug:
        msg:
          - "✅ Backup keytab deleted"
          - "All local copies removed"
      tags: [cleanup, verify]

    # ========================================================================
    # Step 8: Final Security Summary
    # ========================================================================
    - name: 08-Display final security summary
      debug:
        msg:
          - "════════════════════════════════════════════════════════════"
          - "✅ KEYTAB MIGRATION TO VAULT COMPLETED SUCCESSFULLY"
          - "════════════════════════════════════════════════════════════"
          - ""
          - "Keytab Details:"
          - "  Principal: {{ keytab_principal }}"
          - "  Vault Path: {{ vault_path }}"
          - "  Original Location: {{ keytab_file }} (DELETED)"
          - ""
          - "Security Status:"
          - "  ✅ Keytab stored encrypted in Vault"
          - "  ✅ Local keytab file deleted"
          - "  ✅ Backup keytab deleted"
          - "  ✅ Integrity verified"
          - "  ✅ Audit trail in Vault logs"
          - ""
          - "Next Steps:"
          - "  1. Test keytab retrieval in Jenkins pipeline"
          - "  2. Configure Jenkins Vault integration"
          - "  3. Monitor Vault audit logs for keytab access"
          - ""
          - "Retrieval Command (from Vault):"
          - "  vault kv get -field=keytab {{ vault_path | regex_replace('data/', '') }}"
          - ""
          - "════════════════════════════════════════════════════════════"
      tags: [always]

# ============================================================================
# End of Playbook
# ============================================================================
# Usage:
#   ansible-playbook 05-store-keytab-to-vault.yml -i ../inventory
#
# Prerequisites:
#   - Keytab file exists at /etc/security/keytabs/super_ansible.keytab
#   - Vault is unsealed and accessible
#   - Valid Vault token with write permissions to secret/data/cicd/*
#
# Security Notes:
#   - Keytab is encrypted at rest in Vault
#   - Local keytab is deleted after successful storage
#   - Vault audit logs track all keytab access
#   - Use short-lived Vault tokens when possible
#
# Testing Keytab Retrieval:
#   vault kv get -field=keytab secret/cicd/kerberos/super_ansible | base64 -d > /tmp/test.keytab
#   kinit -kt /tmp/test.keytab super_ansible@HOME.LAB
#   klist
#   rm /tmp/test.keytab
# ============================================================================

## ansible-playbook -i ../inventory 01-install_jenkins.yml
---
- name: Install Jenkins and Add Jenkins to Docker (Using Java 21) (7 Tasks)
  hosts: cicd
  become: yes
  vars:
    # Tuned for 3GB RAM
    jenkins_java_opts: "-Xmx1024m -Djava.awt.headless=true"

  tasks:
    - name: 00-Add Jenkins Repository
      get_url:
        url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo

    - name: 01-Import Jenkins GPG Key
      rpm_key:
        state: present
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key

      
    - name: 02-Install Jenkins (Specific Version) 
      dnf:
        name: jenkins-2.452.3-1.1.noarch
        state: present
        disable_plugin: versionlock  # Optional: helps if you use the versionlock plugin

    # --- MEMORY TUNING ---
    - name: 03-Create systemd override directory
      file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: '0755'

    - name: 04-Apply Memory Limit (1GB)
      copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        content: |
          [Service]
          Environment="JAVA_OPTS={{ jenkins_java_opts }}"
      notify: Restart Jenkins

    # --- DOCKER PERMISSIONS ---
    - name: 05-Add 'jenkins' user to 'docker' group
      user:
        name: jenkins
        groups: docker
        append: yes
      notify: Restart Jenkins

    - name: 06-Ensure Jenkins is started and enabled
      service:
        name: jenkins
        state: started
        enabled: yes

  handlers:
    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted
        daemon_reload: yes

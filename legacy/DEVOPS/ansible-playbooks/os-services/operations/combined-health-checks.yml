---
# Combined System Checks Playbook
# This playbook combines date, NTP, and IPA DNS checks

# Check 1: Date and Time Information
- name: Check date on remote hosts
  hosts: all
  tasks:
    - name: Get date and time information
      ansible.builtin.command: timedatectl
      register: timedatectl_output

    - name: Display full date and time information
      ansible.builtin.debug:
        var: timedatectl_output.stdout_lines
      when: timedatectl_output.stdout is defined

# Check 2: NTP Status
- name: Check NTP Status on All VMs
  hosts: all
  become: yes

  tasks:
    - name: Check if chronyd is running
      command: systemctl is-active chronyd
      register: chrony_status
      ignore_errors: yes
      changed_when: false

    - name: Get current NTP sources
      command: chronyc sources
      register: chrony_sources
      changed_when: false

    - name: Read chrony configuration file
      command: cat /etc/chrony.conf
      register: chrony_config
      changed_when: false

    - name: Display Status and Sources of NTP
      debug:
        msg:
          - "Chronyd Status: {{ chrony_status.stdout }}"
          - "{{ chrony_sources.stdout_lines }}"

    - name: Display Chrony Config File
      debug:
        msg: "{{ chrony_config.stdout_lines }}"

# Check 3: FreeIPA DNS Configuration
- name: Check FreeIPA DNS Configuration
  hosts: ipa
  become: yes
  vars_prompt:
    - name: ipa_admin_password
      prompt: "Enter IPA admin password"
      private: yes

  tasks:
    - name: Get Kerberos ticket and show DNS config
      shell: |
        echo "{{ ipa_admin_password }}" | kinit admin
        ipa dnsconfig-show
      register: dns_config
      changed_when: false

    - name: Display DNS configuration
      debug:
        var: dns_config.stdout_lines

    - name: Destroy the Kerberos ticket
      command: kdestroy
      changed_when: false
      ignore_errors: yes

# IAM module deployment (dev/prod)
# - Creates IAM policies, roles, users for Terraform operations
# - Requires admin role (IAM module needs iam:* permissions)

name: "IAM Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
      confirm:
        description: 'Type "deploy" to confirm apply'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "${{ inputs.action }} - ${{ inputs.environment }}"
    runs-on: production
    # Block apply without confirmation
    if: inputs.action == 'plan' || inputs.confirm == 'deploy'

    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}/aws/iam

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Configure AWS Credentials (Dev)
        if: inputs.environment == 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_DEV:role/GitHubActions-TerraformAdmin-dev
          aws-region: eu-west-2

      - name: Configure AWS Credentials (Prod)
        if: inputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_PROD:role/GitHubActions-TerraformAdmin-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: terraform plan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve

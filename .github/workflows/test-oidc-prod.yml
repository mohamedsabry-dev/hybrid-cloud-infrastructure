name: "Test OIDC - Prod Account"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "test" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================
  # JOB: Test Prod Role Assumption
  # =========================================================
  test-prod-role:
    name: "Test Prod Role Assumption"
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'test'
    runs-on: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_PROD:role/GitHubActions-TerraformAdmin-prod
          aws-region: eu-west-2

      - name: Verify Identity
        run: |
          echo "=== AWS Identity ==="
          aws sts get-caller-identity
          echo "=== Success! Prod role assumed correctly ==="

      - name: Test S3 State Access
        run: |
          echo "=== Testing S3 state bucket access ==="
          aws s3 ls s3://hybrid-cloud-infrastructure-terraform-state/

      - name: Test DynamoDB Lock Table
        run: |
          echo "=== Testing DynamoDB lock table access ==="
          aws dynamodb describe-table --table-name hybrid-cloud-infrastructure-terraform-state-lock --query 'Table.TableName'

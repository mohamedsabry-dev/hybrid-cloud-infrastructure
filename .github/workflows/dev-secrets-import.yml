# One-time workflow to import existing Secrets Manager resources into Terraform state
# Delete this workflow after successful import

name: "Dev - Secrets Import"

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: "Import Existing Resources"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/dev/aws/secrets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_DEV:role/GitHubActions-TerraformAdmin-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Import Secret
        run: |
          terraform import aws_secretsmanager_secret.proxmox_terraform \
            dev/proxmox/terraform-token || true

      - name: Import Secret Version
        run: |
          # Get the secret ARN first
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id dev/proxmox/terraform-token \
            --query 'ARN' --output text)

          # Get the current version ID
          VERSION_ID=$(aws secretsmanager describe-secret \
            --secret-id dev/proxmox/terraform-token \
            --query 'VersionIdsToStages | keys(@) | [0]' --output text)

          terraform import aws_secretsmanager_secret_version.proxmox_terraform \
            "${SECRET_ARN}|${VERSION_ID}" || true

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

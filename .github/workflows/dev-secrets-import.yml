# One-time workflow to import existing Secrets Manager resources into Terraform state
# Delete this workflow after successful import

name: "Dev - Secrets Import"

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: "Import Existing Resources"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/dev/aws/secrets

    steps:
      - name: Checkout
        run: |
          rm -rf * .[^.]* 2>/dev/null || true
          git clone --depth 1 https://github.com/mohamedsabry-dev/hybrid-cloud-infrastructure.git .
          git fetch origin ${{ github.sha }} --depth 1
          git checkout ${{ github.sha }}

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_DEV:role/GitHubActions-TerraformAdmin-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Import Secret
        run: |
          terraform import aws_secretsmanager_secret.proxmox_terraform \
            dev/proxmox/terraform-token 2>/dev/null || echo "Secret already in state or import failed"

      - name: Import Secret Version
        run: |
          # Get the secret ARN first
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id dev/proxmox/terraform-token \
            --query 'ARN' --output text 2>/dev/null) || exit 0

          # Get the current version ID
          VERSION_ID=$(aws secretsmanager describe-secret \
            --secret-id dev/proxmox/terraform-token \
            --query 'VersionIdsToStages | keys(@) | [0]' --output text 2>/dev/null) || exit 0

          terraform import aws_secretsmanager_secret_version.proxmox_terraform \
            "${SECRET_ARN}|${VERSION_ID}" 2>/dev/null || echo "Version already in state or import failed"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

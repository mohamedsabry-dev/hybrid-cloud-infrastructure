# =============================================================================
# PROD Nginx Full Setup
# =============================================================================
# Deploys Nginx LXC as external reverse proxy
# Single job workflow - ready for expansion
# =============================================================================

name: "[PROD] Nginx - Full Setup"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to prod branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/proxmox/lxc/nginx/**'
      - '.github/workflows/prod-nginx-full-setup.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/proxmox/lxc/nginx

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Deploy Nginx LXC
  # Creates the container from golden template
  # Lock: PROD_INFRA_NGINX_LOCK
  # ---------------------------------------------------------------------------
  deploy:
    name: "1. Deploy Nginx LXC"
    runs-on: mac-mini
    if: ${{ vars.PROD_INFRA_NGINX_LOCK != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_PROD }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id prod/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id prod/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "TF_VAR_ssh_public_keys=[\"${ANSIBLE_SSH_KEY}\"]" >> $GITHUB_ENV

          LXC_PWD=$(aws secretsmanager get-secret-value \
            --secret-id prod/golden-image/lxc-root-password \
            --query SecretString --output text)
          echo "::add-mask::${LXC_PWD}"
          echo "TF_VAR_root_password=${LXC_PWD}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

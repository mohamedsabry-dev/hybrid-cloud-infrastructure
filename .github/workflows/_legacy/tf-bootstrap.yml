name: "Terraform Apply"

on:
  push:
    branches:
      - mohamedsabrydev/sre-8-phase-2-setup-proxmox-server
    paths:
      - '.github/workflows/tf-bootstrap.yml'
      - 'cloud/aws/bootstrap/terraform/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: false
        default: 'main'
        type: string
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================
  # JOB 1: cloudtrail (The Foundation)
  # =========================================================
  apply-cloudtrail:
    name: "1. Cloudtrail Apply"
    # Push: runs automatically | workflow_dispatch: requires typing "deploy"
    if: github.event_name == 'push' || inputs.confirm == 'deploy'
    runs-on: production
    defaults:
      run:
        working-directory: cloud/aws/bootstrap/terraform/audit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-Audit
          aws-region: eu-west-2

      - run: terraform init
      - run: terraform apply -auto-approve

  # =========================================================
  # JOB 2: Secrets Manager (Infra secret containers)
  # =========================================================
  apply-secrets:
    name: "2. Secrets Apply"
    if: github.event_name == 'push' || inputs.confirm == 'deploy'
    runs-on: production
    defaults:
      run:
        working-directory: cloud/aws/bootstrap/terraform/secrets

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-Secrets
          aws-region: eu-west-2

      - run: terraform init
      - run: terraform apply -auto-approve

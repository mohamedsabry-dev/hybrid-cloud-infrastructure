# =============================================================================
# PROD AWS KMS Vault Unseal
# =============================================================================
# Deploys KMS key and IAM user for HashiCorp Vault auto-unseal
# Triggers on prod-security branch (security-sensitive changes)
# =============================================================================

name: "[PROD] AWS - KMS Vault Unseal"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to prod-security branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - prod-security
    paths:
      - 'terraform/prod/aws/kms-vault-unseal/**'
      - '.github/workflows/prod-aws-kms-vault-unseal.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/aws/kms-vault-unseal

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Deploy KMS Key & Unseal User
  # Uses TerraformAdmin role (requires elevated permissions for KMS/IAM)
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy KMS Key & Unseal User"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-TerraformAdmin-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_PROD }}

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

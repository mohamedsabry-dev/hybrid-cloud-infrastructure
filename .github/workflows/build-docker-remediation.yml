# Builds & pushes the remediation Docker image to GHCR
# Image is generic and contains no sensitive data — set to public on GHCR after push.
# related: kubernetes/docker-images/remediation/
name: Build Docker Remediation

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - 'kubernetes/docker-images/remediation/**'

jobs:
  build-remediation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Remediation
        uses: docker/build-push-action@v5
        with:
          context: kubernetes/docker-images/remediation/
          push: true
          tags: |
            ghcr.io/mohamedsabry-dev/remediation:${{ github.ref_name == 'prod' && 'latest' || 'dev' }}
            ghcr.io/mohamedsabry-dev/remediation:${{ github.sha }}


      - name: Delete old remediation images
        uses: actions/delete-package-versions@v5
        with:
          package-name: remediation
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

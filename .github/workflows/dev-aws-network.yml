# Dev network module deployment
# Triggers on push to dev branch when network files change

#### Define Block ####
# 1. Define the job name on GH UI
# 2. Define the run condition "On push : Where ?"
# 3. Define the working directory path on GH Level
# 4. Declare if will use manual trigger later or not
# 5. Declare the needed permissions for OIDC Use
# 6. Declare Env Variables for clean use
name: "[DEV] AWS - Network (DESTROY)"
on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/network/**'
      - '.github/workflows/dev-aws-network.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/aws/network
#####################
#####################


jobs:
  deploy:
    name: "Plan & Apply (dev)"
    runs-on: macOS

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (DESTROY MODE)
        timeout-minutes: 3
        run: terraform plan -destroy -out=tfplan

      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 10
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


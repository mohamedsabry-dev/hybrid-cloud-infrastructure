# =============================================================================
# DEV Golden Templates Full Setup
# =============================================================================
# Creates golden VM and LXC templates for cloning
# Manual setup required after each job - see post-build instructions
# =============================================================================

name: "[DEV] Golden Templates - Full Setup"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to dev branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/proxmox/lxc/golden-template/**'
      - 'terraform/dev/proxmox/vms/golden-image/**'
      - '.github/workflows/dev-golden-full-setup.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR_LXC: terraform/dev/proxmox/lxc/golden-template
  TF_WORKING_DIR_VM: terraform/dev/proxmox/vms/golden-image
  ANSIBLE_HOST: 10.0.63.10
  ANSIBLE_USER: root

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Create Golden VM
  # Creates base VM for cloning - requires manual setup after deployment
  # Lock: DEV_INFRA_GOLDEN_VM_LOCK
  # ---------------------------------------------------------------------------
  create-vm:
    name: "1. Create Golden VM"
    runs-on: mac-mini
    if: ${{ vars.DEV_INFRA_GOLDEN_VM_LOCK != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR_VM }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_DEV }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # Show setup instructions BEFORE terraform apply
      # (Terraform waits for guest agent, which is installed by this manual setup)
      - name: Pre-Build Setup Instructions
        run: |
          echo "=============================================="
          echo "  MANUAL SETUP INSTRUCTIONS (DO THIS NOW)"
          echo "=============================================="
          echo ""
          echo "Terraform will create the VM and WAIT for the guest agent."
          echo "You must complete OS installation while Terraform waits."
          echo ""
          echo "PREREQUISITE: During Rocky Linux installation, you MUST:"
          echo "  - Set a root password (enables SSH access for setup)"
          echo "  - The setup script will secure SSH to key-only auth later"
          echo ""
          echo "Step 1: Watch Proxmox UI - VM will appear and boot from ISO"
          echo "  # Complete Rocky Linux installation via console"
          echo ""
          echo "Step 2: After OS install, get VM IP and copy setup script"
          echo "  scp proxmox/golden_templates/golden-vm-setup.sh root@<VM_IP>:/tmp/"
          echo ""
          echo "Step 3: SSH to VM and run setup script"
          echo "  ssh root@<VM_IP>"
          echo "  chmod +x /tmp/golden-vm-setup.sh"
          echo "  /tmp/golden-vm-setup.sh"
          echo ""
          echo "Step 4: Script installs guest-agent - Terraform will then complete"
          echo ""
          echo "Step 5: After Terraform completes, clone to template (on Proxmox host)"
          echo "  qm clone 9000 9001 --name rocky10-golden-template --full"
          echo "  qm template 9001"
          echo ""
          echo "SECURITY: The setup script sets 'PermitRootLogin prohibit-password'"
          echo "          which allows SSH keys only (no password). This is inherited"
          echo "          by cloned VMs - Terraform/cloud-init injects new keys per VM."
          echo ""
          echo "NOTE: VM 9000 stays as source (Terraform managed)"
          echo "      VM 9001 is the template (manually created clone)"
          echo "=============================================="
          echo ""
          echo "Starting Terraform apply in 30 seconds..."
          sleep 30

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # Job 2: Create Golden LXC
  # Creates base LXC container for cloning - requires manual setup after deployment
  # Lock: DEV_INFRA_GOLDEN_LXC_LOCK
  # ---------------------------------------------------------------------------
  create-lxc:
    name: "2. Create Golden LXC"
    runs-on: mac-mini
    needs: create-vm
    if: ${{ always() && needs.create-vm.result != 'failure' && needs.create-vm.result != 'cancelled' && vars.DEV_INFRA_GOLDEN_LXC_LOCK != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR_LXC }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_DEV }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          LXC_PWD=$(aws secretsmanager get-secret-value \
            --secret-id dev/golden-image/lxc-root-password \
            --query SecretString --output text)
          echo "::add-mask::${LXC_PWD}"
          echo "TF_VAR_root_password=${LXC_PWD}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # Show setup instructions BEFORE terraform apply
      - name: Pre-Build Setup Instructions
        run: |
          echo "=============================================="
          echo "  LXC MANUAL SETUP INSTRUCTIONS (AFTER APPLY)"
          echo "=============================================="
          echo ""
          echo "After Terraform creates the container, complete these steps:"
          echo ""
          echo "Step 1: Copy setup script to Proxmox host (from Mac)"
          echo "  scp proxmox/golden_templates/golden-lxc-setup.sh admin_dev@pve-dev.lab.local:/tmp/"
          echo ""
          echo "Step 2: Push script into container (on Proxmox host)"
          echo "  pct push 9010 /tmp/golden-lxc-setup.sh /tmp/golden-lxc-setup.sh"
          echo ""
          echo "Step 3: Enter container and run setup"
          echo "  pct enter 9010"
          echo "  chmod +x /tmp/golden-lxc-setup.sh"
          echo "  /tmp/golden-lxc-setup.sh"
          echo ""
          echo "Step 4: After setup completes, exit and stop container"
          echo "  exit"
          echo "  pct stop 9010"
          echo ""
          echo "Step 5: Create backup using vzdump (to local storage)"
          echo "  vzdump 9010 --compress gzip --storage local --mode stop"
          echo ""
          echo "Step 6: Move backup to template directory (overwrites existing)"
          echo "  # Optional: backup old template first"
          echo "  # mv /mnt/pve/nas-iso/template/cache/rocky-9-lxc-golden.tar.gz /mnt/pve/nas-iso/template/cache/rocky-9-lxc-golden.tar.gz.bak"
          echo "  mv -f /var/lib/vz/dump/vzdump-lxc-9010-*.tar.gz /mnt/pve/nas-iso/template/cache/rocky-9-lxc-golden.tar.gz"
          echo ""
          echo "Step 7: Verify template is available"
          echo "  pveam list nas-iso"
          echo ""
          echo "Note: The template will be at: nas-iso:vztmpl/rocky-9-lxc-golden.tar.gz"
          echo "      Source container 9010 stays for future updates (Terraform managed)"
          echo "=============================================="
          echo ""
          echo "Starting Terraform apply in 30 seconds..."
          sleep 30

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

# =============================================================================
# PROD K8s Full Setup
# =============================================================================
# Deploys Kubernetes cluster VMs (masters and workers)
# Each job has its own lock - locked jobs skip to next, workflow continues
# =============================================================================

name: "[PROD] K8s - Full Setup"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to prod branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/proxmox/vms/k8s_masters/**'
      - 'terraform/prod/proxmox/vms/k8s_workers/**'
      - '.github/workflows/prod-k8s-full-setup.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: prod

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Deploy K8s Masters
  # Creates 3 master VMs for control plane
  # Lock: PROD_INFRA_K8S_MASTERS_LOCK
  # ---------------------------------------------------------------------------
  deploy-masters:
    name: "1. Deploy K8s Masters"
    runs-on: mac-mini
    if: ${{ vars.PROD_INFRA_K8S_MASTERS_LOCK != 'true' }}

    defaults:
      run:
        working-directory: terraform/prod/proxmox/vms/k8s_masters

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_PROD }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id prod/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id prod/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "TF_VAR_ansible_ssh_public_key=${ANSIBLE_SSH_KEY}" >> $GITHUB_ENV

          VM_ROOT_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id prod/golden-image/vm-root-password \
            --query SecretString --output text)
          echo "::add-mask::${VM_ROOT_PASSWORD}"
          echo "TF_VAR_vm_root_password=${VM_ROOT_PASSWORD}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # Job 2: Deploy K8s Workers
  # Creates 3 worker VMs for workloads
  # Lock: PROD_INFRA_K8S_WORKERS_LOCK
  # ---------------------------------------------------------------------------
  deploy-workers:
    name: "2. Deploy K8s Workers"
    runs-on: mac-mini
    needs: deploy-masters
    if: ${{ always() && needs.deploy-masters.result != 'failure' && needs.deploy-masters.result != 'cancelled' && vars.PROD_INFRA_K8S_WORKERS_LOCK != 'true' }}

    defaults:
      run:
        working-directory: terraform/prod/proxmox/vms/k8s_workers

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_PROD }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id prod/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id prod/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "TF_VAR_ansible_ssh_public_key=${ANSIBLE_SSH_KEY}" >> $GITHUB_ENV

          VM_ROOT_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id prod/golden-image/vm-root-password \
            --query SecretString --output text)
          echo "::add-mask::${VM_ROOT_PASSWORD}"
          echo "TF_VAR_vm_root_password=${VM_ROOT_PASSWORD}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

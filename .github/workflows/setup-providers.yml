# ON LOCAL RUNNER (one-time setup):
#   mkdir -p ~/.terraform.d/providers-mirror
#   # Then run this workflow once to populate the mirror

name: Setup Provider Mirror

on:
  push:
    branches:
      - mohamedsabrydev/infra-245-phase-1-devops-foundation
    paths:
      - '.github/workflows/setup-providers.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on'
        required: false
        default: 'main'
        type: string

jobs:
  setup-mirror:
    runs-on: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Mirror Directory and Terraformrc
        run: |
          TF_MIRROR_DIR="$HOME/.terraform.d/providers-mirror"
          echo "TF_MIRROR_DIR=$TF_MIRROR_DIR" >> $GITHUB_ENV
          mkdir -p $TF_MIRROR_DIR
          cat > ~/.terraformrc << EOF
          provider_installation {
            filesystem_mirror {
              path    = "$TF_MIRROR_DIR"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

      - name: Create Heavy Terraform File
        run: |
          echo 'terraform {
            required_providers {
              # AWS Provider (~650MB)
              aws = {
                source  = "hashicorp/aws"
                version = "6.28.0"
              }
              # Azure Provider (~500MB)
              azurerm = {
                source  = "hashicorp/azurerm"
                version = "4.57.0"
              }
              # VMware vSphere Provider (maintained by VMware/Broadcom)
              vsphere = {
                source  = "vmware/vsphere"
                version = "2.15.0"
              }
              # HashiCorp Vault (requires Terraform >= 1.11)
              vault = {
                source  = "hashicorp/vault"
                version = "5.6.0"
              }
              # Kubernetes Provider
              kubernetes = {
                source  = "hashicorp/kubernetes"
                version = "3.0.1"
              }
              # Proxmox Provider (for on-premise nested Proxmox setup)
              proxmox = {
                source  = "bpg/proxmox"
                version = "0.93.0"
              }
            }
          }' > main.tf

      - name: Check Mirror Before Init
        run: |
          echo "Mirror contents BEFORE init:"
          du -sh $TF_MIRROR_DIR 2>/dev/null || echo "Mirror empty"
          find $TF_MIRROR_DIR -name "terraform-provider-*" -type f 2>/dev/null | head -20

      - name: Terraform Init (uses mirror)
        run: |
          echo "Terraformrc config:"
          cat ~/.terraformrc
          echo "---"
          time terraform init -input=false

      - name: Verify Mirror Content
        run: |
          echo "Mirror size:"
          du -sh $TF_MIRROR_DIR
          echo "---"
          echo "Cached providers:"
          find $TF_MIRROR_DIR -name "terraform-provider-*" -type f -exec ls -lh {} \;

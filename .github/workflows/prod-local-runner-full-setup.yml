# Prod Local Runner Full Setup - Combined Workflow
# Combines: infra-local_runner, svc-gh-local_runner, svc-local_runner-tools
# Each job has its own lock - locked jobs skip to next, not fail whole workflow

name: "[PROD] Local Runner - Full Setup"
on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/proxmox/lxc/local_runner/**'
      - 'ansible/prod/playbooks/local-runner/setup_tools.yml'
      - '.github/workflows/prod-local-runner-full-setup.yml'

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/proxmox/lxc/local_runner

jobs:

  deploy:
    name: "1. Deploy local_runner LXC"
    runs-on: mac-mini
    if: ${{ vars.PROD_INFRA_LOCAL_RUNNER_LOCK != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}


    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Fetch the needed secrets expected inside the tf code variables
      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id prod/proxmox/terraform-token \
            --query SecretString --output text)

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          # Mask BEFORE any use
          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          # Fetch Ansible SSH public key
          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id prod/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "TF_VAR_ssh_public_keys=[\"${ANSIBLE_SSH_KEY}\"]" >> $GITHUB_ENV

          # Fetch LXC root password for SSH access
          LXC_PWD=$(aws secretsmanager get-secret-value \
            --secret-id prod/golden-image/lxc-root-password \
            --query SecretString --output text)
          echo "::add-mask::${LXC_PWD}"
          echo "LXC_PWD=${LXC_PWD}" >> $GITHUB_ENV
          echo "TF_VAR_root_password=${LXC_PWD}" >> $GITHUB_ENV


      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

      - name: Generate local_runner SSH Key and Store in AWS
        run: |
          # Generate SSH key on local_runner (skip if exists)
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.53.20 \
            "test -f ~/.ssh/id_ed25519 || ssh-keygen -q -t ed25519 -C 'local-runner' -f ~/.ssh/id_ed25519 -N ''"

          # Fetch the public key
          LOCAL_RUNNER_SSH_KEY=$(sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.53.20 "cat ~/.ssh/id_ed25519.pub")
          echo "::add-mask::${LOCAL_RUNNER_SSH_KEY}"

          # Update AWS secret
          aws secretsmanager put-secret-value \
            --secret-id prod/local-runner/ssh-public-key \
            --secret-string "${LOCAL_RUNNER_SSH_KEY}" > /dev/null
          echo "Updated prod/local-runner/ssh-public-key"

          echo "LOCAL_RUNNER_SSH_KEY=${LOCAL_RUNNER_SSH_KEY}" >> $GITHUB_ENV

      - name: Copy local_runner SSH Key to Ansible LXC
        run: |
          # Add local_runner key to Ansible's authorized_keys
          # Allows GH runner to SSH into Ansible to trigger playbooks
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@10.0.53.10 \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo '${LOCAL_RUNNER_SSH_KEY}' >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys" > /dev/null
          echo "local_runner SSH key added to Ansible"

##### Job 2: Setup GH Runner #####
  # Lock: PROD_SVC_GH_RUNNER_LOCK
  # Variables required in GitHub repo settings:
  # - PROD_GH_RUNNER_TOKEN: Fresh token from Settings > Actions > Runners (update before running)
  # - PROD_GH_RUNNER_NAME: Runner name (default: prod-local-runner)
  # - PROD_GH_RUNNER_LABELS: Runner labels (default: prod-local-runner)
  setup:
    name: "2. Setup GH Runner"
    runs-on: mac-mini
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' && vars.PROD_SVC_GH_RUNNER_LOCK != 'true' }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch LXC root password
        run: |
          LXC_PWD=$(aws secretsmanager get-secret-value \
            --secret-id prod/golden-image/lxc-root-password \
            --query SecretString --output text)
          echo "::add-mask::${LXC_PWD}"
          echo "LXC_PWD=${LXC_PWD}" >> $GITHUB_ENV

      - name: Install GitHub Runner on LXC
        env:
          RUNNER_TOKEN: ${{ secrets.PROD_GH_RUNNER_TOKEN }}
          RUNNER_NAME: ${{ vars.PROD_GH_RUNNER_NAME }}
          RUNNER_LABELS: ${{ vars.PROD_GH_RUNNER_LABELS }}
        run: |
          # Stop existing service and clean old config (handles orphaned configs)
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.53.20 \
            "cd /opt/actions-runner 2>/dev/null && ./svc.sh stop 2>/dev/null; ./svc.sh uninstall 2>/dev/null; rm -f .runner .credentials .credentials_rsaparams .service 2>/dev/null; exit 0"

          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.53.20 "
            # Create runner user (as root)
            id runner > /dev/null 2>&1 || useradd -m runner

            # Setup directory (as root)
            mkdir -p /opt/actions-runner
            cd /opt/actions-runner

            # Download if not exists (as root)
            [ -f actions-runner-linux-x64-2.331.0.tar.gz ] || \
              curl -sL -o actions-runner-linux-x64-2.331.0.tar.gz \
              https://github.com/actions/runner/releases/download/v2.331.0/actions-runner-linux-x64-2.331.0.tar.gz

            # Extract (as root)
            tar xzf ./actions-runner-linux-x64-2.331.0.tar.gz

            # Set ownership (as root)
            chown -R runner:runner /opt/actions-runner

            # Copy root SSH keys to runner user (allows runner to SSH to other LXCs)
            mkdir -p /home/runner/.ssh
            cp /root/.ssh/id_ed25519 /root/.ssh/id_ed25519.pub /home/runner/.ssh/ 2>/dev/null || true
            chown -R runner:runner /home/runner/.ssh
            chmod 600 /home/runner/.ssh/id_ed25519 2>/dev/null || true
          "

          # Configure runner
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.53.20 \
            "su - runner -c 'cd /opt/actions-runner && ./config.sh --unattended --replace --url https://github.com/mohamedsabry-dev/hybrid-cloud-infrastructure --token ${{ secrets.PROD_GH_RUNNER_TOKEN }} --name ${{ vars.PROD_GH_RUNNER_NAME }} --labels ${{ vars.PROD_GH_RUNNER_LABELS }} --work _work'"

          # Install and start service
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.53.20 \
            "cd /opt/actions-runner && ./svc.sh install runner && ./svc.sh start"

##### Job 3: Install Tools on Local Runner #####
  # Lock: PROD_SVC_LOCAL_RUNNER_TOOLS_LOCK
  install-tools:
    name: "3. Install Tools on Local Runner"
    runs-on: prod-local-runner
    needs: setup
    if: ${{ always() && needs.setup.result != 'failure' && needs.setup.result != 'cancelled' && vars.PROD_SVC_LOCAL_RUNNER_TOOLS_LOCK != 'true' }}

    steps:
      - name: Pull latest code
        run: |
          ssh root@10.0.53.10 "cd /srv/repo/ && git pull origin prod"

      - name: Run setup_tools playbook
        run: |
          ssh root@10.0.53.10 "\
            cd /srv/repo/ansible/prod && \
            ansible-playbook -i inventory/first_setup_inventory.ini playbooks/local-runner/setup_tools.yml"

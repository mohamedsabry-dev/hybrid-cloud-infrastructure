name: "Terraform Apply (Auto-Trigger)"

on:
  push:
    branches:
      - 'mohamedsabrydev/**'
      - main
    paths:
      - 'terraform/aws/bootstrap-test/**'

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================
  # JOB 1: NETWORK (The Foundation)
  # =========================================================
  apply-network:
    name: "1. Network Apply"
    # 👇 GLOBAL GATEKEEPER: Only runs if 'tfrun' is in the commit message
    if: contains(github.event.head_commit.message, 'tfrun')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws/bootstrap-test/network

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-Network
          aws-region: eu-west-2

      - run: terraform init
      - run: terraform apply -auto-approve

  # =========================================================
  # JOB 2: APPLICATION (The House)
  # =========================================================
  apply-app:
    name: "2. App Apply"
    needs: apply-network # Waits for Network
    if: contains(github.event.head_commit.message, 'tfrun')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws/bootstrap-test/app

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-Application
          aws-region: eu-west-2

      - run: terraform init
      - run: terraform apply -auto-approve

  # =========================================================
  # JOB 3: AUDIT (The Inspector)
  # =========================================================
  audit-check:
    name: "3. Audit Verification"
    needs: apply-app # Waits for App
    if: contains(github.event.head_commit.message, 'tfrun')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws/bootstrap-test/audit

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-ReadOnly
          aws-region: eu-west-2

      - run: terraform init
      
      # We use PLAN here because ReadOnly users shouldn't change state.
      # If this passes, it proves the Auditor can see the infrastructure.
      - run: terraform plan -no-color
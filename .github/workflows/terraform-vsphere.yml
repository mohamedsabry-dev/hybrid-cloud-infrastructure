name: "Terraform vSphere"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

jobs:
  vsphere-plan:
    name: "vSphere Plan"
    runs-on: self-hosted
    if: contains(github.event.head_commit.message, 'runtf.vsphere') || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: ./03-AUTOMATION/terraform/on-premise/setup-vsphere

    env:
      # AWS credentials for S3 backend
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ADMIN_AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_ADMIN_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-west-2
      # vSphere credentials
      TF_VAR_vsphere_user: ${{ secrets.VSPHERE_USER }}
      TF_VAR_vsphere_password: ${{ secrets.VSPHERE_PASSWORD }}
      TF_VAR_vsphere_server: ${{ secrets.VSPHERE_SERVER }}
      TF_VAR_datacenter_name: ${{ secrets.VSPHERE_DATACENTER }}
      # Terraform plugin cache
      TF_PLUGIN_CACHE_DIR: /Users/sabry/.terraform.d/plugin-cache

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Terraform Plan"
        run: terraform plan

      - name: "Terraform Apply"
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: "Show Outputs"
        if: github.event.inputs.action == 'apply'
        run: terraform output
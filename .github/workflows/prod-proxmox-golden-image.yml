# prod Proxmox Golden Image VM deployment
# Creates VM from ISO for manual installation

name: "prod - Proxmox Golden Image"

on:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/proxmox/vms/golden-image/**'
      - '.github/workflows/prod-proxmox-golden-image.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/proxmox/vms/golden-image

jobs:
  #=============================================================================
  # Create VM via Terraform
  #=============================================================================
  create-vm:
    name: "Create Golden Image VM (prod)"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_prod }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "⚠️  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console → DynamoDB → Tables"
          echo "→ hybrid-cloud-infrastructure-tf-state-lock-dev"
          echo "→ Explore items >> Find the Locked ID"
          echo "→ Delete item"
          echo ""
          echo "=============================================="

      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

      - name: Display Setup Instructions
        if: steps.apply.outcome == 'success'
        run: |
          echo "=============================================="
          echo "  VM CREATED - MANUAL SETUP REQUIRED"
          echo "=============================================="
          echo ""
          terraform output -raw golden_image.setup_instructions
          echo ""
          echo "=============================================="
          echo ""
          echo "After completing setup and converting to template,"
          echo "update the Terraform code to reference the template"
          echo "for future VM cloning operations."
          echo "=============================================="
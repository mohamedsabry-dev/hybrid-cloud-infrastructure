# Dev IAM module deployment#
# Triggers on push to dev branch when IAM files change

name: "Dev - IAM"

on:
  push:
    branches:
      - dev-security
    paths:
      - 'terraform/dev/aws/iam/**'
      - '.github/workflows/dev-iam.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: terraform/dev/aws/iam

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018571635409:role/GitHubActions-TerraformAdmin-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

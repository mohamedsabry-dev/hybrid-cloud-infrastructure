# Dev IAM module deployment
# Triggers on push to dev branch when IAM files change

name: "Dev - IAM"

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/iam/**'
      - '.github/workflows/dev-iam.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/dev/aws/iam

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018571635409:role/GitHubActions-TerraformAdmin-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      # TODO: Remove -lock=false after AWS account verification completes
      - name: Terraform Plan
        run: terraform plan -lock=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -lock=false -auto-approve tfplan

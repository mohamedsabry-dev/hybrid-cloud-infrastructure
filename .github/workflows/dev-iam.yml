# Dev IAM module deployment
# Triggers on push to dev branch when IAM files change

name: "Dev - IAM"

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/iam/**'
      - '.github/workflows/dev-iam.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/dev/aws/iam

    steps:
      - name: Checkout
        run: |
          rm -rf * .[^.]* 2>/dev/null || true
          git clone --depth 1 https://github.com/mohamedsabry-dev/hybrid-cloud-infrastructure.git .
          git fetch origin ${{ github.sha }} --depth 1
          git checkout ${{ github.sha }}

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          role-to-assume: arn:aws:iam::018571635409:role/GitHubActions-TerraformAdmin-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

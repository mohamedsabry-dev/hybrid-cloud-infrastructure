# Prod secrets module deployment
# Triggers on push to prod branch when secrets files change

name: "Prod - Secrets"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/prod/aws/secrets/**'
      - '.github/workflows/prod-secrets.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/prod/aws/secrets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-Infrastructure-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

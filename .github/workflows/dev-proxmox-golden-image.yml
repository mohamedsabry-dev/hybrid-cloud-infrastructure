# Dev Proxmox Golden Image VM deployment
# Creates VM from ISO for manual installation

name: "Dev - Proxmox Golden Image"

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/proxmox/vms/golden-image/**'
      - '.github/workflows/dev-proxmox-golden-image.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/proxmox/vms/golden-image

jobs:

  #=============================================================================
  # Create VM via Terraform
  #=============================================================================
  create-vm:
    name: "Create Golden Image VM (dev)"
    runs-on: mac-mini
    # Skip if locked (unless manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GOLDEN_IMAGE_DEV_LOCKED != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}


      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)

          SSH_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/ssh-admin-password \
            --query SecretString --output text)

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          # Mask BEFORE any use
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${SSH_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"   # mask the combined token too

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV
          echo "TF_VAR_proxmox_ssh_password=${SSH_SECRET}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "⚠️  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console → DynamoDB → Tables"
          echo "→ hybrid-cloud-infrastructure-tf-state-lock-dev"
          echo "→ Explore items >> Find the Locked ID"
          echo "→ Delete item"
          echo ""
          echo "=============================================="

      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"
          echo "scp infrastructure/compute/golden-image-setup.sh root@10.0.63.99:/tmp/"


      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

      - name: Display Setup Instructions
        if: steps.apply.outcome == 'success'
        run: |
          echo "=============================================="
          echo "  VM CREATED - MANUAL SETUP REQUIRED"
          echo "=============================================="
          echo ""
          terraform output -json golden_image | jq -r '.setup_instructions'
          echo ""
          echo "=============================================="
          echo ""
          echo "After completing setup and converting to template,"
          echo "update the Terraform code to reference the template"
          echo "for future VM cloning operations."
          echo "=============================================="
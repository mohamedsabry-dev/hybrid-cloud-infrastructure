# Prod Proxmox Test Clones - Verify Golden Image Template
# Creates test VM from template, waits for shutdown, then cleans up

#### Define Block ####
# 1. Define the job name on GH UI
# 2. Define the run condition "On push : Where ?"
# 3. Define the working directory path on GH Level
# 4. Declare if will use manual trigger later or not
# 5. Declare the needed permissions for OIDC Use
# 6. Declare Env Variables for clean use
name: "Prod - Test Golden Image Clones"
on:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/proxmox/vms/test-clones/**'
      - '.github/workflows/prod-proxmox-test-clones.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/proxmox/vms/test-clones
#####################
#####################


jobs:
##### Job 1: Deploy Test VM #####
  # 1. Name the job on GH UI
  # 2. Define which runner to use
  # 3. Define the manual safe lock trigger for workflow_dispatch
  # 4. Define the default working directory for all steps in this job
  deploy:
    name: "Deploy Test VM"
    runs-on: macOS
    if: ${{ github.event_name == 'workflow_dispatch' || vars.TEST_CLONES_PROD_LOCKED != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
#####################
#####################


##### Steps (Job 1) #####
  # 1. Copy Code to the work place
  # 2. Authenticate with AWS for OIDC and Assume the iam role
  # 3. Initialize Tf working directory
  # 4. Plan "dry run" the Tf code and out to tfplan
  # 5. Only appear if plan fail to execute in middle and DB LockID Triggered
  # 6. Give yourself small window to review the plan output before execute
  # 7. Apply the planned content inside tfplan file
  # 8. In case of previous success, display test instructions
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_prod }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console -> DynamoDB -> Tables"
          echo "-> hybrid-cloud-infrastructure-tf-state-lock-prod"
          echo "-> Explore items >> Find the Locked ID"
          echo "-> Delete item"
          echo ""
          echo "=============================================="

      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"



      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Show Test Instructions
        run: |
          echo "=============================================="
          echo "  TEST VM CREATED"
          echo "=============================================="
          echo ""
          echo "VM:"
          echo "  - test-vm-01: 10.0.53.98 (VLAN 53)"
          echo ""
          echo "Verify manually via SSH, then shutdown the VM."
          echo "Workflow will auto-destroy after shutdown."
          echo "=============================================="

  #=============================================================================
  # Job 2: Review Window (5 minutes before destroy)
  #=============================================================================
  review:
    name: "Review Window"
    needs: deploy
    runs-on: mac-mini

    steps:
      - name: Wait 5 minutes for testing
        run: |
          echo "=============================================="
          echo "  REVIEW WINDOW - 5 MINUTES"
          echo "=============================================="
          echo ""
          echo "SSH to VM and verify:"
          echo "  ssh root@10.0.60.10"
          echo ""
          echo "Cancel this workflow if you need more time."
          echo ""
          echo "Auto-destroy in 300 seconds..."
          echo ""
          for i in $(seq 300 -30 30); do
            echo "  $i seconds remaining..."
            sleep 30
          done
          echo ""
          echo "Proceeding to cleanup..."

  #=============================================================================
  # Job 3: Cleanup Test VM
  #=============================================================================
  cleanup:
    name: "Cleanup Test VM"
    needs: review
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_prod }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          echo "Cleaning up test VM..."
          terraform destroy -auto-approve
          echo ""
          echo "=============================================="
          echo "  TEST VM DESTROYED"
          echo "=============================================="

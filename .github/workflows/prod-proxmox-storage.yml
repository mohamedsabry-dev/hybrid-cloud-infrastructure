# =============================================================================
# PROD Proxmox Storage Config
# =============================================================================
# Configures NFS storage mounts on Proxmox (NAS ISO and data storage)
# =============================================================================

name: "[PROD] Proxmox Storage Config"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to prod branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/proxmox/storage/nas/**'
      - '.github/workflows/prod-proxmox-storage.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/proxmox/storage/nas

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Configure NAS Storage
  # Mounts NFS shares for ISO templates and VM data
  # Lock: PROD_PROXMOX_STORAGE_NAS_CONFIG
  # ---------------------------------------------------------------------------
  config-nas:
    name: "Configure Proxmox Storage NAS"
    runs-on: mac-mini
    if: ${{ vars.PROD_PROXMOX_STORAGE_NAS_CONFIG != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_PROD }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id prod/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

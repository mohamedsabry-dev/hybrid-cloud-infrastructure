name: "Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: false
        default: 'main'
        type: string
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================
  # JOB 1: cloudtrail (The Foundation)
  # =========================================================
  apply-cloudtrail:
    name: "1. Cloudtrail Apply"
    if: inputs.confirm == 'deploy'
    runs-on: production
    defaults:
      run:
        working-directory: cloud/aws/bootstrap/terraform/audit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-Audit
          aws-region: eu-west-2

      - run: terraform init
      - run: terraform apply -auto-approve

name: "Terraform Apply (Auto-Trigger)"

on:
  push:
    branches:
      - mohamedsabrydev/infra-245-phase-1-devops-foundation
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================
  # JOB 1: cloudtrail (The Foundation)
  # =========================================================
  apply-cloudtrail:
    name: "1. Cloudtrail Apply"
    # 👇 GLOBAL GATEKEEPER: Only runs if 'tf-prod-deploy' is in the commit message
    if: contains(github.event.head_commit.message, 'tf-prod-deploy')
    runs-on: production
    defaults:
      run:
        working-directory: cloud/aws/bootstrap/terraform/audit

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_PROD:role/GitHubActions-Audit
          aws-region: eu-west-2

      - run: terraform init
      - run: terraform apply -auto-approve


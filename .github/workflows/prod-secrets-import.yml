# One-time workflow to import existing Secrets Manager resources into Terraform state
# Delete this workflow after successful import

name: "Prod - Secrets Import"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: "Import Existing Resources"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/prod/aws/secrets

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-TerraformAdmin-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Import Secret
        run: |
          if terraform state show aws_secretsmanager_secret.proxmox_terraform 2>/dev/null; then
            echo "Secret already in state, skipping import"
          else
            echo "Importing secret..."
            SECRET_ARN=$(aws secretsmanager describe-secret \
              --secret-id prod/proxmox/terraform-token \
              --query 'ARN' --output text)
            terraform import aws_secretsmanager_secret.proxmox_terraform "$SECRET_ARN"
          fi

      - name: Import Secret Version
        run: |
          if terraform state show aws_secretsmanager_secret_version.proxmox_terraform 2>/dev/null; then
            echo "Secret version already in state, skipping import"
          else
            echo "Importing secret version..."
            SECRET_ARN=$(aws secretsmanager describe-secret \
              --secret-id prod/proxmox/terraform-token \
              --query 'ARN' --output text)
            VERSION_ID=$(aws secretsmanager describe-secret \
              --secret-id prod/proxmox/terraform-token \
              --query 'VersionIdsToStages | keys(@) | [0]' --output text)
            terraform import aws_secretsmanager_secret_version.proxmox_terraform "${SECRET_ARN}|${VERSION_ID}"
          fi

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

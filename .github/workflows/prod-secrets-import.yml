# One-time workflow to import existing Secrets Manager resources into Terraform state
# Delete this workflow after successful import

name: "Prod - Secrets Import"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: "Import Existing Resources"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/prod/aws/secrets

    steps:
      - uses: ./.github/actions/checkout
        with:
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-TerraformAdmin-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Import Secret
        run: |
          terraform import aws_secretsmanager_secret.proxmox_terraform \
            prod/proxmox/terraform-token || true

      - name: Import Secret Version
        run: |
          # Get the secret ARN first
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id prod/proxmox/terraform-token \
            --query 'ARN' --output text)

          # Get the current version ID
          VERSION_ID=$(aws secretsmanager describe-secret \
            --secret-id prod/proxmox/terraform-token \
            --query 'VersionIdsToStages | keys(@) | [0]' --output text)

          terraform import aws_secretsmanager_secret_version.proxmox_terraform \
            "${SECRET_ARN}|${VERSION_ID}" || true

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

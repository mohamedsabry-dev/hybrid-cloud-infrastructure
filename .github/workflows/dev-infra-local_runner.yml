# Dev Proxmox local_runner LXC - Setup Core & Verify Golden Image Template

#### Define Block ####
# 1. Define the job name on GH UI
# 2. Define the run condition "On push : Where ?"
# 3. Define the working directory path on GH Level
# 4. Declare if will use manual trigger later or not
# 5. Declare the needed permissions for OIDC Use
# 6. Declare Env Variables for clean use
name: "[DEV] Infra - Local Runner LXC"
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/dev/proxmox/lxc/local_runner/**'
      - '.github/workflows/dev-infra-local_runner.yml'
permissions:
  id-token: write
  contents: read
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/proxmox/lxc/local_runner
#####################
#####################


jobs:
##### Job 1: Deploy local_runner LXC #####
  # 1. Name the job on GH UI
  # 2. Define which runner to use
  # 3. Define the manual safe lock trigger for workflow_dispatch
  # 4. Define the default working directory for all steps in this job
  deploy:
    name: "Deploy local_runner LXC"
    runs-on: macOS
    if: ${{ vars.LOCAL_RUNNER_DEV_LOCKED != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
#####################
#####################


##### Steps (Job 1) #####
  # 1. Copy Code to the work place
  # 2. Authenticate with AWS for OIDC and Assume the iam role
  # 3. Initialize Tf working directory
  # 4. Plan "dry run" the Tf code and out to tfplan
  # 5. Only appear if plan fail to execute in middle and DB LockID Triggered
  # 6. Give yourself small window to review the plan output before execute
  # 7. Apply the planned content inside tfplan file
  # 8. In case of previous success, display test instructions
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}
 
      # 3. Fetch the needed secrets expected inside the tf code variables
      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          # Mask BEFORE any use
          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          # Fetch Ansible SSH public key
          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id dev/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "ANSIBLE_SSH_KEY=${ANSIBLE_SSH_KEY}" >> $GITHUB_ENV

          # Fetch LXC root password for SSH access
          LXC_PWD=$(aws secretsmanager get-secret-value \
            --secret-id dev/golden-image/lxc-root-password \
            --query SecretString --output text)
          echo "::add-mask::${LXC_PWD}"
          echo "LXC_PWD=${LXC_PWD}" >> $GITHUB_ENV
          

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console -> DynamoDB -> Tables"
          echo "-> hybrid-cloud-infrastructure-tf-state-lock-dev"
          echo "-> Explore items >> Find the Locked ID"
          echo "-> Delete item"
          echo ""
          echo "=============================================="

      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

      - name: Copy Ansible SSH Key to local_runner
        run: |
          # Wait for LXC to be fully ready
          echo "Waiting for LXC to be ready..."
          sleep 30

          # Add Ansible public key to authorized_keys on local_runner LXC
          sshpass -p "${LXC_PWD}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@10.0.63.20 \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo '${ANSIBLE_SSH_KEY}' >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo 'Ansible SSH key added successfully'"

      - name: Generate local_runner SSH Key and Store in AWS
        run: |
          # Generate SSH key on local_runner (skip if exists)
          sshpass -p "${LXC_PWD}" ssh -o StrictHostKeyChecking=no root@10.0.63.20 \
            "test -f ~/.ssh/id_ed25519 || ssh-keygen -t ed25519 -C 'local-runner' -f ~/.ssh/id_ed25519 -N ''"

          # Fetch the public key
          LOCAL_RUNNER_SSH_KEY=$(sshpass -p "${LXC_PWD}" ssh -o StrictHostKeyChecking=no root@10.0.63.20 "cat ~/.ssh/id_ed25519.pub")
          echo "::add-mask::${LOCAL_RUNNER_SSH_KEY}"

          # Update AWS secret
          aws secretsmanager put-secret-value \
            --secret-id dev/local-runner/ssh-public-key \
            --secret-string "${LOCAL_RUNNER_SSH_KEY}"
          echo "Updated dev/local-runner/ssh-public-key"

          echo "LOCAL_RUNNER_SSH_KEY=${LOCAL_RUNNER_SSH_KEY}" >> $GITHUB_ENV

      - name: Copy local_runner SSH Key to Ansible LXC
        run: |
          # Add local_runner key to Ansible's authorized_keys
          # Allows GH runner to SSH into Ansible to trigger playbooks
          sshpass -p "${LXC_PWD}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@10.0.63.10 \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo '${LOCAL_RUNNER_SSH_KEY}' >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo 'local_runner SSH key added to Ansible'"

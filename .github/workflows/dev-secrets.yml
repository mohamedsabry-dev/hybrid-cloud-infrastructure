# Dev secrets module deployment
# Triggers on push to dev branch when secrets files change

name: "Dev - Secrets"

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/secrets/**'
      - '.github/workflows/dev-secrets.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: terraform/dev/aws/secrets

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018571635409:role/GitHubActions-Infrastructure-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
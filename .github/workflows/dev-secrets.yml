# Dev secrets module deployment
# Triggers on push to dev branch when secrets files change

name: "Dev - Secrets"

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/secrets/**'
      - '.github/workflows/dev-secrets.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/dev/aws/secrets

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_DEV:role/GitHubActions-Infrastructure-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

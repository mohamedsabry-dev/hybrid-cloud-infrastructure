# Dev secrets module deployment
# Triggers on push to dev branch when secrets files change

#### Define Block ####
# 1. Define the job name on GH UI
# 2. Define the run condition "On push : Where ?"
# 3. Define the working directory path on GH Level
# 4. Declare if will use manual trigger later or not
# 5. Declare the needed permissions for OIDC Use
# 6. Declare Env Variables for clean use
name: "[DEV] Secrets"
on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/secrets/**'
      - '.github/workflows/dev-secrets.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/aws/secrets
#####################
#####################


jobs:
##### Job 1 Core #####
  # 1. Name the job on GH UI
  # 2. Define which runner to use
  # 3. Define the default working directory for all steps in this job
  deploy:
    name: "Plan & Apply (dev)"
    runs-on: macOS

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
#####################
#####################


##### Steps #####
  # 1. Copy Code to the work place
  # 2. Authenticate with AWS for OIDC and Assume the iam role
  # 3. Initialize Tf working directory
  # 4. Plan "dry run" the Tf code and out to tfplan
  # 5. Only appear if plan fail to execute in middle and DB LockID Triggered
  # 6. Give yourself small window to review the plan output before execute
  # 7. Apply the planned content inside tfplan file
  # 8. In case of previous success, display reminder to update placeholder values
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "⚠️  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console → DynamoDB → Tables"
          echo "→ hybrid-cloud-infrastructure-tf-state-lock-dev"
          echo "→ Explore items >> Find the Locked ID"
          echo "→ Delete item"
          echo ""
          echo "=============================================="

      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Post-Deployment Reminder
        if: success()
        run: |
          echo "=============================================="
          echo "  SECRETS CREATED - UPDATE PLACEHOLDER VALUES"
          echo "=============================================="
          echo ""
          echo "Update the following secrets with actual values:"
          echo ""
          echo "# Proxmox API Token"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id ${{ env.ENVIRONMENT }}/proxmox/terraform-token \\"
          echo "  --secret-string '{\"token_id\":\"tf_${{ env.ENVIRONMENT }}@pve!terraform\",\"token_secret\":\"YOUR_ACTUAL_TOKEN\"}'"
          echo ""
          echo "# Proxmox SSH Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id ${{ env.ENVIRONMENT }}/proxmox/ssh-admin-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# VM Root Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id ${{ env.ENVIRONMENT }}/proxmox/vm-root-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# Gandalf Break-Glass Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  ---secret-id ${{ env.ENVIRONMENT }}/vm/gandalf-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "=============================================="
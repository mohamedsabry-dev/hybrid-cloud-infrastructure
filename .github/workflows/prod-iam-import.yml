# One-time workflow to import existing IAM resources into Terraform state
# Delete this workflow after successful import

name: "Prod - IAM Import"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: "Import Existing Resources"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/prod/aws/iam

    steps:
      - name: Checkout
        run: |
          rm -rf * .[^.]* 2>/dev/null || true
          git clone --depth 1 https://github.com/mohamedsabry-dev/hybrid-cloud-infrastructure.git .
          git fetch origin ${{ github.sha }} --depth 1
          git checkout ${{ github.sha }}

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-TerraformAdmin-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Import IAM Policies
        run: |
          terraform import aws_iam_policy.terraform_state_prod \
            arn:aws:iam::969041180300:policy/TerraformState-Prod || true

          terraform import aws_iam_policy.security_boundary_prod \
            arn:aws:iam::969041180300:policy/SecurityBoundary-Prod || true

      - name: Import IAM Role
        run: |
          terraform import aws_iam_role.github_actions_infrastructure \
            GitHubActions-Infrastructure-prod || true

      - name: Import Role Policy Attachments
        run: |
          terraform import aws_iam_role_policy_attachment.infra_role_power_user \
            GitHubActions-Infrastructure-prod/arn:aws:iam::aws:policy/PowerUserAccess || true

          terraform import aws_iam_role_policy_attachment.infra_role_security_boundary \
            GitHubActions-Infrastructure-prod/arn:aws:iam::969041180300:policy/SecurityBoundary-Prod || true

          terraform import aws_iam_role_policy_attachment.infra_role_tf_state \
            GitHubActions-Infrastructure-prod/arn:aws:iam::969041180300:policy/TerraformState-Prod || true

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

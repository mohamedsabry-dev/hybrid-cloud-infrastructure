# One-time workflow to import existing IAM resources into Terraform state
# Delete this workflow after successful import

name: "Prod - IAM Import"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: "Import Existing Resources"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/prod/aws/iam

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_PROD:role/GitHubActions-TerraformAdmin-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Import IAM Policies
        run: |
          if ! terraform state show aws_iam_policy.terraform_state_prod 2>/dev/null; then
            terraform import aws_iam_policy.terraform_state_prod arn:aws:iam::REDACTED_AWS_PROD:policy/TerraformState-Prod
          fi
          if ! terraform state show aws_iam_policy.security_boundary_prod 2>/dev/null; then
            terraform import aws_iam_policy.security_boundary_prod arn:aws:iam::REDACTED_AWS_PROD:policy/SecurityBoundary-Prod
          fi

      - name: Import IAM Role
        run: |
          if ! terraform state show aws_iam_role.github_actions_infrastructure 2>/dev/null; then
            terraform import aws_iam_role.github_actions_infrastructure GitHubActions-Infrastructure-prod
          fi

      - name: Import Role Policy Attachments
        run: |
          if ! terraform state show aws_iam_role_policy_attachment.infra_role_power_user 2>/dev/null; then
            terraform import aws_iam_role_policy_attachment.infra_role_power_user GitHubActions-Infrastructure-prod/arn:aws:iam::aws:policy/PowerUserAccess
          fi
          if ! terraform state show aws_iam_role_policy_attachment.infra_role_security_boundary 2>/dev/null; then
            terraform import aws_iam_role_policy_attachment.infra_role_security_boundary GitHubActions-Infrastructure-prod/arn:aws:iam::REDACTED_AWS_PROD:policy/SecurityBoundary-Prod
          fi
          if ! terraform state show aws_iam_role_policy_attachment.infra_role_tf_state 2>/dev/null; then
            terraform import aws_iam_role_policy_attachment.infra_role_tf_state GitHubActions-Infrastructure-prod/arn:aws:iam::REDACTED_AWS_PROD:policy/TerraformState-Prod
          fi

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

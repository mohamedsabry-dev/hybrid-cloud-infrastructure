# Test manual trigger from dev branch
name: "Test - Manual Trigger"

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Test message'
        required: false
        default: 'Hello from dev branch'

jobs:
  test:
    name: "Test Manual Trigger"
    runs-on: mac-mini

    steps:
      - name: Print info
        run: |
          echo "=============================================="
          echo "  Manual trigger works!"
          echo "=============================================="
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Message: ${{ inputs.message }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "=============================================="

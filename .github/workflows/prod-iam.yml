# Prod IAM module deployment
# Triggers on push to main branch when IAM files change

name: "Prod - IAM"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/prod/aws/iam/**'
      - '.github/workflows/prod-iam.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/prod/aws/iam

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_AWS_PROD:role/GitHubActions-TerraformAdmin-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

# Prod IAM module deployment
# Triggers on push to prod branch when IAM files change

name: "Prod - IAM"

on:
  push:
    branches:
      - prod-security
    paths:
      - 'terraform/prod/aws/iam/**'
      - '.github/workflows/prod-iam.yml'

permissions:
  id-token: write
  contents: read
  
env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/aws/iam

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_prod }}:role/GitHubActions-TerraformAdmin-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "⚠️  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console → DynamoDB → Tables"
          echo "→ hybrid-cloud-infrastructure-tf-state-lock-dev"
          echo "→ Explore items >> Find the Locked ID"
          echo "→ Delete item"
          echo ""
          echo "=============================================="


      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

name: "[DEV] Proxmox Storage Config"

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/proxmox/storage/nas/**'
      - '.github/workflows/dev-proxmox-storage.yml'

permissions:
  id-token: write
  contents: read
  
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/proxmox/storage/nas

jobs:
  config-nas:
    name: "Configure Proxmox Storage NAS"
    runs-on: mac-mini
    if: ${{ vars.DEV_PROXMOX_STORAGE_NAS_CONFIG != 'true' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      # Fetch the needed secrets expected inside the tf code variables
      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
              --secret-id dev/proxmox/terraform-token \
              --query SecretString --output text)

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          # Mask BEFORE any use
          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Import
        run: |
          terraform state show proxmox_virtual_environment_storage_nfs.nas_iso > /dev/null 2>&1 || \
          terraform import proxmox_virtual_environment_storage_nfs.nas_iso pve-dev:nas-iso

          terraform state show proxmox_virtual_environment_storage_nfs.nas_data > /dev/null 2>&1 || \
          terraform import proxmox_virtual_environment_storage_nfs.nas_data pve-dev:nas-dev-data

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

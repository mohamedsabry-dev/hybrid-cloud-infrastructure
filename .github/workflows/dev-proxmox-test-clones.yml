# Dev Proxmox Test Clones - Verify Golden Image Template
# Creates test VM from template, waits for shutdown, then cleans up

name: "Dev - Test Golden Image Clones"

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/proxmox/vms/test-clones/**'
      - '.github/workflows/dev-proxmox-test-clones.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/proxmox/vms/test-clones

jobs:
  #=============================================================================
  # Job 1: Deploy Test VM
  #=============================================================================
  deploy:
    name: "Deploy Test VM"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console -> DynamoDB -> Tables"
          echo "-> hybrid-cloud-infrastructure-tf-state-lock-dev"
          echo "-> Explore items >> Find the Locked ID"
          echo "-> Delete item"
          echo ""
          echo "=============================================="

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Show Test Instructions
        run: |
          echo "=============================================="
          echo "  TEST VM CREATED"
          echo "=============================================="
          echo ""
          echo "VM:"
          echo "  - test-vm-01: 10.0.60.10 (VLAN 60)"
          echo ""
          echo "Verify manually via SSH, then shutdown the VM."
          echo "Workflow will auto-destroy after shutdown."
          echo "=============================================="

  #=============================================================================
  # Job 2: Wait for VM to Shutdown
  #=============================================================================
  wait-shutdown:
    name: "Wait for VM Shutdown"
    needs: deploy
    runs-on: mac-mini
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Wait for VM to Shutdown
        run: |
          echo "Waiting for test VM to shutdown..."
          echo "SSH to VM, verify cloud-init, then run: shutdown -h now"
          echo ""

          # Get Proxmox credentials from AWS
          PROXMOX_CREDS=$(aws secretsmanager get-secret-value --secret-id dev/proxmox/terraform-token --query SecretString --output text)
          TOKEN_ID=$(echo "$PROXMOX_CREDS" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$PROXMOX_CREDS" | jq -r '.token_secret')
          TOKEN="${TOKEN_ID}=${TOKEN_SECRET}"

          PROXMOX_URL="https://pve-dev:8006/api2/json"
          NODE="pve-dev"

          # Poll VM until stopped
          while true; do
            VM_STATUS=$(curl -sk -H "Authorization: PVEAPIToken=$TOKEN" \
              "${PROXMOX_URL}/nodes/${NODE}/qemu/101/status/current" | jq -r '.data.status')

            echo "$(date '+%H:%M:%S') - VM 101: $VM_STATUS"

            if [ "$VM_STATUS" = "stopped" ]; then
              echo ""
              echo "VM is stopped. Proceeding to cleanup."
              break
            fi

            sleep 30
          done

  #=============================================================================
  # Job 3: Cleanup Test VM
  #=============================================================================
  cleanup:
    name: "Cleanup Test VM"
    needs: wait-shutdown
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          echo "Cleaning up test VM..."
          terraform destroy -auto-approve
          echo ""
          echo "=============================================="
          echo "  TEST VM DESTROYED"
          echo "=============================================="

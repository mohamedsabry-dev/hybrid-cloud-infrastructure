# Dev secrets module deployment
# Triggers on push to dev branch when secrets files change

#### Define Block ####
# 1. Define the job name on GH UI
# 2. Define the run condition "On push : Where ?"
# 3. Define the working directory path on GH Level
# 4. Declare if will use manual trigger later or not
# 5. Declare the needed permissions for OIDC Use
# 6. Declare Env Variables for clean use
name: "[DEV] AWS - Secrets"
on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/secrets/**'
      - '.github/workflows/dev-aws-secrets.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/aws/secrets
#####################
#####################


jobs:
  deploy:
    name: "Plan & Apply (dev)"
    runs-on: macOS
    # runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}


    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}


      # - name: Install Terraform
      #   uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Post-Deployment Reminder
        if: success()
        run: |
          echo "=============================================="
          echo "  SECRETS CREATED - UPDATE PLACEHOLDER VALUES"
          echo "=============================================="
          echo ""
          echo "Update the following secrets with actual values:"
          echo ""
          echo "# Proxmox API Token"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id dev/proxmox/terraform-token \\"
          echo "  --secret-string '{\"token_id\":\"tf_dev@pve!terraform\",\"token_secret\":\"YOUR_ACTUAL_TOKEN\"}'"
          echo ""
          echo "# Proxmox SSH Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id dev/proxmox/ssh-admin-dev-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# VM Root Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id dev/golden-image/vm-root-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# Break-Glass Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id dev/vm/break-glass-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# LXC Root Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id dev/golden-image/lxc-root-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "=============================================="
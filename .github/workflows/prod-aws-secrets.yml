# =============================================================================
# PROD AWS Secrets
# =============================================================================
# Deploys AWS Secrets Manager secrets (creates empty placeholders)
# After deployment, update secrets with actual values using the guide below
# =============================================================================

name: "[PROD] AWS - Secrets"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to prod branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/aws/secrets/**'
      - '.github/workflows/prod-aws-secrets.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/aws/secrets

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Deploy Secrets Manager Secrets
  # Creates secret placeholders - update with actual values after deployment
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy Secrets Manager Secrets"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_PROD }}

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # Guide for updating secrets after deployment
      - name: Post-Deployment Reminder
        if: success()
        run: |
          echo "=============================================="
          echo "  SECRETS CREATED - UPDATE PLACEHOLDER VALUES"
          echo "=============================================="
          echo ""
          echo "Update secrets with actual values using these formats:"
          echo ""
          echo "# For secrets with multiple key-value pairs (JSON):"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/<service>/<secret-name> \\"
          echo "  --secret-string '{\"key1\":\"value1\",\"key2\":\"value2\"}'"
          echo ""
          echo "# For secrets with single value:"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/<service>/<secret-name> \\"
          echo "  --secret-string 'YOUR_ACTUAL_VALUE'"
          echo ""
          echo "# List all prod secrets:"
          echo "aws secretsmanager list-secrets --query \"SecretList[?starts_with(Name,'prod/')].Name\""
          echo ""
          echo "=============================================="

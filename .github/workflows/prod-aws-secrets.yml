# Prod secrets module deployment
# Triggers on push to prod branch when secrets files change

#### Define Block ####
# 1. Define the job name on GH UI
# 2. Define the run condition "On push : Where ?"
# 3. Define the working directory path on GH Level
# 4. Declare if will use manual trigger later or not
# 5. Declare the needed permissions for OIDC Use
# 6. Declare Env Variables for clean use
name: "[PROD] AWS - Secrets"
on:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/aws/secrets/**'
      - '.github/workflows/prod-aws-secrets.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  ENVIRONMENT: prod
  TF_WORKING_DIR: terraform/prod/aws/secrets
#####################
#####################


jobs:
##### Job 1 Core #####
  # 1. Name the job on GH UI
  # 2. Define which runner to use
  # 3. Define the default working directory for all steps in this job
  deploy:
    name: "Plan & Apply (prod)"
    runs-on: macOS

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
#####################
#####################


##### Steps #####
  # 1. Copy Code to the work place
  # 2. Authenticate with AWS for OIDC and Assume the iam role
  # 3. Initialize Tf working directory
  # 4. Plan "dry run" the Tf code and out to tfplan
  # 5. Only appear if plan fail to execute in middle and DB LockID Triggered
  # 6. Give yourself small window to review the plan output before execute
  # 7. Apply the planned content inside tfplan file
  # 8. In case of previous success, display reminder to update placeholder values
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Post-Deployment Reminder
        if: success()
        run: |
          echo "=============================================="
          echo "  SECRETS CREATED - UPDATE PLACEHOLDER VALUES"
          echo "=============================================="
          echo ""
          echo "Update the following secrets with actual values:"
          echo ""
          echo "# Proxmox API Token"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/proxmox/terraform-token \\"
          echo "  --secret-string '{\"token_id\":\"tf_prod@pve!terraform\",\"token_secret\":\"YOUR_ACTUAL_TOKEN\"}'"
          echo ""
          echo "# Proxmox SSH Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/proxmox/ssh-admin-prod-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# VM Root Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/golden-image/vm-root-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# Break-Glass Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/vm/break-glass-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# LXC Root Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/golden-image/lxc-root-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# FreeIPA Admin Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/freeipa/admin-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# FreeIPA DM Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/freeipa/dm-password \\"
          echo "  --secret-string 'YOUR_ACTUAL_PASSWORD'"
          echo ""
          echo "# Super Bot Keytab (base64)"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/super_bot/keytab \\"
          echo "  --secret-string 'BASE64_KEYTAB'"
          echo ""
          echo "# Ansible Vault Password"
          echo "aws secretsmanager put-secret-value \\"
          echo "  --secret-id prod/ansible/vault-password \\"
          echo "  --secret-string 'YOUR_VAULT_PASSWORD'"
          echo ""
          echo "=============================================="
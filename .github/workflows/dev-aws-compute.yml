# =============================================================================
# DEV AWS Compute
# =============================================================================
# Deploys AWS compute resources (EC2 instances, VPN servers, etc.)
# Currently used for WireGuard VPN EC2 instance
# =============================================================================

name: "[DEV] AWS - Compute"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to dev branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/aws/compute/**'
      - '.github/workflows/dev-aws-compute.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/aws/compute

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Deploy WireGuard VPN EC2
  # Creates EC2 instance with security group for VPN access
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy WireGuard VPN EC2"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_DEV }}

      - name: Terraform Init
        run: terraform init

      # Variables are marked sensitive in TF - values will be redacted in plan output
      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -var="allowed_ip=${{ secrets.HOME_PUBLIC_IP }}/32" -var="vpn_public_key=${{ secrets.VPN_PUBLIC_KEY_DEV }}" -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # Post-deployment guide for WireGuard configuration
      - name: WireGuard Setup Guide
        if: success()
        run: |
          echo "=============================================="
          echo "  WIREGUARD POST-DEPLOYMENT SETUP"
          echo "=============================================="
          echo ""
          echo "1. Get the Elastic IP from Terraform output:"
          echo "   terraform output wireguard_public_ip"
          echo ""
          echo "2. Copy setup script to EC2:"
          echo "   scp -i vpn-key-pair-dev.pem network/setup-wireguard.sh ec2-user@<EIP>:~/"
          echo ""
          echo "3. SSH into the instance:"
          echo "   ssh -i vpn-key-pair-dev.pem ec2-user@<EIP>"
          echo ""
          echo "4. Run the setup script:"
          echo "   chmod +x setup-wireguard.sh && ./setup-wireguard.sh dev"
          echo ""
          echo "5. Copy the AWS Public Key shown by the script"
          echo ""
          echo "6. Update ER605 dev_tunnel:"
          echo "   - Interface Local IP: 172.16.200.1"
          echo "   - Peer Public Key: <new AWS key>"
          echo "   - Peer Endpoint: <NEW_EIP>:51820"
          echo "   - Peer AllowedIPs: 172.16.0.0/16"
          echo ""
          echo "7. Enter ER605 dev_tunnel public key when prompted"
          echo ""
          echo "8. Verify tunnel:"
          echo "   sudo wg show"
          echo "   ping 172.16.200.1"
          echo ""
          echo "NOTE: Tunnel IPs are in VPC range (172.16.200.x)"
          echo "      to solve ER605 AllowedIPs routing issue"
          echo "=============================================="

# Prod Proxmox resources module deployment
# Triggers on push to prod branch when Proxmox files change

name: "Prod - Proxmox Resources"

on:
  push:
    branches:
      - prod
    paths:
      - 'terraform/prod/proxmox/resources/**'
      - '.github/workflows/prod-proxmox-resources.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Plan & Apply"
    runs-on: mac-mini

    defaults:
      run:
        working-directory: terraform/prod/proxmox/resources

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969041180300:role/GitHubActions-Infrastructure-prod
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

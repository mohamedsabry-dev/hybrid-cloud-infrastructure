name: Build Remediation Image

on:
  push:
    branches:
      - dev
    paths:
      - 'docker/remediation/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: docker/remediation/
          push: true
          tags: ghcr.io/mohamedsabry-dev/remediation:latest
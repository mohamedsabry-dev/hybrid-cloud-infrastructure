# =============================================================================
# DEV AWS IAM
# =============================================================================
# Deploys IAM roles and policies for GitHub Actions OIDC authentication
# Triggers on dev-security branch (security-sensitive changes)
# =============================================================================

name: "[DEV] AWS - IAM"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to dev-security branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - dev-security
    paths:
      - 'terraform/dev/aws/iam/**'
      - '.github/workflows/dev-aws-iam.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/aws/iam

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Deploy IAM Roles & Policies
  # Uses TerraformAdmin role (requires elevated permissions for IAM changes)
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy IAM Roles & Policies"
    runs-on: mac-mini
    # runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-TerraformAdmin-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_DEV }}

      # - name: Install Terraform
      #   uses: hashicorp/setup-terraform@v2
      
      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -var="account_id=${{ secrets.AWS_ACCOUNT_ID_DEV }}" -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

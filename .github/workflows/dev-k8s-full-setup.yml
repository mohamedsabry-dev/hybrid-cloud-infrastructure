# =============================================================================
# DEV K8s Full Setup
# =============================================================================
# Deploys Kubernetes cluster VMs (masters and workers)
# Each job has its own lock - locked jobs skip to next, workflow continues
# =============================================================================

name: "[DEV] K8s - Full Setup"

# -----------------------------------------------------------------------------
# Triggers: Manual dispatch or push to dev branch
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/proxmox/vms/k8s_masters/**'
      - 'terraform/dev/proxmox/vms/k8s_workers/**'
      - 'ansible/dev/playbooks/k8s/**'
      - '.github/workflows/dev-k8s-full-setup.yml'

# -----------------------------------------------------------------------------
# Permissions: OIDC for AWS authentication
# -----------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  ENVIRONMENT: dev
  ANSIBLE_HOST: 10.0.63.10
  ANSIBLE_USER: root

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Deploy K8s Masters
  # Creates 3 master VMs for control plane
  # Lock: DEV_INFRA_K8S_MASTERS_LOCK
  # ---------------------------------------------------------------------------
  deploy-masters:
    name: "1. Deploy K8s Masters"
    runs-on: mac-mini
    if: ${{ vars.DEV_INFRA_K8S_MASTERS_LOCK != 'true' }}

    defaults:
      run:
        working-directory: terraform/dev/proxmox/vms/k8s_masters

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_DEV }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id dev/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "TF_VAR_ansible_ssh_public_key=${ANSIBLE_SSH_KEY}" >> $GITHUB_ENV

          VM_ROOT_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id dev/golden-image/vm-root-password \
            --query SecretString --output text)
          echo "::add-mask::${VM_ROOT_PASSWORD}"
          echo "TF_VAR_vm_root_password=${VM_ROOT_PASSWORD}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # Job 2: Deploy K8s Workers
  # Creates 3 worker VMs for workloads
  # Lock: DEV_INFRA_K8S_WORKERS_LOCK
  # ---------------------------------------------------------------------------
  deploy-workers:
    name: "2. Deploy K8s Workers"
    runs-on: mac-mini
    needs: deploy-masters
    if: ${{ always() && needs.deploy-masters.result != 'failure' && needs.deploy-masters.result != 'cancelled' && vars.DEV_INFRA_K8S_WORKERS_LOCK != 'true' }}

    defaults:
      run:
        working-directory: terraform/dev/proxmox/vms/k8s_workers

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_DEV }}

      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)
          echo "::add-mask::${API_SECRET}"

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id dev/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "TF_VAR_ansible_ssh_public_key=${ANSIBLE_SSH_KEY}" >> $GITHUB_ENV

          VM_ROOT_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id dev/golden-image/vm-root-password \
            --query SecretString --output text)
          echo "::add-mask::${VM_ROOT_PASSWORD}"
          echo "TF_VAR_vm_root_password=${VM_ROOT_PASSWORD}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 3-minute pause for manual review before applying
      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

# Setup Cluster K8s on all nodes
  deploy-k8s-cluster:
    name: "3. Setup K8s Cluster"
    runs-on: dev-local-runner
    needs: deploy-workers
    if: ${{ always() && needs.deploy-workers.result != 'failure' && needs.deploy-workers.result != 'cancelled' && vars.DEV_SVC_K8S_CLUSTER_SETUP != 'true' }}

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION_DEV }}

      - name: Fetch GH Admin PAT and assign to ansible variable
        run: |
          GH_TOKEN=${{ secrets.GH_ADMIN_PAT_FLUX }}
          GH_USERNAME=${{ secrets.GH_USERNAME }}
          echo "::add-mask::${GH_TOKEN}"
          echo "::add-mask::${GH_USERNAME}"
          echo "GH_TOKEN=${GH_TOKEN}" >> $GITHUB_ENV
          echo "GH_USER=${GH_USERNAME}" >> $GITHUB_ENV


      - name: Fetch Keytab and Initialize Kerberos
        run: |
          # Fetch keytab and pipe to Ansible host - kinit immediately, delete keytab
          aws secretsmanager get-secret-value \
            --secret-id dev/super_bot/keytab \
            --query SecretString --output text | base64 -d > /tmp/super_bot.keytab

          cat /tmp/super_bot.keytab | ssh -o StrictHostKeyChecking=no ${{ env.ANSIBLE_USER }}@${{ env.ANSIBLE_HOST }} \
            "cat > /tmp/kt && kinit -kt /tmp/kt super_bot@LAB.LOCAL && rm -f /tmp/kt"
          rm -f /tmp/super_bot.keytab

      - name: Pull latest code
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.ANSIBLE_USER }}@${{ env.ANSIBLE_HOST }} "cd /srv/repo/ && git pull origin dev"
 
      - name: Run K8s setup playbook
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.ANSIBLE_USER }}@${{ env.ANSIBLE_HOST }} "\
            export GH_TOKEN='${{ env.GH_TOKEN }}' && \
            export GH_USER='${{ env.GH_USER }}' && \
            cd /srv/repo/ansible/dev/ && \
            ansible-playbook -i inventory/inventory.ini playbooks/common/pre_setup.yml --limit k8s && \
            ansible-playbook -i inventory/inventory.ini playbooks/common/ntp.yml --limit k8s && \
            ansible-playbook -i inventory/inventory.ini playbooks/k8s/k8s_setup.yml && \
            ansible-playbook -i inventory/inventory.ini playbooks/k8s/k8s_init.yml && \
            ansible-playbook -i inventory/inventory.ini playbooks/k8s/k8s_important_tools.yml && \
            ansible-playbook -i inventory/inventory.ini playbooks/k8s/flux_setup.yml"
            
      - name: Cleanup Kerberos ticket
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.ANSIBLE_USER }}@${{ env.ANSIBLE_HOST }} "kdestroy" || true
# Dev K8s Full Setup - Combined Workflow
# Combines: k8s_masters, k8s_workers
# Each job has its own lock - locked jobs skip to next, not fail whole workflow

name: "[DEV] K8s - Full Setup"
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/proxmox/vms/k8s_masters/**'
      - 'terraform/dev/proxmox/vms/k8s_workers/**'
      - '.github/workflows/dev-k8s-full-setup.yml'

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: dev

jobs:
###### Job 1: Deploy K8s Masters ######
  # 1. Name the job on GH UI
  # 2. Define which runner to use
  # 3. Define the manual safe lock trigger for workflow_dispatch
  # 4. Define the default working directory for all steps in this job
  deploy-masters:
    name: "1. Deploy K8s Masters"
    runs-on: mac-mini
    if: ${{ vars.DEV_INFRA_K8S_MASTERS_LOCK != 'true' }}

    defaults:
      run:
        working-directory: terraform/dev/proxmox/vms/k8s_masters
#####################
#####################


##### Steps (Job 1) #####
  # 1. Copy Code to the work place
  # 2. Authenticate with AWS for OIDC and Assume the iam role
  # 3. Initialize Tf working directory
  # 4. Plan "dry run" the Tf code and out to tfplan
  # 5. Only appear if plan fail to execute in middle and DB LockID Triggered
  # 6. Give yourself small window to review the plan output before execute
  # 7. Apply the planned content inside tfplan file
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Fetch the needed secrets expected inside the tf code variables
      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          # Mask BEFORE any use
          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          # Fetch Ansible SSH public key
          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \
            --secret-id dev/ansible/ssh-public-key \
            --query SecretString --output text)
          echo "::add-mask::${ANSIBLE_SSH_KEY}"
          echo "TF_VAR_ansible_ssh_public_key=${ANSIBLE_SSH_KEY}" >> $GITHUB_ENV

          # Fetch VM root password
          VM_ROOT_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id dev/golden-image/vm-root-password \
            --query SecretString --output text)
          echo "::add-mask::${VM_ROOT_PASSWORD}"
          echo "TF_VAR_vm_root_password=${VM_ROOT_PASSWORD}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      - name: Review Window
        run: |
          echo "3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "Review window ended at $(date)"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

##### Job 2: Deploy K8s Workers #####
  # 1. Name the job on GH UI
  # 2. Define which runner to use
  # 3. Define the manual safe lock trigger for workflow_dispatch
  # 4. Define the default working directory for all steps in this job
  deploy-workers:
    name: "2. Deploy K8s Workers"
    runs-on: mac-mini
    needs: deploy-masters
    if: ${{ always() && needs.deploy-masters.result != 'failure' && needs.deploy-masters.result != 'cancelled' && vars.DEV_INFRA_K8S_WORKERS_LOCK != 'true' }}

    defaults:
      run:
        working-directory: terraform/dev/proxmox/vms/k8s_workers
#####################
#####################


##### Steps (Job 2) #####
  # 1. Copy Code to the work place
  # 2. Authenticate with AWS for OIDC and Assume the iam role
  # 3. Initialize Tf working directory
  # 4. Plan "dry run" the Tf code and out to tfplan
  # 5. Only appear if plan fail to execute in middle and DB LockID Triggered
  # 6. Give yourself small window to review the plan output before execute
  # 7. Apply the planned content inside tfplan file
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Fetch the needed secrets expected inside the tf code variables
      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          # Mask BEFORE any use
          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

          # Fetch Ansible SSH public key
          ANSIBLE_SSH_KEY=$(aws secretsmanager get-secret-value \

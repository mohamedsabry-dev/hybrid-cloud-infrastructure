# One-time workflow to import existing IAM resources into Terraform state
# Delete this workflow after successful import

name: "Dev - IAM Import"

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: "Import Existing Resources"
    runs-on: production

    defaults:
      run:
        working-directory: terraform/dev/aws/iam

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018571635409:role/GitHubActions-TerraformAdmin-dev
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Import IAM Policies
        run: |
          if ! terraform state show aws_iam_policy.terraform_state_dev 2>/dev/null; then
            terraform import aws_iam_policy.terraform_state_dev arn:aws:iam::018571635409:policy/TerraformState-Dev
          fi
          if ! terraform state show aws_iam_policy.security_boundary_dev 2>/dev/null; then
            terraform import aws_iam_policy.security_boundary_dev arn:aws:iam::018571635409:policy/SecurityBoundary-Dev
          fi

      - name: Import IAM Role
        run: |
          if ! terraform state show aws_iam_role.github_actions_infrastructure 2>/dev/null; then
            terraform import aws_iam_role.github_actions_infrastructure GitHubActions-Infrastructure-dev
          fi

      - name: Import Role Policy Attachments
        run: |
          if ! terraform state show aws_iam_role_policy_attachment.infra_role_power_user 2>/dev/null; then
            terraform import aws_iam_role_policy_attachment.infra_role_power_user GitHubActions-Infrastructure-dev/arn:aws:iam::aws:policy/PowerUserAccess
          fi
          if ! terraform state show aws_iam_role_policy_attachment.infra_role_security_boundary 2>/dev/null; then
            terraform import aws_iam_role_policy_attachment.infra_role_security_boundary GitHubActions-Infrastructure-dev/arn:aws:iam::018571635409:policy/SecurityBoundary-Dev
          fi
          if ! terraform state show aws_iam_role_policy_attachment.infra_role_tf_state 2>/dev/null; then
            terraform import aws_iam_role_policy_attachment.infra_role_tf_state GitHubActions-Infrastructure-dev/arn:aws:iam::018571635409:policy/TerraformState-Dev
          fi

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

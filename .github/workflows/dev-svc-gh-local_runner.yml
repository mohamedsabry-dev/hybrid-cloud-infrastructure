name: "[DEV] Svc - GH Runner Setup"
on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-svc-gh-local_runner.yml'
permissions:
  id-token: write
  contents: read
env:
  ENVIRONMENT: dev

jobs:
##### Job 1: Setup GH Runner #####
  # Variables required in GitHub repo settings:
  # - GH_RUNNER_TOKEN: Fresh token from Settings > Actions > Runners (update before running)
  # - GH_RUNNER_NAME: Runner name (default: dev-local-runner)
  # - GH_RUNNER_LABELS: Runner labels (default: dev-local-runner)
  setup:
    name: "Setup GH Runner"
    runs-on: mac-mini
    if: ${{ vars.DEV_SVC_GH_RUNNER_LOCK != 'true' }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch LXC root password
        run: |
          LXC_PWD=$(aws secretsmanager get-secret-value \
            --secret-id dev/golden-image/lxc-root-password \
            --query SecretString --output text)
          echo "::add-mask::${LXC_PWD}"
          echo "LXC_PWD=${LXC_PWD}" >> $GITHUB_ENV

      - name: Install GitHub Runner on LXC
        env:
          RUNNER_TOKEN: ${{ secrets.DEV_GH_RUNNER_TOKEN }}
          RUNNER_NAME: ${{ vars.DEV_GH_RUNNER_NAME }}
          RUNNER_LABELS: ${{ vars.DEV_GH_RUNNER_LABELS }}
        run: |
          # Stop existing service and clean old config (handles orphaned configs)
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.63.20 \
            "cd /opt/actions-runner 2>/dev/null && ./svc.sh stop 2>/dev/null; ./svc.sh uninstall 2>/dev/null; rm -f .runner .credentials .credentials_rsaparams .service 2>/dev/null; exit 0"

          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.63.20 "
            # Create runner user (as root)
            id runner > /dev/null 2>&1 || useradd -m runner

            # Setup directory (as root)
            mkdir -p /opt/actions-runner
            cd /opt/actions-runner

            # Download if not exists (as root)
            [ -f actions-runner-linux-x64-2.331.0.tar.gz ] || \
              curl -sL -o actions-runner-linux-x64-2.331.0.tar.gz \
              https://github.com/actions/runner/releases/download/v2.331.0/actions-runner-linux-x64-2.331.0.tar.gz

            # Extract (as root)
            tar xzf ./actions-runner-linux-x64-2.331.0.tar.gz

            # Set ownership (as root)
            chown -R runner:runner /opt/actions-runner
          "

          # Configure runner separately to avoid quoting issues
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.63.20 \
            "su - runner -c 'cd /opt/actions-runner && ./config.sh --unattended --replace --url https://github.com/mohamedsabry-dev/hybrid-cloud-infrastructure --token ${RUNNER_TOKEN} --name ${RUNNER_NAME} --labels ${RUNNER_LABELS} --work _work'"

          # Install and start service
          sshpass -p "${LXC_PWD}" ssh -q -o StrictHostKeyChecking=no root@10.0.63.20 \
            "cd /opt/actions-runner && ./svc.sh install runner && ./svc.sh start"

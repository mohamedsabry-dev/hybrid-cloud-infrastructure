# Dev Proxmox Golden Image VM deployment
# Creates VM from ISO for manual installation

#### Define Block ####
# 1. Define the job name on GH UI
# 2. Define the run condition "On push : Where ?"
# 3. Define the working directory path on GH Level
# 4. Declare if will use manual trigger later or not
# 5. Declare the needed permisions for OICD Use 
# 6. Declare Env Variables for clean use 
name: "[DEV] Golden VM"
on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/dev/proxmox/vms/golden-image/**'
      - '.github/workflows/dev-golden-vm.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  actions: write
env:
  ENVIRONMENT: dev
  TF_WORKING_DIR: terraform/dev/proxmox/vms/golden-image
#####################
#####################


jobs:
##### Job 1 Core #####
  # 1. Name the job on GH UI 
  # 2. Define which runner to use
  # 3. Define the manual safe lock trigger for workflow_dispatch
  # 4. Define the default working directory for all steps in this job
  create-vm:
    name: "Create Golden Image VM (dev)"
    runs-on: macOS
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GOLDEN_IMAGE_DEV_LOCKED != 'true' }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
#####################
#####################


##### Steps #####
  # 1. Copy Code to the work place
  # 2. Authenticate with AWS for OICD and Assume the iam role
  # 3. Fetch the needed secrets expected inside the tf code variables
  # 4. Initialize Tf working directory
  # 5. Plan "dry run" the Tf code and out to tfplan
  # 6. Only appear if plan fail to excute in middle and DB LockID Triggered 
  # 7. Give your self small windows to review the plan output before excute
  # 8. Apply the planned content inside tfplan file    
  # 9. In case of previous success, display manual instructions for complete the Job
    steps:
      # 1. Copy Code to the work place
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate with AWS for OICD and Assume the iam role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/GitHubActions-Infrastructure-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Fetch the needed secrets expected inside the tf code variables
      - name: Fetch Proxmox Secrets
        run: |
          API_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/proxmox/terraform-token \
            --query SecretString --output text)

          TOKEN_ID=$(echo "$API_SECRET" | jq -r '.token_id')
          TOKEN_SECRET=$(echo "$API_SECRET" | jq -r '.token_secret')

          # Mask BEFORE any use
          echo "::add-mask::${TOKEN_SECRET}"
          echo "::add-mask::${TOKEN_ID}=${TOKEN_SECRET}"

          echo "TF_VAR_proxmox_api_token=${TOKEN_ID}=${TOKEN_SECRET}" >> $GITHUB_ENV

      # 4. Initialize Tf working directory
      - name: Terraform Init
        run: terraform init

      # 5. Plan "dry run" the Tf code and out to tfplan
      - name: Terraform Plan
        timeout-minutes: 3
        run: terraform plan -out=tfplan

      # 6. Only appear if plan fail to excute in middle and DB LockID Triggered 
      - name: Lock Cleanup Instructions
        if: failure() || cancelled()
        run: |
          echo "=============================================="
          echo "⚠️  Workflow cancelled or timed out"
          echo "=============================================="
          echo ""
          echo "State may be locked. To release:"
          echo ""
          echo "AWS Console → DynamoDB → Tables"
          echo "→ hybrid-cloud-infrastructure-tf-state-lock-dev"
          echo "→ Explore items >> Find the Locked ID"
          echo "→ Delete item"
          echo ""
          echo "=============================================="

      # 7. Give your self small windows to review the plan output before excute
      - name: Review Window
        run: |
          echo "⏳ 3-minute review window started at $(date)"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Plan output is available above for auditor review"
          sleep 180
          echo "✅ Review window ended at $(date)"
          echo "scp proxmox/scripts/golden-vm-setup.sh root@10.0.63.99:/tmp/"

      # 8. Apply the planned content inside tfplan file    
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

      # 9. In case of previous success, display manual instructions for complete the Job
      - name: Display Setup Instructions
        if: steps.apply.outcome == 'success'
        run: |
          echo "=============================================="
          echo "  VM CREATED - MANUAL SETUP REQUIRED"
          echo "=============================================="
          echo ""
          terraform output -json golden_image | jq -r '.setup_instructions'
          echo ""
          echo "=============================================="
          echo ""
          echo "After completing setup and converting to template,"
          echo "update the Terraform code to reference the template"
          echo "for future VM cloning operations."
          echo "=============================================="

      # 10. Lock workflow after successful deployment
      - name: Lock after success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set GOLDEN_IMAGE_DEV_LOCKED --body "true"
##################################################################################
##################################################################################
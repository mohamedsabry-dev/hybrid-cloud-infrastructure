AWSTemplateFormatVersion: '2010-09-09'
Description: 'Phase 0: Bootstrap Foundation (OIDC Provider + Terraform Backend + Audit)'

Resources:
  # ============================================================================
  # 1. GitHub OIDC Provider (Identity Federation)
  # ============================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Note: AWS ignores thumbprint for GitHub OIDC (since July 2023) but field is required
      ThumbprintList: [1c58a3a8518e8759bf075b76b750d4f2df264fcd]
      Tags:
        - Key: Purpose
          Value: GitHubActionsOIDC

  # ============================================================================
  # 2. Terraform State Bucket (IaC State Storage)
  # ============================================================================
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: hybrid-cloud-infrastructure-terraform-state
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref AuditBucket
        LogFilePrefix: s3-access-logs/terraform-state/
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Purpose
          Value: TerraformState

  # ============================================================================
  # 3. Terraform State Lock Table (Concurrency Control)
  # ============================================================================
  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: hybrid-cloud-infrastructure-terraform-state-lock
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Purpose
          Value: TerraformStateLock

  # ============================================================================
  # 4. Audit Logs Bucket (Compliance & Security)
  # ============================================================================
  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: hybrid-cloud-infrastructure-audit-logs
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveLogs
            Status: Enabled
            ExpirationInDays: 365
          - Id: CleanupOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Purpose
          Value: AuditLogs


  # ============================================================================
  # 5. Audit Bucket Policy (Allow CloudTrail to write)
  # ============================================================================
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSL
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub "${AuditBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*"

# ============================================================================
# Outputs

Outputs:
  # OIDC Provider
  OIDCProviderArn:
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: GitHubOIDCProviderArn

  # Terraform State
  StateBucketName:
    Value: !Ref TerraformStateBucket
    Export:
      Name: TerraformStateBucketName

  StateBucketArn:
    Value: !GetAtt TerraformStateBucket.Arn
    Export:
      Name: TerraformStateBucketArn

  LockTableName:
    Value: !Ref TerraformLockTable
    Export:
      Name: TerraformLockTableName

  # Audit Bucket
  AuditBucketArn:
    Value: !GetAtt AuditBucket.Arn
    Export:
      Name: HybridCloud-AuditBucket-Arn

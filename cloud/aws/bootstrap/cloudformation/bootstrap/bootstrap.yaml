AWSTemplateFormatVersion: '2010-09-09'
Description: 'Phase 0: Bootstrap Foundation (OIDC Provider + Terraform Backend + Audit)'

Resources:
  # ============================================================================
  # 1. GitHub OIDC Provider (Identity Federation)
  # ============================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  # ============================================================================
  # 2. Terraform State Bucket (IaC State Storage)
  # ============================================================================
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: hybrid-cloud-infrastructure-terraform-state
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Purpose
          Value: TerraformState
        - Key: Phase
          Value: Bootstrap

  # ============================================================================
  # 3. Terraform State Lock Table (Concurrency Control)
  # ============================================================================
  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: hybrid-cloud-infrastructure-terraform-state-lock
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      Tags:
        - Key: Purpose
          Value: TerraformStateLock
        - Key: Phase
          Value: Bootstrap

  # ============================================================================
  # 4. Audit Logs Bucket (Compliance & Security)
  # ============================================================================
  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: hybrid-cloud-infrastructure-audit-logs
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveLogs
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: Purpose
          Value: AuditLogs
        - Key: Phase
          Value: Bootstrap


  # ============================================================================
  # 5. Audit Bucket Policy (Allow CloudTrail to write)
  # ============================================================================
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

Outputs:
  # OIDC Provider
  OIDCProviderArn:
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: GitHubOIDCProviderArn

  # Terraform State
  StateBucketName:
    Value: !Ref TerraformStateBucket
    Export:
      Name: TerraformStateBucketName

  StateBucketArn:
    Value: !GetAtt TerraformStateBucket.Arn
    Export:
      Name: TerraformStateBucketArn

  LockTableName:
    Value: !Ref TerraformLockTable
    Export:
      Name: TerraformLockTableName

  # Audit Bucket
  AuditBucketArn:
    Value: !GetAtt AuditBucket.Arn
    Export:
      Name: HybridCloud-AuditBucket-Arn

AWSTemplateFormatVersion: '2010-09-09'
Description: 'Shared Managed Policies for Hybrid Infrastructure'

Resources:
  # ============================================================================
  # 1. Terraform State Policy (S3 & DynamoDB Access)
  # ============================================================================
  TerraformStatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-TerraformState-Common
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3TerraformStateAccess
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !ImportValue TerraformStateBucketArn
              - !Sub
                  - "${BucketArn}/*"
                  - BucketArn: !ImportValue TerraformStateBucketArn
          - Sid: DynamoDBStateLocking
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
            Resource: !Sub
              - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
              - TableName: !ImportValue TerraformLockTableName

  # ============================================================================
  # 2. Terraform Security Boundary (The Separation of Duties)
  # ============================================================================
  TerraformSecurityBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-Terraform-SecurityBoundary
      Description: "Prevents Terraform from modifying IAM but allows passing roles to Compute"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Rule 1: Allow Passing only EC2-* and EKS-* roles to compute services
          - Sid: AllowPassRole
            Effect: Allow
            Action: 'iam:PassRole'
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/EC2-*'
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/EKS-*'
            Condition:
              StringEquals:
                'iam:PassedToService':
                  - 'ec2.amazonaws.com'
                  - 'eks.amazonaws.com'

          # Rule 2: STRICTLY FORBID creating/deleting IAM resources
          - Sid: BlockIAMMutation
            Effect: Deny
            Action:
              - 'iam:CreateUser'
              - 'iam:CreateRole'
              - 'iam:CreatePolicy'
              - 'iam:DeleteUser'
              - 'iam:DeleteRole'
              - 'iam:DeletePolicy'
              - 'iam:AttachRolePolicy'
              - 'iam:PutRolePolicy'
            Resource: '*'

  # ============================================================================
  # 3. Network Core Infrastructure (VPC, Subnets, Routes, VPN, Peering)
  # ============================================================================
  NetworkFullManagementPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-NetworkFullManagement
      Description: "Full network infrastructure management for Terraform"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: VPCManagement
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
            Resource: '*'
          - Sid: InternetGatewayManagement
            Effect: Allow
            Action:
              - ec2:CreateInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DeleteInternetGateway
            Resource: '*'
          - Sid: RouteManagement
            Effect: Allow
            Action:
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:ReplaceRoute
            Resource: '*'
          - Sid: NetworkACLManagement
            Effect: Allow
            Action:
              - ec2:CreateNetworkAcl
              - ec2:DeleteNetworkAcl
              - ec2:CreateNetworkAclEntry
              - ec2:DeleteNetworkAclEntry
              - ec2:ReplaceNetworkAclEntry
              - ec2:ReplaceNetworkAclAssociation
            Resource: '*'
          - Sid: VPCPeeringManagement
            Effect: Allow
            Action:
              - ec2:CreateVpcPeeringConnection
              - ec2:DeleteVpcPeeringConnection
              - ec2:AcceptVpcPeeringConnection
              - ec2:RejectVpcPeeringConnection
              - ec2:ModifyVpcPeeringConnectionOptions
            Resource: '*'
          - Sid: VPNManagement
            Effect: Allow
            Action:
              - ec2:CreateVpnGateway
              - ec2:DeleteVpnGateway
              - ec2:AttachVpnGateway
              - ec2:DetachVpnGateway
              - ec2:CreateCustomerGateway
              - ec2:DeleteCustomerGateway
              - ec2:CreateVpnConnection
              - ec2:DeleteVpnConnection
              - ec2:ModifyVpnConnection
              - ec2:ModifyVpnConnectionOptions
            Resource: '*'
          - Sid: VPCEndpointManagement
            Effect: Allow
            Action:
              - ec2:CreateVpcEndpoint
              - ec2:DeleteVpcEndpoints
              - ec2:ModifyVpcEndpoint
              - ec2:CreateVpcEndpointServiceConfiguration
              - ec2:DeleteVpcEndpointServiceConfigurations
              - ec2:ModifyVpcEndpointServiceConfiguration
            Resource: '*'
          - Sid: TagManagement
            Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: '*'

  # ============================================================================
  # 4. Application Full Management (EC2, EKS, ECR, SG, ELB, NAT)
  # ============================================================================
  ApplicationFullManagementPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-ApplicationFullManagement
      Description: "Full compute and container management for Terraform"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EC2Management
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:RebootInstances
              - ec2:ModifyInstanceAttribute
            Resource: '*'
          - Sid: VolumeManagement
            Effect: Allow
            Action:
              - ec2:AttachVolume
              - ec2:DetachVolume
              - ec2:CreateVolume
              - ec2:DeleteVolume
              - ec2:ModifyVolume
            Resource: '*'
          - Sid: SecurityGroupManagement
            Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupEgress
              - ec2:ModifySecurityGroupRules
              - ec2:UpdateSecurityGroupRuleDescriptionsIngress
              - ec2:UpdateSecurityGroupRuleDescriptionsEgress
            Resource: '*'
          - Sid: NATGatewayManagement
            Effect: Allow
            Action:
              - ec2:CreateNatGateway
              - ec2:DeleteNatGateway
            Resource: '*'
          - Sid: ElasticIPManagement
            Effect: Allow
            Action:
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
            Resource: '*'
          - Sid: NetworkInterfaceManagement
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:AttachNetworkInterface
              - ec2:DetachNetworkInterface
              - ec2:ModifyNetworkInterfaceAttribute
            Resource: '*'
          - Sid: LoadBalancerManagement
            Effect: Allow
            Action:
              - elasticloadbalancing:*
            Resource: '*'
          - Sid: ContainerServices
            Effect: Allow
            Action:
              - eks:*
              - ecr:*
            Resource: '*'
          - Sid: TagManagement
            Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: '*'

  # ============================================================================
  # 5. Security Audit Control (CloudTrail, Audit Bucket, CloudWatch, EventBridge)
  # ============================================================================
  SecurityAuditControlPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-SecurityAuditControl
      Description: "Security and audit infrastructure management"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageCloudTrailResource
            Effect: Allow
            Action:
              - cloudtrail:CreateTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:DeleteTrail
              - cloudtrail:StartLogging
              - cloudtrail:StopLogging
              - cloudtrail:GetTrail
              - cloudtrail:GetTrailStatus
              - cloudtrail:DescribeTrails
              - cloudtrail:PutEventSelectors
              - cloudtrail:GetEventSelectors
              - cloudtrail:ListTags
              - cloudtrail:AddTags
              - cloudtrail:RemoveTags
            Resource: '*'
          - Sid: ConfigureAuditBucket
            Effect: Allow
            Action:
              - s3:PutBucketPolicy
              - s3:GetBucketPolicy
              - s3:PutEncryptionConfiguration
              - s3:PutLifecycleConfiguration
              - s3:ListBucket
            Resource:
              - !ImportValue HybridCloud-AuditBucket-Arn
          - Sid: ExplicitlyDenyBucketDestruction
            Effect: Deny
            Action:
              - s3:DeleteBucket
            Resource:
              - !ImportValue HybridCloud-AuditBucket-Arn
          - Sid: ManageCloudWatchLogs
            Effect: Allow
            Action:
              - logs:*
            Resource: '*'
          - Sid: ManageCloudWatchAlarms
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:SetAlarmState
              - cloudwatch:PutMetricData
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - cloudwatch:PutDashboard
              - cloudwatch:DeleteDashboards
              - cloudwatch:GetDashboard
              - cloudwatch:ListDashboards
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource: '*'
          - Sid: ManageEventBridge
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:EnableRule
              - events:DisableRule
              - events:PutTargets
              - events:RemoveTargets
              - events:DescribeRule
              - events:ListRules
              - events:ListTargetsByRule
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource: '*'
          - Sid: ManageSNSForAlarms
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:Publish
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:ListTopics
              - sns:TagResource
              - sns:UntagResource
              - sns:ListTagsForResource
            Resource: '*'
          - Sid: AllowPassRoleToCloudTrail
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: "arn:aws:iam::*:role/service-role/CloudTrailWritesToCloudWatchRole"

  # ============================================================================
  # 6. Secrets Management (Secrets Manager for infra tokens - Proxmox, Vault, etc.)
  # ============================================================================
  SecretsManagementPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HybridCloud-SecretsManagement
      Description: "Secrets Manager access for infrastructure secrets (Proxmox, Vault, etc.)"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SecretsManagerFullAccess
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:UpdateSecret
              - secretsmanager:ListSecrets
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:infra/*"
          - Sid: SecretsManagerList
            Effect: Allow
            Action:
              - secretsmanager:ListSecrets
            Resource: '*'

Outputs:
  # ============================================================================
  # All Exports go here at the bottom
  # ============================================================================
  TerraformStatePolicyArn:
    Value: !Ref TerraformStatePolicy
    Export:
      Name: HybridCloud-TerraformStatePolicy-Arn

  TerraformSecurityBoundaryPolicyArn:
    Value: !Ref TerraformSecurityBoundaryPolicy
    Export:
      Name: HybridCloud-TerraformSecurityBoundary-Arn

  NetworkFullManagementPolicyArn:
    Value: !Ref NetworkFullManagementPolicy
    Export:
      Name: HybridCloud-NetworkFullManagement-Arn

  ApplicationFullManagementPolicyArn:
    Value: !Ref ApplicationFullManagementPolicy
    Export:
      Name: HybridCloud-ApplicationFullManagement-Arn

  SecurityAuditControlPolicyArn:
    Value: !Ref SecurityAuditControlPolicy
    Export:
      Name: HybridCloud-SecurityAuditControl-Arn

  SecretsManagementPolicyArn:
    Value: !Ref SecretsManagementPolicy
    Export:
      Name: HybridCloud-SecretsManagement-Arn

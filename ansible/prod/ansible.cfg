# ============================================================================
# ANSIBLE CONFIGURATION - PROD ENVIRONMENT
# ============================================================================
#
# NORMAL OPERATIONS (FreeIPA running):
#   1. Get Kerberos ticket: kinit super_bot
#   2. Run playbook: ansible-playbook playbooks/...
#   - Uses FQDN hostnames (FreeIPA DNS)
#   - Uses super_bot domain user with sudo
#   - FreeIPA server uses root (overridden in inventory)
#
# EMERGENCY FALLBACK (FreeIPA down):
#   ansible-playbook -i inventory/first_setup_inventory.ini -u root playbooks/...
#   - Uses IP addresses (no DNS dependency)
#   - Uses root user (no domain auth dependency)
#
# ============================================================================

[defaults]
inventory = inventory/inventory.ini
remote_user = super_bot
host_key_checking = False
vault_password_file = ~/.ansible_vault

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# ============================================================================
# SETTINGS EXPLANATION
# ----------------------------------------------------------------------------
# inventory              = Default to FQDN-based inventory (requires FreeIPA DNS)
# remote_user            = super_bot domain user (requires kinit before running)
# host_key_checking      = Disabled (nodes are recreated frequently)
# vault_password_file    = Ansible Vault password location (~/.ansible_vault)
# ssh_args               = Don't save/check host keys (prevents stale key errors)
# ============================================================================

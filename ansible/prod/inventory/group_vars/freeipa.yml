# ----------------------------------------------------------------------------
# HASHICORP VAULT ADMIN USERS
# FreeIPA users created specifically for Vault UI/API access
# ----------------------------------------------------------------------------
hashicorp_vault_users:
  - name: sabry
    first: Sabry
    last: Admin
    description: "Vault super admin"
    password: "{{ default_admin_user_password }}"
    update_password: on_create

  - name: vault_operator
    first: Vault
    last: Operator
    description: "Vault super admin"
    password: "{{ default_admin_user_password }}"
    update_password: on_create

# ----------------------------------------------------------------------------
# AWS KMS AUTO-UNSEAL CREDENTIALS
# ----------------------------------------------------------------------------
# Two approaches available:
#
# APPROACH 1: Environment Variable Lookup (ACTIVE - used by GitHub workflows)
# - Credentials fetched from AWS Secrets Manager during workflow execution
# - Set via: export VAULT_UNSEAL_ACCESS_KEY=xxx && export VAULT_UNSEAL_SECRET_KEY=xxx
# - Preferred for CI/CD pipelines
#
# APPROACH 2: Ansible Vault Encrypted (COMMENTED - for manual/local testing)
# - Credentials stored encrypted in this file
# - Requires: ansible-vault decrypt or vault password file
# - Useful when running playbooks manually without workflow
# ----------------------------------------------------------------------------

# APPROACH 1: Environment lookup (active)
vault_aws_access_key_id: "{{ lookup('env', 'VAULT_UNSEAL_ACCESS_KEY') }}"
vault_aws_secret_access_key: "{{ lookup('env', 'VAULT_UNSEAL_SECRET_KEY') }}"


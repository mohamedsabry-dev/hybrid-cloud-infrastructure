# ============================================================================
# PROD ENVIRONMENT INVENTORY - PRODUCTION USE (With FreeIPA DNS)
# ============================================================================
# PURPOSE: Main inventory for day-to-day operations after FreeIPA is configured
#
# WHY FQDN HOSTNAMES:
#   - FreeIPA provides DNS resolution for .lab.local domain
#   - Kerberos/GSSAPI authentication requires hostnames (not IPs)
#   - Service principals are tied to hostname@REALM
#
# WHY SUPER_BOT USER:
#   - FreeIPA domain user with HBAC rules and sudo access
#   - Requires: kinit super_bot before running Ansible
#
# WHY FREEIPA USES ROOT:
#   - FreeIPA server is the identity provider, not a client
#   - SSSD/sudo rules don't apply to the IPA server itself
#   - Avoids dependency loop (can't use IPA auth to manage IPA)
#
# WHY ANSIBLE GROUP IS LOCAL:
#   - Ansible node runs playbooks locally (ansible_connection=local)
#   - No SSH needed for self-management
#
# USAGE: ansible-playbook playbooks/... (uses default inventory from ansible.cfg)
# ============================================================================

# VMs (VLAN 50, 51, 54)
[freeipa]
freeipa.lab.local    ansible_user=root
#ansible_host=10.0.50.10

[k8s_masters]
k8s-master1.lab.local
#ansible_host=10.0.51.10
k8s-master2.lab.local
#ansible_host=10.0.51.11
k8s-master3.lab.local
#ansible_host=10.0.51.12

[k8s_workers]
k8s-worker1.lab.local
#ansible_host=10.0.54.10
k8s-worker2.lab.local
#ansible_host=10.0.54.11
k8s-worker3.lab.local
#ansible_host=10.0.54.12

# LXCs (VLAN 52, 53, 55)
[vault_cluster]
vault1.lab.local
#ansible_host=10.0.52.10
vault2.lab.local
#ansible_host=10.0.52.11
vault3.lab.local
#ansible_host=10.0.52.12

[ansible]
ansible.lab.local  ansible_connection=local
#ansible_host=10.0.53.10

[local_runners]
local-runner.lab.local
#ansible_host=10.0.53.20

[nginx]
ex-nginx.lab.local
#ansible_host=10.0.55.10

# Group definitions
[k8s:children]
k8s_masters
k8s_workers


[managed_hosts:children]
k8s_masters
k8s_workers
vault_cluster
ansible
local_runners
nginx


[vms:children]
k8s_masters
k8s_workers
freeipa

[lxc:children]
vault_cluster
ansible
local_runners
nginx


[managed_hosts:vars]
ansible_user=super_bot
ansible_become=yes
ansible_become_method=sudo


[all:vars]

# ============================================================================
# PROD ENVIRONMENT INVENTORY - FIRST SETUP (Before FreeIPA DNS)
# ============================================================================
# PURPOSE: Bootstrap inventory for initial node setup before FreeIPA is available
#
# WHY IP ADDRESSES:
#   - FreeIPA DNS not yet configured
#   - Nodes don't have DNS resolution for .lab.local domain
#
# WHY ROOT USER:
#   - FreeIPA users (super_bot) don't exist yet
#   - SSH keys pre-copied during Terraform provisioning
#
# USAGE: ansible-playbook -i inventory/first_setup_inventory.ini playbooks/...
# ============================================================================

# VMs (VLAN 50, 51, 54)
[freeipa]
10.0.50.10  ansible_user=root

[k8s_masters]
10.0.51.10  ansible_user=root
10.0.51.11  ansible_user=root
10.0.51.12  ansible_user=root

[k8s_workers]
10.0.54.10  ansible_user=root
10.0.54.11  ansible_user=root
10.0.54.12  ansible_user=root

# LXCs (VLAN 52, 53, 55)
[vault_cluster]
10.0.52.10  ansible_user=root
10.0.52.11  ansible_user=root
10.0.52.12  ansible_user=root

[ansible]
10.0.53.10  ansible_connection=local

[local_runners]
10.0.53.20  ansible_user=root

[nginx]
10.0.55.10  ansible_user=root

# Group definitions
[k8s:children]
k8s_masters
k8s_workers

[managed_hosts:children]
k8s_masters
k8s_workers
vault_cluster
ansible
local_runners
nginx

[vms:children]
freeipa
k8s_masters
k8s_workers

[lxc:children]
vault_cluster
ansible
local_runners
nginx

[all:vars]
ansible_user=root

---
- name: Install Firewall Service on LXC
  hosts: lxc
  become: yes
  tasks:
    - name: Install Firewall Service
      ansible.builtin.dnf:
        name: firewalld
        state: latest


    - name: Disable Firewall Service
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: no

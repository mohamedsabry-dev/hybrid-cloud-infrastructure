# ============================================================================
# TEST.YML - Test Ansible Connectivity
# ============================================================================
# PURPOSE: Verify Ansible can connect to all hosts and execute commands
# USAGE: ansible-playbook playbooks/ansible/test.yml
# ============================================================================
---
- name: Test Ansible
  hosts: all
  become: yes
  tasks:
    - name: Get Hostname
      ansible.builtin.command:
        cmd: hostnamectl
      register: hostname_output
# Test
    - name: Display Hostname
      ansible.builtin.debug:
        msg: "{{ hostname_output.stdout_lines }}"

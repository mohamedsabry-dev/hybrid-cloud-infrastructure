# ============================================================================
# FIX_LXC_KRB5_KEYRING.YML - Fix Kerberos Credential Cache on LXC
# ============================================================================
# PURPOSE: Switch LXC containers from kernel keyring to FILE-based ccache
# PROBLEM: Unprivileged LXC kernel keyring fails due to UID mapping
# SOLUTION: Use FILE:/tmp/krb5cc_%U instead
# REF: /troubleshooting/identity/17-lxc-kerberos-keyring-auth-failure.md
# ============================================================================
---
- name: Fix Kerberos keyring issue on LXC containers
  hosts: vault_cluster:ansible:local_runners:nginx
  become: yes

  tasks:
    - name: Check if sssd.conf exists
      ansible.builtin.stat:
        path: /etc/sssd/sssd.conf
      register: sssd_conf

    - name: Backup sssd.conf
      ansible.builtin.copy:
        src: /etc/sssd/sssd.conf
        dest: /etc/sssd/sssd.conf.backup
        remote_src: yes
        mode: preserve
      when: sssd_conf.stat.exists

    - name: Add FILE-based krb5 ccache to sssd.conf
      ansible.builtin.lineinfile:
        path: /etc/sssd/sssd.conf
        regexp: '^krb5_ccache_template'
        line: 'krb5_ccache_template = FILE:/tmp/krb5cc_%U'
        insertafter: '^\[domain/'
        state: present
      when: sssd_conf.stat.exists
      notify:
        - Clear SSSD cache
        - Restart SSSD

  handlers:
    - name: Clear SSSD cache
      ansible.builtin.command:
        cmd: sss_cache -E
      changed_when: true

    - name: Restart SSSD
      ansible.builtin.service:
        name: sssd
        state: restarted

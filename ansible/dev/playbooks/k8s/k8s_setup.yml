---
# Play 1: Prerequisites 
- name: Phase 0 - Prerequisites
  hosts: k8s
  become: yes
  tasks:
    - name: Disable Swap Mem
      ansible.builtin.command:
        swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Remove swap from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'
    
    - name: Disable firewalld
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: no

    - name: Set SELinux to permissive
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    - name: Load kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - overlay
        - br_netfilter

    - name: Set Sysctl params
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }
  
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - conntrack-tools
          - iproute-tc
        state: present

# Play 2: Containerd (isolated handlers)
- name: Phase 1 - Containerd
  hosts: k8s
  become: yes
  tasks:
    - name: Add containerd repo
      ansible.builtin.yum_repository:
        name: containerd
        description: Containerd Stable
        baseurl: https://download.docker.com/linux/rhel/10/x86_64/stable
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/rhel/gpg
        enabled: yes

    - name: Install containerd
      ansible.builtin.dnf:
        name: containerd.io
        state: present

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate containerd default config
      ansible.builtin.shell: |
        containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable CRI plugin (containerd v2)
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'disabled_plugins = \["cri"\]'
        replace: 'disabled_plugins = []'
      notify: Restart containerd

    - name: Enable containerd
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: yes

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

# Play 3: K8s (isolated handlers)
- name: Phase 2 - Kubernetes
  hosts: k8s
  become: yes
  tasks:
    - name: Add Kubernetes repo
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes Stable
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.31/rpm/
        gpgcheck: yes
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.31/rpm/repodata/repomd.xml.key
        enabled: yes
        exclude:
          - kubelet
          - kubeadm
          - kubectl
          - cri-tools
          - kubernetes-cni

    - name: Install kubeadm kubelet kubectl 
      ansible.builtin.dnf:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Enable kubelet
      ansible.builtin.service:
        name: kubelet
        state: started
        enabled: yes


# Play 4: HAProxy + Keepalived for HA
- name: Phase 3 - HA Load Balancer
  hosts: k8s_masters
  become: yes 
  tags: ha_setup
  vars:
    vip: "10.0.61.100"
    api_port: 6443
    haproxy_port: 16443
    interface: "eth0"
    masters:
      - { ip: "10.0.61.10", priority: 101 }
      - { ip: "10.0.61.11", priority: 100 }
      - { ip: "10.0.61.12", priority: 99 }
  tasks:
    - name: Install HAProxy and Keepalived 
      ansible.builtin.dnf:
        name:
          - haproxy
          - keepalived
        state: present 
    
    - name: Configure HAProxy 
      ansible.builtin.template:
        src: templates/haproxy.cfg.j2 
        dest: /etc/haproxy/haproxy.cfg
      notify: Restart HAProxy

    - name: Configure Keepalived
      ansible.builtin.template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
      notify: Restart Keepalived

    - name: Allow HAProxy to bind to non-local IP
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        sysctl_file: /etc/sysctl.d/haproxy.conf
        reload: true

    - name: Enable and start HA services                               
      ansible.builtin.service:                                           
        name: "{{ item }}"                                           
        state: started
        enabled: yes   
      loop:
        - haproxy
        - keepalived  

  handlers:
    - name: Restart HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
    
    - name: Restart Keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted

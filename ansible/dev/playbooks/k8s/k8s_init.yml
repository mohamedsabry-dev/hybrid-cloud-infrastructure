---
- name: Initialize K8s Cluster
  hosts: k8s-master1
  become: yes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Init master node
      ansible.builtin.command:
        cmd: >-
          kubeadm init 
          --control-plane-endpoint=10.0.61.100:16443 
          --upload-certs 
          --pod-network-cidr=10.244.0.0/16
        creates: /etc/kubernetes/admin.conf
      register: init_output

    - name: Setup kubeconfig
      ansible.builtin.include_tasks:
        file: tasks/setup-kubeconfig.yml

    - name: Create manifests directory
      ansible.builtin.file:
        path: /opt/k8s-manifests
        state: directory
        mode: '0755'

    - name: Download Calico manifest
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
        dest: /opt/k8s-manifests/calico.yaml
        mode: '0644'

    - name: Config Network CIDR
      ansible.builtin.replace:
        path: /opt/k8s-manifests/calico.yaml
        regexp: '192.168.0.0/16'
        replace: '10.244.0.0/16'

    - name: Apply Calico Config 
      ansible.builtin.command:
        cmd: kubectl apply -f /opt/k8s-manifests/calico.yaml
      register: calico_output

- name: Setup Additional Control Nodes
  hosts: k8s_masters:!k8s-master1
  become: yes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks: 
    - name: Join control plane node
      ansible.builtin.command:
        cmd: >-
          kubeadm join 10.0.61.100:16443
          --token 5wkpaa.yla4fvjigekcm3ew 
          --discovery-token-ca-cert-hash sha256:<REDACTED_K8S_CA_HASH> 
          --control-plane 
          --certificate-key 099263cce5880f0a5259b4b26830ae55a3026e1ce455e6d6ff284c9fdeda1edd
        creates: /etc/kubernetes/admin.conf
      register: master_join_output


    - name: Setup kubeconfig
      ansible.builtin.include_tasks:
        file: tasks/setup-kubeconfig.yml
    

- name: Join Worker Nodes
  hosts: k8s_workers
  become: yes
  tasks:
    - name: Join worker to cluster
      ansible.builtin.command:
        cmd: >-
          kubeadm join 10.0.61.100:16443 
          --token 5wkpaa.yla4fvjigekcm3ew 
          --discovery-token-ca-cert-hash sha256:<REDACTED_K8S_CA_HASH>
        creates: /etc/kubernetes/kubelet.conf
      register: worker_join_output
    
    - name: Display worker join result
      ansible.builtin.debug:
        var: worker_join_output.stdout_lines

- name: Validate Cluster Up
  hosts: k8s_masters
  become: yes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for All Nodes to be ready
      ansible.builtin.pause:
        prompt: "Waiting for worker nodes to be ready"
        minutes: 3
    
    - name: K8s Validation
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: get_node_output
    
    - name: Display Final Validation
      ansible.builtin.debug:
        var: get_node_output.stdout_lines

---
- name: Phase 0 - Prerequisites on all nodes
  hosts: k8s
  become: yes
  tasks:

    - name: Disable swap
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab

    - name: Set SELinux to permissive
      ansible.builtin.shell: |
        setenforce 0
        sed -i 's/^SELINUX=enforcing$/SELINUX=permissive/' /etc/selinux/config

    - name: Disable firewalld
      ansible.builtin.shell: |
        systemctl disable --now firewalld

    - name: Enable kernel modules config
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Load kernel modules immediately
      ansible.builtin.shell: |
        modprobe overlay
        modprobe br_netfilter

    - name: Set sysctl params
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl
      ansible.builtin.shell: sysctl --system

    - name: Add containerd repo
          ansible.builtin.copy:
            dest: /etc/yum.repos.d/containerd.repo
            content: |
              [containerd]
              name=containerd
              baseurl=https://download.docker.com/linux/rhel/9/x86_64/stable
              enabled=1
              gpgcheck=1
              gpgkey=https://download.docker.com/linux/rhel/gpg

    - name: Install and configure containerd
      ansible.builtin.shell: |
        dnf install -y containerd.io
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        systemctl restart containerd
        systemctl enable containerd

    - name: Add Kubernetes repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Install kubeadm kubelet kubectl
      ansible.builtin.shell: |
        dnf install -y python3-dnf-plugin-versionlock
        dnf install -y kubelet kubeadm kubectl --disableexcludes=kubernetes
        dnf versionlock add kubelet kubeadm kubectl

    - name: Enable kubelet
      ansible.builtin.shell: |
        systemctl enable --now kubelet


- name: Setup K8s VIP & Loadbalancer
  hosts: k8s_masters
  become: yes
  tags: ha_setup
  vars:
      vip: "10.0.61.100"
      master1_ip: "10.0.61.10"
      master2_ip: "10.0.61.11"
      master3_ip: "10.0.61.12"
      interface: "eth0"  # change to your actual network interface name

  tasks:

    - name: Install keepalived and haproxy
      ansible.builtin.shell: |
        dnf install -y keepalived haproxy

    - name: Configure HAProxy
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
            log /dev/log local0
            daemon

          defaults
            log global
            mode tcp
            option tcplog
            timeout connect 5s
            timeout client  50s
            timeout server  50s

          frontend k8s_api
            bind 10.0.61.100:6443
            default_backend k8s_masters

          backend k8s_masters
            balance roundrobin
            option tcp-check
            server master1 {{ master1_ip }}:6443 check
            server master2 {{ master2_ip }}:6443 check
            server master3 {{ master3_ip }}:6443 check

    - name: Configure keepalived on master1
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        content: |
          vrrp_instance VI_1 {
            state {{ 'MASTER' if inventory_hostname == 'k8s-master1.lab.local' else 'BACKUP' }}
            interface {{ interface }}
            virtual_router_id 51
            priority {{ '101' if inventory_hostname == 'k8s-master1.lab.local' else '100' if inventory_hostname == 'k8s-master2.lab.local' else '99' }}
            advert_int 1
            authentication {
              auth_type PASS
              auth_pass k8slab
            }
            virtual_ipaddress {
              {{ vip }}
            }
          }

    - name: Enable and start HAProxy
      ansible.builtin.shell: |
        systemctl enable --now haproxy

    - name: Enable and start keepalived
      ansible.builtin.shell: |
        systemctl enable --now keepalived
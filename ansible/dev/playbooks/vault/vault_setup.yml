# Setup, Install, Config, Deploy HashiCorp Vault
# Save in ansible/dev/playbooks/vault/vault_setup.yml
---
- name:  Configure FreeIPA Service Principals for Vault
  hosts: freeipa
  become: yes
  tasks:

    - name: Add Vault VIP host to FreeIPA
      freeipa.ansible_freeipa.ipahost:
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: vault.lab.local
        ip_address: "10.0.62.100"
        state: present

    - name: Add managedby relationship for Vault VIP
      ansible.builtin.shell: |
        echo "{{ ipaadmin_password }}" | kinit admin
        ipa host-add-managedby vault.lab.local --hosts=vault1.lab.local
        ipa host-add-managedby vault.lab.local --hosts=vault2.lab.local
        ipa host-add-managedby vault.lab.local --hosts=vault3.lab.local
        kdestroy
      failed_when: false
      no_log: true

    - name: Add service managedby for VIP service
      ansible.builtin.shell: |
        echo "{{ ipaadmin_password }}" | kinit admin
        ipa service-mod vault/vault.lab.local --addattr=managedby=fqdn=vault1.lab.local,cn=computers,cn=accounts,dc=lab,dc=local
        ipa service-mod vault/vault.lab.local --addattr=managedby=fqdn=vault2.lab.local,cn=computers,cn=accounts,dc=lab,dc=local
        ipa service-mod vault/vault.lab.local --addattr=managedby=fqdn=vault3.lab.local,cn=computers,cn=accounts,dc=lab,dc=local
        kdestroy
      failed_when: false
      no_log: true

    - name: Create Vault service principals in FreeIPA
      freeipa.ansible_freeipa.ipaservice:
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "vault/{{ item }}"
        state: present
      loop:
        - vault1.lab.local
        - vault2.lab.local
        - vault3.lab.local
        - vault.lab.local

- name:  Configure hashicorp vault user & group on freeipa
  hosts: freeipa
  become: yes
  tasks:

    - name: Create Vault admin users in FreeIPA
      freeipa.ansible_freeipa.ipauser:
          ipaadmin_principal: "{{ ipaadmin_principal }}"
          ipaadmin_password: "{{ ipaadmin_password }}"
          name: "{{ item.name }}"
          first: "{{ item.first }}"
          last: "{{ item.last }}"
          title: "{{ item.description }}"
          password: "{{ item.password }}"
          update_password: "{{ item.update_password }}"
          state: present
  
      loop: "{{ hashicorp_vault_users }}"
      no_log: true
      
    - name: Create Vault admins group in FreeIPA
      freeipa.ansible_freeipa.ipagroup:
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: vault-admins
        description: "HashiCorp Vault administrators"
        user: "{{ hashicorp_vault_users | map(attribute='name') | list }}"
        state: present


- name: Deploy HashiCorp Vault
  hosts: vault_cluster
  become: yes
  tasks:

    - name: Install required dependencies
      ansible.builtin.dnf:
        name:
          - gnupg2
        state: present

    - name: Add HashiCorp YUM repository
      ansible.builtin.yum_repository:
        name: hashicorp
        description: HashiCorp Stable - $basearch
        baseurl: https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable
        gpgkey: https://rpm.releases.hashicorp.com/gpg
        gpgcheck: yes
        enabled: yes

    - name: Import HashiCorp GPG key into RPM keystore
      ansible.builtin.rpm_key:
        key: https://rpm.releases.hashicorp.com/gpg
        state: present

    - name: Install Vault
      ansible.builtin.dnf:
        name: vault
        state: present

    - name: Verify Vault binary
      ansible.builtin.command: vault --version
      register: vault_version
      changed_when: false

    - name: Print Vault version
      ansible.builtin.debug:
        msg: "{{ vault_version.stdout }}"

    - name: Add Vault cluster nodes to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          10.0.62.10  vault1.lab.local  vault1
          10.0.62.11  vault2.lab.local  vault2
          10.0.62.12  vault3.lab.local  vault3
        marker: "# {mark} ANSIBLE MANAGED - vault cluster"

    - name: Create vault group
      ansible.builtin.group:
        name: vault
        system: yes
        state: present

    - name: Create vault user
      ansible.builtin.user:
        name: vault
        group: vault
        system: yes
        shell: /sbin/nologin
        home: /opt/vault
        create_home: no
        state: present

    - name: Create Vault directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: vault
        group: vault
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/vault,      mode: "0750" }
        - { path: /opt/vault/data, mode: "0750" }
        - { path: /opt/vault/tls,  mode: "0700" }
        - { path: /etc/vault.d,    mode: "0750" }
        - { path: /var/log/vault,  mode: "0750" }

    - name: Ensure certmonger is started and enabled
      ansible.builtin.systemd:
        name: certmonger
        state: started
        enabled: yes

    - name: Check current cert issuer
      ansible.builtin.command: >
        openssl x509 -in /opt/vault/tls/tls.crt -noout -issuer
      register: cert_issuer
      changed_when: false
      failed_when: false

    - name: Remove placeholder TLS files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/vault/tls/tls.crt
        - /opt/vault/tls/tls.key
      when: "'HashiCorp' in cert_issuer.stdout or cert_issuer.rc != 0"
    
    - name: Request signed certificate from FreeIPA
      ansible.builtin.command: >
        ipa-getcert request
        -w
        -f /opt/vault/tls/tls.crt
        -k /opt/vault/tls/tls.key
        -K vault/{{ inventory_hostname }}
        -N CN={{ inventory_hostname }}
        -D {{ inventory_hostname }}
        -D vault.lab.local
        -C "systemctl reload vault"
      when: "'HashiCorp' in cert_issuer.stdout or cert_issuer.rc != 0"

    - name: Set correct ownership on TLS files
      ansible.builtin.file:
        path: "{{ item }}"
        owner: vault
        group: vault
        mode: "0600"
      loop:
        - /opt/vault/tls/tls.crt
        - /opt/vault/tls/tls.key

    - name: Deploy vault credentials file
      ansible.builtin.template:
        src: templates/vault.env.j2
        dest: /etc/vault.d/vault.env
        owner: vault
        group: vault
        mode: "0600"
      no_log: true

    - name: Deploy Vault configuration
      ansible.builtin.template:
        src: templates/vault.hcl.j2
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: "0640"

    - name: Set Vault environment variables
      ansible.builtin.copy:
        dest: /etc/profile.d/vault.sh
        content: |
           export VAULT_ADDR=https://{{ inventory_hostname }}:8200
           export VAULT_CACERT=/etc/ipa/ca.crt
        owner: root
        group: root
        mode: "0644"


    - name: Enable and start Vault service
      ansible.builtin.systemd:
        name: vault
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Display next steps
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VAULT SETUP COMPLETE - MANUAL STEPS REQUIRED"
          - "=============================================="
          - ""
          - "1. INITIALIZE VAULT (on vault1 only):"
          - "   ssh vault1.lab.local"
          - "   vault operator init -recovery-shares=5 -recovery-threshold=3"
          - "   Save recovery keys and root token to AWS Secrets Manager!"
          - ""
          - "2. RUN CONFIGURATION PLAYBOOK:"
          - "   ansible-playbook -i inventory/inventory.ini playbooks/vault/vault_config.yml -e 'vault_root_token=hvs.xxxxx'"
          - ""
          - "=============================================="

# Vault AWS Trust Setup
# ======================
# Prerequisites:
#   ansible-vault create ansible/dev/group_vars/vault/secrets.yml
#   # Add to encrypted file:
#   #   aws_account_id: "123456789012"
#   #   access_key: "AKIA..."
#   #   secret_key: "wJalr..."
#   #   region: "us-east-1"
#
# Run:
#   ansible-playbook vault-trust-aws.yml --ask-vault-pass
---
- name: Setup Vault AWS Trust
  hosts: vault1.lab.local
  become: yes

  vars_files:
    - "{{ playbook_dir }}/../../group_vars/vault/secrets.yml"

  vars_prompt:
    - name: vault_admin_token
      prompt: "Vault admin token"
      private: yes

  environment:
    VAULT_ADDR: "https://vault1.lab.local:8200"
    VAULT_TOKEN: "{{ vault_admin_token }}"
    VAULT_CACERT: "/etc/ipa/ca.crt"
  tasks:
    - name: Check if AWS secret engine is enabled
      ansible.builtin.shell: vault secrets list -format=json | jq -e '.["aws/"]'
      register: aws_engine_check
      ignore_errors: yes
      changed_when: false

    - name: Enable AWS secret engine
      ansible.builtin.shell: vault secrets enable aws
      when: aws_engine_check.rc != 0

    - name: Configure Vault with the IAM user credentials
      ansible.builtin.shell: |
        vault write aws/config/root \
          access_key="{{ access_key }}" \
          secret_key="{{ secret_key }}" \
          region="{{ region }}"

    - name: Create Vault AWS role for etcd-backup
      ansible.builtin.shell: |
        vault write aws/roles/etcd-backup \
          credential_type=assumed_role \
          role_arns="arn:aws:iam::{{ aws_account_id }}:role/etcd-backup-role" \
          default_sts_ttl=1h \
          max_sts_ttl=2h

    - name: Create Vault policy for etcd-backup
      ansible.builtin.shell: |
        vault policy write etcd-backup-policy - <<EOF
        path "aws/creds/etcd-backup" {
          capabilities = ["read"]
        }
        EOF
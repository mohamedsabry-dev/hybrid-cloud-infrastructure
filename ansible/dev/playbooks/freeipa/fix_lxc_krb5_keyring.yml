# ============================================================================
# FIX_LXC_KRB5_KEYRING.YML - Fix Kerberos Credential Cache on LXC
# ============================================================================
# PURPOSE: Fix Kerberos keyring issue on unprivileged LXC containers
# ISSUE: LXC containers use kernel keyring for krb5 ccache by default,
#        which fails due to UID mapping in unprivileged containers
# SOLUTION: Switch to FILE-based ccache (/tmp/krb5cc_%U)
#
# REFERENCE: See NOTES.md troubleshooting case 17 (UID mapping issues)
# RUN AFTER: add_hosts_to_ipa.yml (requires SSSD to be configured)
# ============================================================================
---
- name: Fix Kerberos keyring issue on LXC containers
  hosts: lxc
  become: yes

  tasks:
    - name: Check if sssd.conf exists
      ansible.builtin.stat:
        path: /etc/sssd/sssd.conf
      register: sssd_conf

    - name: Backup sssd.conf
      ansible.builtin.copy:
        src: /etc/sssd/sssd.conf
        dest: /etc/sssd/sssd.conf.backup
        remote_src: yes
        mode: preserve
      when: sssd_conf.stat.exists

    - name: Add FILE-based krb5 ccache to sssd.conf
      ansible.builtin.lineinfile:
        path: /etc/sssd/sssd.conf
        regexp: '^krb5_ccache_template'
        line: 'krb5_ccache_template = FILE:/tmp/krb5cc_%U'
        insertafter: '^\[domain/'
        state: present
      when: sssd_conf.stat.exists
      notify:
        - Clear SSSD cache
        - Restart SSSD

  handlers:
    - name: Clear SSSD cache
      ansible.builtin.command:
        cmd: sss_cache -E
      changed_when: true

    - name: Restart SSSD
      ansible.builtin.service:
        name: sssd
        state: restarted

# /playbooks/freeipa_setup.yml
---
- name: Install FreeIPA Server
  hosts: freeipa
  become: yes

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ ipaserver_hostname }}"

    - name: Add hostname to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} {{ ipaserver_hostname }} {{ freeipa_alias }}"
        state: present

    - name: Allow FreeIPA Firewall Services
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: yes
        immediate: yes
      loop: "{{ freeipa_firewall_services }}"

    - name: Install FreeIPA Server
      ansible.builtin.include_role:
        name: freeipa.ansible_freeipa.ipaserver
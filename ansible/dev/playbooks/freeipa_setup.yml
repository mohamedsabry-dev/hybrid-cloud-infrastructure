# /playbooks/freeipa_setup.yml
---
- name: Install FreeIPA Server
  hosts: freeipa
  become: yes

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ ipaserver_hostname }}"

    - name: Remove localhost entries for FreeIPA hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^(127\\.0\\.0\\.1|::1).*{{ freeipa_alias }}.*"
        state: absent

    - name: Add hostname to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} {{ ipaserver_hostname }} {{ freeipa_alias }}"
        state: present

    - name: Start and enable firewalld service
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow FreeIPA Firewall Services
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: yes
        immediate: yes
      loop: "{{ freeipa_firewall_services }}"

    - name: Ensure /etc/ipa directory exists
      ansible.builtin.file:
        path: /etc/ipa
        state: directory
        mode: '0755'

    - name: Install FreeIPA Server
      ansible.builtin.include_role:
        name: freeipa.ansible_freeipa.ipaserver

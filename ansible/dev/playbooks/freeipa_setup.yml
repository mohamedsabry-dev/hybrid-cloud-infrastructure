---
- name: Install freeipa
  hosts: freeipa
  become: yes
  tasks: 
    - name: Check OS 
      ansible.builtin.command:
        cmd: cat /etc/os-release
      register: os_info
    
    - name: Show OS info
      ansible.builtin.debug:
        msg: "{{ os_info.stdout }}"

    - name: Ping Google
      ansible.builtin.command:
        cmd: ping -c 1 google.com
      register: ping_result
    
    - name: Show ping result
      ansible.builtin.debug:
        msg: "{{ ping_result.stdout }}"
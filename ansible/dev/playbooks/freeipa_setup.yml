# /playbooks/freeipa_setup.yml
---
- name: Install FreeIPA Server
  hosts: freeipa
  become: yes

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ ipaserver_hostname }}"

    - name: Remove localhost entries for FreeIPA hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^(127\\.0\\.0\\.1|::1).*{{ freeipa_alias }}.*"
        state: absent

    - name: Add hostname to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} {{ ipaserver_hostname }} {{ freeipa_alias }}"
        state: present

    - name: Start and enable firewalld service
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow FreeIPA Firewall Services
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: yes
        immediate: yes
      loop: "{{ freeipa_firewall_services }}"

    - name: Install FreeIPA server packages
      ansible.builtin.dnf:
        name:
          - ipa-server
          - ipa-server-dns
        state: present

    - name: Ensure IPA directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/ipa
        - /var/lib/ipa
        - /var/lib/ipa/sysrestore

    - name: Check if FreeIPA is already installed
      ansible.builtin.command:
        cmd: ipactl status
      register: ipa_status
      ignore_errors: yes
      changed_when: false

    - name: Install FreeIPA Server
      ansible.builtin.command:
        cmd: >
          ipa-server-install
          --hostname={{ ipaserver_hostname }}
          --domain={{ ipaserver_domain }}
          --realm={{ ipaserver_realm }}
          --ds-password={{ ipadm_password }}
          --admin-password={{ ipaadmin_password }}
          --setup-dns
          --forwarder=8.8.8.8
          --forwarder=1.1.1.1
          --ntp-server=pool.ntp.org
          --unattended
      when: ipa_status.rc != 0

---
- name: Prep Jenkins Agents
  hosts: jenkins_agents
  become: yes
  tasks:
    - name: Install Java
      ansible.builtin.apt:
        name: openjdk-21-jre
        state: present
        update_cache: yes

    - name: Install Python3
      ansible.builtin.apt:
        name: python3
        state: present

    - name: Create jenkins system user
      ansible.builtin.user:
        name: jenkins
        system: yes
        shell: /bin/bash
        home: /home/jenkins
        create_home: yes

    - name: Create agent work directory
      ansible.builtin.file:
        path: /home/jenkins/agent
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'


- name: Install Docker on agent1 only
  hosts: jenkins_agent1
  become: yes
  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Add jenkins user to docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: yes

    - name: Ensure docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
---
- name: Bootstrap Ansible LXC
  hosts: localhost
  become: true

  tasks:
    - name: Install System Packages
      dnf:
        name:
          - python3
          - python3-pip
          - git
          - sshpass
          - jq
        state: present

    - name: Install Ansible Collections
      command: ansible-galaxy collection install -r /opt/ansible/infrastructure/ansible/dev/requirements.yml

    - name: Get latest kubectl version
      uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: yes
      register: kubectl_version

    - name: Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Install Flux CLI
      shell: curl -s https://fluxcd.io/install.sh | bash
      args:
        creates: /usr/local/bin/flux
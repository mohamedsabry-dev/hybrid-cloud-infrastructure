  upstream apaches {
      least_conn;
      server apache-1:80;
      server apache-2:80;
      server apache-3:80;
  }
  
  server {
      listen 80;
                                              
      location / {
          proxy_pass http://apaches;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
      }
  }       

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: descheduler
      version: "0.31.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: kube-system
  values:
    # Run as CronJob every 5 minutes
    kind: CronJob
    schedule: "*/5 * * * *"

    # High priority - cluster control plane level
    priorityClassName: system-cluster-critical

    # Descheduler policies
    deschedulerPolicy:
      profiles:
        - name: default
          pluginConfig:
            # Spread replicas across nodes (important for HA)
            - name: RemoveDuplicates
              args:
                excludeOwnerKinds:
                  - DaemonSet

            # Balance node utilization
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 20
                  memory: 20
                  pods: 20
                targetThresholds:
                  cpu: 50
                  memory: 50
                  pods: 50

            # Fix pods violating node affinity rules
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution

            # Fix pods violating inter-pod anti-affinity
            - name: RemovePodsViolatingInterPodAntiAffinity

            # Clean up pods with too many restarts
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 10
                includingInitContainers: true

          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsHavingTooManyRestarts

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi


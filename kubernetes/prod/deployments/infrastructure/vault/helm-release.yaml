apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 5m
  chart:
    spec:
      chart: vault
      version: "0.32.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: vault
  values:
    global:
      externalVaultAddr: "https://vault.lab.local:8200"
    server:
      enabled: false
    injector:
      enabled: true
      priorityClassName: system-cluster-critical

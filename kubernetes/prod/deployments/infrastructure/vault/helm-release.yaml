apiVersion: helm.toolkit.fluxcd.io.v2beta1
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 5m
  chart:
    spec:
      chart: vault
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: vault
  values:
    global:
      externalVaultAddr: "https://vault.lab.local:8200"
    server:
      enabled: false
    injector:
      enabled: true

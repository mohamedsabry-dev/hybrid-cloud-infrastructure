---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-monitoring
  labels:
    type: nfs
    environment: prod
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "NFS storage for monitoring namespace"
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.40.120
    path: /volume1/k8s-prod/monitoring

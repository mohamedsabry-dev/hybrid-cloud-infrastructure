apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-testing
provisioner: nfs.csi.k8s.io
parameters:
  server: "10.0.40.120"
  share: "/volume1/k8s-prod/testing"
  onDeletePolicy: delete
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - soft
  - timeo=30
  - retrans=3

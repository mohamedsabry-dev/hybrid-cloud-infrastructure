apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: This file is kept for backwards compatibility
# The actual deployment ordering is now controlled by:
# - infrastructure-sync.yaml (deploys first, waits for vault-agent-injector)
# - apps-sync.yaml (deploys after infrastructure is healthy)
# See: kubernetes/prod/flux/
resources:
  - infrastructure
  - apps
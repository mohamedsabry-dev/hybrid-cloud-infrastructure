apiVersion: helm.toolkit.fluxcd.io.v2beta1
kind: HelmRelease
metadata: 
  name: vault
  namespace: vault
spec:
  interval: 5m
  chart:
    spec:
      chart: vault
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: vault
  values:
    global:
      externalVaultAddr: "http://vault1.lab.local:8200"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-monitoring
  labels:
    type: nfs
    environment: dev
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "NFS storage for monitoring namespace"
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - soft
    - timeo=30
    - retrans=3
  nfs:
    server: 10.0.40.120
    path: /volume1/k8s-dev/monitoring

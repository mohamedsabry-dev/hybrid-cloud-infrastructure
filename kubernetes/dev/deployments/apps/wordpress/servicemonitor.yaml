apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wordpress
  namespace: apps
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/managed-by: flux
    environment: dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

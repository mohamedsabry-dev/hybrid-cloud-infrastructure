apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: apps
  labels:
    environment: dev
    app.kubernetes.io/managed-by: flux
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
        environment: dev
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "wordpress"
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/wordpress/config"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/wordpress/config" -}}
          WORDPRESS_DB_PASSWORD={{ .Data.data.db_password }}
          {{- end }}
        vault.hashicorp.com/tls-skip-verify: "false"
        vault.hashicorp.com/tls-secret: "vault-ca"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
    spec:
      serviceAccountName: wordpress-sa
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mariadb-svc.database.svc.cluster.local 3306; do
                echo "Waiting for MariaDB..."
                sleep 2
              done
              echo "MariaDB is ready!"
      containers:
        - name: wordpress
          image: wordpress:6.4-php8.2-apache
          ports:
            - containerPort: 80
              name: http
          command:
            - /bin/bash
            - -c
            - |
              # Source Vault secrets
              if [ -f /vault/secrets/db-creds ]; then
                export $(cat /vault/secrets/db-creds | xargs)
              fi
              exec docker-entrypoint.sh apache2-foreground
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb-svc.database.svc.cluster.local
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data

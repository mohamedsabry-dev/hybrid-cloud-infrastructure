apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: apps
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: flux
    environment: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
        app.kubernetes.io/name: wordpress
        environment: dev
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "wordpress"
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/wordpress/config"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/wordpress/config" -}}
          WORDPRESS_DB_PASSWORD={{ .Data.data.db_password }}
          {{- end }}
        vault.hashicorp.com/tls-skip-verify: "false"
        vault.hashicorp.com/tls-secret: "vault-ca"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
    spec:
      serviceAccountName: wordpress-sa
      # Spread pods across different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: wordpress
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mariadb-svc.database.svc.cluster.local 3306; do
                echo "Waiting for MariaDB..."
                sleep 2
              done
              echo "MariaDB is ready!"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: wordpress
          image: wordpress:6.7.1-php8.2-apache
          ports:
            - containerPort: 80
              name: http
          command:
            - /bin/bash
            - -c
            - |
              # Source Vault secrets
              if [ -f /vault/secrets/db-creds ]; then
                export $(cat /vault/secrets/db-creds | xargs)
              fi
              # Enable Apache mod_status for apache_exporter
              a2enmod status
              cat > /etc/apache2/conf-enabled/server-status.conf << 'EOF'
              ExtendedStatus On
              <Location /server-status>
                SetHandler server-status
                Require local
              </Location>
              EOF
              exec docker-entrypoint.sh apache2-foreground
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb-svc.database.svc.cluster.local
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /wp-includes/images/blank.gif
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /wp-includes/images/blank.gif
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html/wp-content

        - name: apache-exporter
          image: lusotycoon/apache-exporter:v0.11.0
          args:
            - --scrape_uri=http://localhost/server-status?auto
          ports:
            - containerPort: 9117
              name: metrics
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"

      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data

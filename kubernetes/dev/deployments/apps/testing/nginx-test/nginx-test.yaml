apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: testing
  labels:
    environment: dev
    app.kubernetes.io/managed-by: flux
    workload: testing
  annotations:
    description: "Nginx App Deployment for Testing PV,PVC Config"
    kubernetes.io/change-cause: "Add secret volume mount for nginx-secret"
spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-test

  template:
    metadata:
      labels:
        app: nginx-test
        environment: dev
        workload: testing
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "nginx"
        vault.hashicorp.com/agent-inject-secret-config.txt: "secret/data/nginx/config"
        vault.hashicorp.com/tls-skip-verify: "true"  # TODO: Mount FreeIPA CA instead

    spec:
      serviceAccountName: nginx-sa
      containers:
        - name: nginx
          image:  nginx:latest
          volumeMounts:
            - name: nfs-vol
              mountPath: /usr/share/nginx/html

            - name: nginx-config-vol
              mountPath: /etc/nginx/conf.d

            # Replaced by Vault injection - vault.hashicorp.com/agent-inject-secret-*
            # - name: nginx-secret-vol
            #   mountPath: /etc/nginx/secrets
      volumes:
        - name: nfs-vol
          persistentVolumeClaim:
            claimName: testing-storage

        - name: nginx-config-vol
          configMap:
            name: nginx-config

        # Replaced by Vault injection - secret now comes from Vault
        # - name: nginx-secret-vol
        #   secret:
        #     secretName: nginx-secret

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: testing
  labels:
    environment: dev
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "Service for nginx test deployment"
spec:
  selector:
    app: nginx-test
  type: NodePort
  ports:
    - port: 8080
      targetPort: 80
      nodePort: 30080
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: prometheus
    environment: dev
spec:
  groups:
  # External infrastructure nodes (FreeIPA, Vault, Ansible, etc.)
  - name: external-nodes
    rules:
    - alert: ExternalNodeDown
      expr: up{job="external-nodes"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.instance }} is down"
        description: "{{ $labels.role }} node unreachable for 2 minutes"

    - alert: ExternalNodeHighCPU
      expr: 100 - (avg by(instance, role) (rate(node_cpu_seconds_total{job="external-nodes", mode="idle"}[5m])) * 100) > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.instance }} high CPU (>90%)"

    - alert: ExternalNodeHighMemory
      expr: (1 - (node_memory_MemAvailable_bytes{job="external-nodes"} / node_memory_MemTotal_bytes{job="external-nodes"})) * 100 > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.instance }} high memory (>90%)"

  # Kubernetes workload alerts
  - name: workloads
    rules:
    - alert: PodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.namespace }}/{{ $labels.pod }} crash looping"
        description: "Pod restarted more than 5 times in the last hour"

    - alert: HPAMaxedOut
      expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} at max"
        description: "HPA running at max replicas for 15 minutes - may need more capacity"

    - alert: NodeStillDownAfterRemediation
      expr: kube_node_status_condition{condition="Ready", status="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} still down"
        description: "Node not ready for 5 minutes - remediation may have failed"

  # Kubernetes node resource alerts
  - name: kubernetes-nodes
    rules:
    - alert: KubernetesNodeHighCPU
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} high CPU ({{ $value | printf \"%.1f\" }}%)"
        description: "Node CPU above 85% for 5 minutes. Check for runaway processes (qemu-ga, stuck loops)."

    - alert: KubernetesNodeCriticalCPU
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.instance }} critical CPU ({{ $value | printf \"%.1f\" }}%)"
        description: "Node CPU above 95% for 2 minutes. Immediate investigation required."

    - alert: KubernetesNodeHighLoad
      expr: node_load5 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} high load average ({{ $value | printf \"%.2f\" }})"
        description: "5-minute load average is 2x CPU count for 5 minutes. Possible CPU saturation or busy loop."

    - alert: KubernetesNodeHighSystemCPU
      expr: avg by(instance) (rate(node_cpu_seconds_total{mode="system"}[5m])) * 100 > 30
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} high system CPU ({{ $value | printf \"%.1f\" }}%)"
        description: "High kernel/system CPU usage. May indicate I/O issues, busy loops (qemu-ga EAGAIN), or driver problems."

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.18.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-stack
        namespace: monitoring
  values:

    # ---------------------------------------------------------------------------
    # Grafana
    # ---------------------------------------------------------------------------
    grafana:
      # HA: 3 replicas spread across workers (DR Test finding - single replica was SPOF)
      replicas: 3

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana
              topologyKey: kubernetes.io/hostname

      serviceAccount:
        create: false
        name: grafana-sa

      # Vault agent injection — mirrors MariaDB/WordPress pattern
      podAnnotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "grafana"
        vault.hashicorp.com/agent-inject-secret-grafana-admin: "secret/data/grafana/config"
        vault.hashicorp.com/agent-inject-template-grafana-admin: |
          {{- with secret "secret/data/grafana/config" -}}
          GF_SECURITY_ADMIN_USER={{ .Data.data.admin_user }}
          GF_SECURITY_ADMIN_PASSWORD={{ .Data.data.admin_password }}
          {{- end }}
        vault.hashicorp.com/tls-skip-verify: "false"
        vault.hashicorp.com/tls-secret: "vault-ca"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"

      # Source Vault-injected env file before starting Grafana (same pattern as MariaDB/WordPress)
      command:
        - /bin/bash
        - -c
        - |
          if [ -f /vault/secrets/grafana-admin ]; then
            export $(cat /vault/secrets/grafana-admin | xargs)
          fi
          exec /run.sh

      # Placeholder — Vault value overrides this at runtime
      adminPassword: "vault-overridden"

      persistence:
        enabled: true
        storageClassName: nfs-retain
        accessModes:
          - ReadWriteMany  # RWX required for multiple replicas
        size: 5Gi

      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - grafana-dev.lab.local
      
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false

    # ---------------------------------------------------------------------------
    # Prometheus
    # ---------------------------------------------------------------------------
    prometheus:
      prometheusSpec:
        # Scrape ALL ServiceMonitors/PodMonitors in the cluster, not just this release
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

        # External hosts — K8s nodes are excluded (covered by node-exporter DaemonSet)
        additionalScrapeConfigs:
          - job_name: external-nodes
            scrape_interval: 30s
            static_configs:
              - targets: ['10.0.60.10:9100']
                labels:
                  instance: freeipa.lab.local
                  role: freeipa
              - targets: ['10.0.62.10:9100']
                labels:
                  instance: vault1.lab.local
                  role: vault
              - targets: ['10.0.62.11:9100']
                labels:
                  instance: vault2.lab.local
                  role: vault
              - targets: ['10.0.62.12:9100']
                labels:
                  instance: vault3.lab.local
                  role: vault
              - targets: ['10.0.63.10:9100']
                labels:
                  instance: ansible.lab.local
                  role: automation
              - targets: ['10.0.63.20:9100']
                labels:
                  instance: local-runner.lab.local
                  role: automation
              - targets: ['10.0.65.10:9100']
                labels:
                  instance: ex-nginx.lab.local
                  role: nginx

    # ---------------------------------------------------------------------------
    # Node Exporter — tolerate master/control-plane taints
    # ---------------------------------------------------------------------------
    prometheus-node-exporter:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

    # ---------------------------------------------------------------------------
    # Alertmanager (with Vault SMTP credentials injection)
    # ---------------------------------------------------------------------------
    # Setup: Run these commands to configure Vault for Alertmanager:
    #
    #   vault login -method=ldap username=YOUR_USER
    #
    #   vault kv put secret/alertmanager/config \
    #     smtp_from="your@gmail.com" \
    #     smtp_password="your-app-password" \
    #     alert_email="your@gmail.com"
    #
    #   vault policy write alertmanager-policy - <<EOF
    #   path "secret/data/alertmanager/config" { capabilities = ["read"] }
    #   EOF
    #
    #   vault write auth/kubernetes/role/alertmanager \
    #     bound_service_account_names="alertmanager-sa" \
    #     bound_service_account_namespaces="monitoring" \
    #     policies="alertmanager-policy" ttl="1h"
    #
    #   vault token revoke -self
    # ---------------------------------------------------------------------------
    alertmanager:
      alertmanagerSpec:
        # Service account for Vault injection
        serviceAccountName: alertmanager-sa

        # Vault agent injects full alertmanager.yaml config
        podMetadata:
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: "alertmanager"
            vault.hashicorp.com/agent-inject-secret-alertmanager.yaml: "secret/data/alertmanager/config"
            vault.hashicorp.com/agent-inject-template-alertmanager.yaml: |
              {{- with secret "secret/data/alertmanager/config" -}}
              global:
                resolve_timeout: 5m
                smtp_smarthost: 'smtp.gmail.com:587'
                smtp_require_tls: true
                smtp_from: '{{ .Data.data.smtp_from }}'
                smtp_auth_username: '{{ .Data.data.smtp_from }}'
                smtp_auth_password: '{{ .Data.data.smtp_password }}'
              inhibit_rules:
              - equal:
                - namespace
                - alertname
                source_matchers:
                - severity = critical
                target_matchers:
                - severity =~ warning|info
              - equal:
                - namespace
                - alertname
                source_matchers:
                - severity = warning
                target_matchers:
                - severity = info
              - equal:
                - namespace
                source_matchers:
                - alertname = InfoInhibitor
                target_matchers:
                - severity = info
              - target_matchers:
                - alertname = InfoInhibitor
              receivers:
              - name: "null"
              - name: "email-alerts"
                email_configs:
                - to: '{{ .Data.data.alert_email }}'
                  send_resolved: true
              route:
                group_by:
                - namespace
                group_interval: 5m
                group_wait: 30s
                receiver: "email-alerts"
                repeat_interval: 4h
                routes:
                - matchers:
                  - alertname = "Watchdog"
                  receiver: "null"
              {{- end }}
            vault.hashicorp.com/tls-skip-verify: "false"
            vault.hashicorp.com/tls-secret: "vault-ca"
            vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"

        # Point Alertmanager to Vault-injected config
        additionalArgs:
          - name: config.file
            value: /vault/secrets/alertmanager.yaml

        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

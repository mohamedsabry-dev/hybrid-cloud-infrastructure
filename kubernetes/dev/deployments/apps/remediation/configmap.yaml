apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-script
  namespace: remediation
data:
  remediation.py: |
    import time
    import requests
    from kubernetes import client, config
    from proxmoxer import ProxmoxAPI

    # Alertmanager endpoint (runs on master, survives worker failures)
    ALERTMANAGER_URL = "http://alertmanager.monitoring.svc:9093/api/v2/alerts"

    # Configuration
    CHECK_INTERVAL = 300        # 5 minutes between checks (prevents race during boot)
    REMEDIATION_WAIT = 240      # 4 minutes wait after remediation
    PROXMOX_NODE = "pve-dev"
    NFS_STORAGE = "nas-dev-data"
    TARGET_STORAGE = "local-lvm"

    # Node to VMID mapping
    NODE_MAP = {
        "k8s-worker1.lab.local": 1020,
        "k8s-worker2.lab.local": 1021,
        "k8s-worker3.lab.local": 1022,
    }

    # Dump VMID mapping (for cloning broken VMs before restore)
    DUMP_MAP = {
        "k8s-worker1.lab.local": 5020,
        "k8s-worker2.lab.local": 5021,
        "k8s-worker3.lab.local": 5022,
    }

    # Track remediation attempts per node
    counters = {node: 0 for node in NODE_MAP}

    def load_proxmox_creds():
        creds = {}
        with open("/vault/secrets/proxmox-creds") as f:
            for line in f:
                if "=" in line:
                    k, v = line.strip().split("=", 1)
                    creds[k] = v
        return creds

    def get_proxmox_client(creds):
        host = creds["PROXMOX_HOST"].replace("https://", "").replace(":8006", "")
        return ProxmoxAPI(
            host,
            user=creds["PROXMOX_TOKEN_ID"].split("!")[0],
            token_name=creds["PROXMOX_TOKEN_ID"].split("!")[1],
            token_value=creds["PROXMOX_TOKEN_SECRET"],
            verify_ssl=False
        )

    def send_alert(node_name, action, status, severity="warning"):
        """Send alert to Alertmanager for email notification."""
        alert = [{
            "labels": {
                "alertname": "RemediationAction",
                "node": node_name,
                "action": action,
                "severity": severity
            },
            "annotations": {
                "summary": f"Remediation {action} on {node_name}: {status}",
                "description": f"Self-healing action '{action}' was performed on node {node_name}. Result: {status}"
            }
        }]
        try:
            requests.post(ALERTMANAGER_URL, json=alert, timeout=5)
            print(f"  -> Alert sent: {action} - {status}")
        except Exception as e:
            print(f"  -> Failed to send alert: {e}")

    def is_node_ready(v1, node_name):
        """Check if node exists and is Ready."""
        try:
            node = v1.read_node(node_name)
            for condition in node.status.conditions:
                if condition.type == "Ready":
                    return condition.status == "True"
            return False
        except client.exceptions.ApiException as e:
            if e.status == 404:
                print(f"  Node {node_name} not found in cluster")
                return False
            raise

    def is_node_healthy(v1, node_name):
        """Check if node is Ready."""
        node_ready = is_node_ready(v1, node_name)

        if not node_ready:
            return False, "Node NotReady"

        return True, "OK"

    def get_vm_status(proxmox, vmid):
        """Get current VM status from Proxmox API."""
        try:
            status = proxmox.nodes(PROXMOX_NODE).qemu(vmid).status.current.get()
            return status.get("status", "unknown")
        except Exception as e:
            print(f"  -> Failed to get VM {vmid} status: {e}")
            return "unknown"

    def start_vm(proxmox, vmid):
        """Start a stopped VM."""
        print(f"  -> Starting VM {vmid}")
        proxmox.nodes(PROXMOX_NODE).qemu(vmid).status.start.post()

    def reboot_vm(proxmox, vmid):
        """Soft reboot via ACPI - checks status first."""
        vm_status = get_vm_status(proxmox, vmid)
        print(f"  -> VM {vmid} status: {vm_status}")

        if vm_status == "stopped":
            print(f"  -> VM {vmid} is stopped, starting instead of rebooting")
            start_vm(proxmox, vmid)
        elif vm_status == "running":
            print(f"  -> Rebooting VM {vmid}")
            proxmox.nodes(PROXMOX_NODE).qemu(vmid).status.reboot.post()
        elif vm_status == "paused":
            print(f"  -> VM {vmid} is paused, resuming first")
            proxmox.nodes(PROXMOX_NODE).qemu(vmid).status.resume.post()
            time.sleep(5)
            proxmox.nodes(PROXMOX_NODE).qemu(vmid).status.reboot.post()
        else:
            print(f"  -> VM {vmid} in unknown state '{vm_status}', attempting start")
            try:
                start_vm(proxmox, vmid)
            except Exception as e:
                print(f"  -> Start failed: {e}")

    def reset_vm(proxmox, vmid):
        """Hard reset - checks status first."""
        vm_status = get_vm_status(proxmox, vmid)
        print(f"  -> VM {vmid} status: {vm_status}")

        if vm_status == "stopped":
            print(f"  -> VM {vmid} is stopped, starting instead of resetting")
            start_vm(proxmox, vmid)
        elif vm_status == "running":
            print(f"  -> Hard resetting VM {vmid}")
            proxmox.nodes(PROXMOX_NODE).qemu(vmid).status.reset.post()
        else:
            print(f"  -> VM {vmid} in state '{vm_status}', attempting start")
            try:
                start_vm(proxmox, vmid)
            except Exception as e:
                print(f"  -> Start failed: {e}")

    def get_latest_backup(proxmox, vmid):
        """Get the latest backup for a VMID."""
        backups = proxmox.nodes(PROXMOX_NODE).storage(NFS_STORAGE).content.get(
            content="backup", vmid=vmid
        )
        if not backups:
            return None
        # Sort by creation time, get latest
        backups.sort(key=lambda x: x.get("ctime", 0), reverse=True)
        return backups[0]["volid"]

    def dump_exists(proxmox, dump_vmid):
        """Check if dump VM already exists (means restore was already attempted)."""
        try:
            proxmox.nodes(PROXMOX_NODE).qemu(dump_vmid).status.current.get()
            return True
        except:
            return False

    def restore_vm(proxmox, node_name, vmid, dump_vmid):
        """Clone broken VM to dump, restore main VM from backup.

        Returns: 'restored', 'skipped', or 'failed'
        """
        # Guard: if dump exists, restore was already tried - skip
        if dump_exists(proxmox, dump_vmid):
            print(f"  -> Dump VM {dump_vmid} exists - restore already attempted")
            print(f"  -> SKIPPING restore - manual intervention required")
            return "skipped"

        # Stop broken VM
        print(f"  -> Stopping VM {vmid}")
        try:
            proxmox.nodes(PROXMOX_NODE).qemu(vmid).status.stop.post()
            time.sleep(30)
        except Exception as e:
            print(f"  -> Stop failed (may already be stopped): {e}")

        # Clone to dump VMID (preserves broken state for analysis)
        print(f"  -> Cloning VM {vmid} to dump VMID {dump_vmid}")
        try:
            proxmox.nodes(PROXMOX_NODE).qemu(vmid).clone.post(
                newid=dump_vmid,
                name=f"dump-{node_name.split('.')[0]}",
                full=1
            )
            time.sleep(60)
        except Exception as e:
            print(f"  -> Clone failed: {e}")
            return "failed"

        # Get latest backup
        latest_backup = get_latest_backup(proxmox, vmid)
        if not latest_backup:
            print(f"  -> No backup found for VM {vmid}!")
            return "failed"

        print(f"  -> Restoring from {latest_backup}")

        # Delete broken VM
        try:
            proxmox.nodes(PROXMOX_NODE).qemu(vmid).delete()
            time.sleep(10)
        except Exception as e:
            print(f"  -> Delete failed: {e}")
            return "failed"

        # Restore from backup (overwrites main VMID)
        try:
            proxmox.nodes(PROXMOX_NODE).qemu.post(
                vmid=vmid,
                archive=latest_backup,
                storage=TARGET_STORAGE,
                start=1
            )
            print(f"  -> Restore initiated, VM {vmid} starting")
            return "restored"
        except Exception as e:
            print(f"  -> Restore failed: {e}")
            return "failed"

    def remediate(proxmox, node_name, vmid):
        """Escalating remediation: reboot -> reset -> restore (once only)."""
        counters[node_name] += 1
        attempt = counters[node_name]
        dump_vmid = DUMP_MAP[node_name]

        print(f"[Attempt {attempt}] Remediating {node_name} (VM {vmid})")

        if attempt == 1:
            reboot_vm(proxmox, vmid)
            send_alert(node_name, "reboot", "initiated")
            print(f"  -> Waiting {REMEDIATION_WAIT}s for recovery...")
            time.sleep(REMEDIATION_WAIT)

        elif attempt == 2:
            reset_vm(proxmox, vmid)
            send_alert(node_name, "reset", "initiated")
            print(f"  -> Waiting {REMEDIATION_WAIT}s for recovery...")
            time.sleep(REMEDIATION_WAIT)

        elif attempt == 3:
            result = restore_vm(proxmox, node_name, vmid, dump_vmid)
            if result == "restored":
                send_alert(node_name, "restore", "completed", severity="critical")
                print(f"  -> Waiting {REMEDIATION_WAIT}s for recovery...")
                time.sleep(REMEDIATION_WAIT)
            elif result == "skipped":
                send_alert(node_name, "restore", "skipped - already attempted", severity="critical")
                print(f"  -> Restore already attempted - stopping remediation")
            else:
                send_alert(node_name, "restore", "failed", severity="critical")
                print(f"  -> Restore failed - stopping remediation")

        else:
            # attempt > 3: Already tried everything, just log
            send_alert(node_name, "all-attempts", "exhausted - manual intervention required", severity="critical")
            print(f"  -> Max attempts reached - manual intervention required")

    def main():
        print("Remediation service starting...")

        # Load K8s config (in-cluster)
        config.load_incluster_config()
        v1 = client.CoreV1Api()

        # Load Proxmox client
        creds = load_proxmox_creds()
        proxmox = get_proxmox_client(creds)

        print(f"Monitoring nodes: {list(NODE_MAP.keys())}")
        print(f"Check interval: {CHECK_INTERVAL}s")

        # Startup delay: wait before first health check to avoid race during cluster boot
        print(f"Waiting {CHECK_INTERVAL}s before first health check (cluster stabilization)...")
        time.sleep(CHECK_INTERVAL)

        while True:
            print(f"\n--- Health check at {time.strftime('%Y-%m-%d %H:%M:%S')} ---")

            remediation_performed = False
            for node_name, vmid in NODE_MAP.items():
                healthy, reason = is_node_healthy(v1, node_name)

                if healthy:
                    if counters[node_name] > 0:
                        print(f"{node_name}: Recovered! Resetting counter.")
                        send_alert(node_name, "recovery", "node is healthy again", severity="info")
                        counters[node_name] = 0
                    else:
                        print(f"{node_name}: Healthy")
                else:
                    print(f"{node_name}: UNHEALTHY! ({reason})")
                    remediate(proxmox, node_name, vmid)
                    remediation_performed = True

            # If remediation happened, already waited 4 min - just do quick recheck
            # Otherwise wait full interval
            if remediation_performed:
                print("Remediation performed - quick recheck in 60s...")
                time.sleep(60)
            else:
                time.sleep(CHECK_INTERVAL)

    if __name__ == "__main__":
        main()

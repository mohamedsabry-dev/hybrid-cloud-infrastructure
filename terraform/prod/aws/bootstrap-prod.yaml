AWSTemplateFormatVersion: '2010-09-09'
Description: 'Prod Account Bootstrap: OIDC + Terraform State + Admin Role with Permissions Boundary'

# ============================================================================
# IMPORTANT: Deploy this stack to eu-west-2 (London) region ONLY
# Command: aws cloudformation deploy --template-file bootstrap-prod.yaml \
#          --stack-name prod-bootstrap --capabilities CAPABILITY_NAMED_IAM \
#          --region eu-west-2
# ============================================================================

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Deployment Configuration"
        Parameters:
          - Environment
          - Region
          - DevAccountId

Parameters:
  Environment:
    Type: String
    Default: prod

  Region:
    Type: String
    Default: eu-west-2
    AllowedValues:
      - eu-west-2
    Description: "Deployment region - MUST be eu-west-2 (London)"

  DevAccountId:
    Type: String
    Default: 'REDACTED_AWS_DEV'
    Description: Dev AWS Account ID for cross-account access

Resources:
  # ============================================================================
  # 1. GitHub OIDC Provider
  # ============================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [1c58a3a8518e8759bf075b76b750d4f2df264fcd]
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 2. Terraform State Bucket (Shared: prod/* and dev/*)
  # ============================================================================
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: hybrid-cloud-infrastructure-tf-state-eu
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 3. Terraform State Bucket Policy
  # ============================================================================
  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSL
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DevAccountListBucket
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${DevAccountId}:root"
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !GetAtt TerraformStateBucket.Arn
          - Sid: DevAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${DevAccountId}:root"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${TerraformStateBucket.Arn}/dev/*"
          - Sid: DevAccountReadProd
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${DevAccountId}:root"
            Action:
              - s3:GetObject
            Resource: !Sub "${TerraformStateBucket.Arn}/prod/*"

  # ============================================================================
  # 4. Terraform State Lock Table (Shared)
  # ============================================================================
  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: hybrid-cloud-infrastructure-tf-state-lock-eu
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      ResourcePolicy:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: DevAccountLockAccess
              Effect: Allow
              Principal:
                AWS: !Sub "arn:${AWS::Partition}:iam::${DevAccountId}:root"
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/hybrid-cloud-infrastructure-tf-state-lock-eu"
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 5. Permissions Boundary (Limits ALL roles/users created by Terraform)
  # ============================================================================
  TerraformPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: TerraformPermissionsBoundary
      Description: Prevents modification of bootstrap resources - applied to all Terraform-created roles
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Allow everything by default
          - Sid: AllowAllActions
            Effect: Allow
            Action: '*'
            Resource: '*'
          # Deny modifying OIDC Provider
          - Sid: DenyModifyOIDC
            Effect: Deny
            Action:
              - iam:DeleteOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
              - iam:RemoveClientIDFromOpenIDConnectProvider
            Resource: !Ref GitHubOIDCProvider
          # Deny modifying Terraform State Bucket
          - Sid: DenyModifyStateBucket
            Effect: Deny
            Action:
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:PutBucketPolicy
            Resource: !GetAtt TerraformStateBucket.Arn
          # Deny modifying Lock Table
          - Sid: DenyModifyLockTable
            Effect: Deny
            Action:
              - dynamodb:DeleteTable
              - dynamodb:UpdateTable
            Resource: !GetAtt TerraformLockTable.Arn
          # Deny modifying this permissions boundary
          - Sid: DenyModifyPermissionsBoundary
            Effect: Deny
            Action:
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:CreatePolicyVersion
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/TerraformPermissionsBoundary"
          # Deny modifying the Terraform admin role
          - Sid: DenyModifyTerraformRole
            Effect: Deny
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:PutRolePolicy
              - iam:DetachRolePolicy
              - iam:AttachRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:DeleteRolePermissionsBoundary
              - iam:PutRolePermissionsBoundary
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/GitHubActions-TerraformAdmin-prod"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CrossAccount-ReadOnly-prod"

  # ============================================================================
  # 6. GitHub Actions Terraform Admin Role
  # ============================================================================
  GitHubActionsTerraformRole:
    Type: AWS::IAM::Role
    DependsOn: TerraformPermissionsBoundary
    Properties:
      RoleName: GitHubActions-TerraformAdmin-prod
      Description: Full admin access with permissions boundary protecting bootstrap resources
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      PermissionsBoundary: !Ref TerraformPermissionsBoundary
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 7. Cross-Account Read-Only Role (for dev account to plan prod)
  # ============================================================================
  CrossAccountReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CrossAccount-ReadOnly-prod
      Description: Read-only access for dev account to plan prod infrastructure
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${DevAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: terraform-plan-prod
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 8. Enforce Permissions Boundary on Created Roles/Users
  # ============================================================================
  EnforceBoundaryPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EnforcePermissionsBoundary
      Roles:
        - !Ref GitHubActionsTerraformRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Deny creating roles without the permissions boundary
          - Sid: DenyCreateRoleWithoutBoundary
            Effect: Deny
            Action:
              - iam:CreateRole
            Resource: '*'
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Ref TerraformPermissionsBoundary
          # Deny creating users without the permissions boundary
          - Sid: DenyCreateUserWithoutBoundary
            Effect: Deny
            Action:
              - iam:CreateUser
            Resource: '*'
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Ref TerraformPermissionsBoundary
          # Deny removing permissions boundary from any role/user
          - Sid: DenyRemoveBoundary
            Effect: Deny
            Action:
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
              - iam:PutRolePermissionsBoundary
              - iam:PutUserPermissionsBoundary
            Resource: '*'
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Ref TerraformPermissionsBoundary

# ============================================================================
# Outputs
# ============================================================================
Outputs:
  OIDCProviderArn:
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: prod-GitHubOIDCProviderArn

  StateBucketName:
    Value: !Ref TerraformStateBucket
    Export:
      Name: prod-TerraformStateBucketName

  StateBucketArn:
    Value: !GetAtt TerraformStateBucket.Arn
    Export:
      Name: prod-TerraformStateBucketArn

  LockTableName:
    Value: !Ref TerraformLockTable
    Export:
      Name: prod-TerraformLockTableName

  LockTableArn:
    Value: !GetAtt TerraformLockTable.Arn
    Export:
      Name: prod-TerraformLockTableArn

  PermissionsBoundaryArn:
    Value: !Ref TerraformPermissionsBoundary
    Export:
      Name: prod-TerraformPermissionsBoundaryArn

  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsTerraformRole.Arn
    Export:
      Name: prod-GitHubActionsRoleArn

  CrossAccountReadOnlyRoleArn:
    Value: !GetAtt CrossAccountReadOnlyRole.Arn
    Export:
      Name: prod-CrossAccountReadOnlyRoleArn

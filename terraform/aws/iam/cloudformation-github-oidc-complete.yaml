AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub Actions OIDC Provider + IAM Roles for Hybrid Cloud Infrastructure'

Resources:
  # ============================================================================
  # OIDC Provider for GitHub Actions
  # ============================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 2b18947a6a9fc7764fd8b5fb18a863b0c6dac24f
      Tags:
        - Key: Name
          Value: GitHub Actions OIDC Provider
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # Bootstrap Role - Terraform State Management
  # ============================================================================
  GitHubActionsBootstrapRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubOIDCProvider
    Properties:
      RoleName: GitHubActions-Bootstrap
      Description: Bootstrap role for GitHub Actions - Terraform state management
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:sub:
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/mohamedsabrydev/infra-245-phase-1-devops-foundation
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
      Policies:
        - PolicyName: TerraformStateManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3TerraformStateAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state
                  - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state/*
              - Sid: DynamoDBStateLocking
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:eu-west-2:969041180300:table/hybrid-cloud-infrastructure-terraform-state-lock
      Tags:
        - Key: Name
          Value: GitHub Actions Bootstrap Role
        - Key: Access
          Value: MainAndSpecificBranch

  # ============================================================================
  # Network Role - VPC, Subnets, Load Balancers
  # ============================================================================
  GitHubActionsNetworkRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubOIDCProvider
    Properties:
      RoleName: GitHubActions-Network
      Description: Network role for GitHub Actions - VPC and networking resources
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/mohamedsabrydev/*
      Policies:
        - PolicyName: TerraformStateManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3TerraformStateAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state
                  - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state/*
              - Sid: DynamoDBStateLocking
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:eu-west-2:969041180300:table/hybrid-cloud-infrastructure-terraform-state-lock
        - PolicyName: NetworkFullManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: NetworkingFullManagement
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:DescribeVpcs
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:DescribeSubnets
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:DescribeRouteTables
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:DescribeNatGateways
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:DescribeAddresses
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeTags
                Resource: '*'
        - PolicyName: LoadBalancerManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LoadBalancerManagement
                Effect: Allow
                Action:
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DescribeListeners
                Resource: '*'
      Tags:
        - Key: Name
          Value: GitHub Actions Network Role
        - Key: Access
          Value: MainAndFeatureBranches

  # ============================================================================
  # Application Role - EC2, EKS, ECR
  # ============================================================================
  GitHubActionsApplicationRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubOIDCProvider
    Properties:
      RoleName: GitHubActions-Application
      Description: Application role for GitHub Actions - Compute resources
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/mohamedsabrydev/*
      Policies:
        - PolicyName: TerraformStateManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3TerraformStateAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state
                  - arn:aws:s3:::hybrid-cloud-infrastructure-terraform-state/*
              - Sid: DynamoDBStateLocking
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:eu-west-2:969041180300:table/hybrid-cloud-infrastructure-terraform-state-lock
        - PolicyName: ApplicationFullManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EC2Management
                Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:RebootInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeImages
                  - ec2:DescribeKeyPairs
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:DescribeVolumes
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeTags
                Resource: '*'
              - Sid: EKSManagement
                Effect: Allow
                Action:
                  - eks:CreateCluster
                  - eks:DeleteCluster
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - eks:UpdateClusterConfig
                  - eks:UpdateClusterVersion
                  - eks:CreateNodegroup
                  - eks:DeleteNodegroup
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                  - eks:UpdateNodegroupConfig
                  - eks:TagResource
                  - eks:UntagResource
                Resource: '*'
              - Sid: ECRManagement
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DescribeImages
                  - ecr:PutImage
                  - ecr:BatchDeleteImage
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
      Tags:
        - Key: Name
          Value: GitHub Actions Application Role
        - Key: Access
          Value: MainAndFeatureBranches

  # ============================================================================
  # ReadOnly Role - Audit and Validation
  # ============================================================================
  GitHubActionsReadOnlyRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubOIDCProvider
    Properties:
      RoleName: GitHubActions-ReadOnly
      Description: Read-only role for GitHub Actions - Audit and validation
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/mohamedsabrydev/infra-245-phase-1-devops-foundation
      Policies:
        - PolicyName: ReadOnlyAuditAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOnlyAccess
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketTagging
                  - s3:GetBucketLocation
                  - s3:GetEncryptionConfiguration
                  - s3:ListBucket
                  - s3:GetObject
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - iam:GetRole
                  - iam:ListRoles
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:GetOpenIDConnectProvider
                  - ec2:Describe*
                  - eks:Describe*
                  - eks:List*
                  - ecr:Describe*
                  - elasticloadbalancing:Describe*
                Resource: '*'
      Tags:
        - Key: Name
          Value: GitHub Actions ReadOnly Role
        - Key: Access
          Value: MainAndSpecificBranch

# ============================================================================
# Outputs
# ============================================================================
Outputs:
  OIDCProviderArn:
    Description: ARN of the GitHub OIDC Provider
    Value: !GetAtt GitHubOIDCProvider.Arn
    Export:
      Name: GitHubOIDCProviderArn

  BootstrapRoleArn:
    Description: ARN of the Bootstrap Role
    Value: !GetAtt GitHubActionsBootstrapRole.Arn
    Export:
      Name: GitHubActionsBootstrapRoleArn

  NetworkRoleArn:
    Description: ARN of the Network Role
    Value: !GetAtt GitHubActionsNetworkRole.Arn
    Export:
      Name: GitHubActionsNetworkRoleArn

  ApplicationRoleArn:
    Description: ARN of the Application Role
    Value: !GetAtt GitHubActionsApplicationRole.Arn
    Export:
      Name: GitHubActionsApplicationRoleArn

  ReadOnlyRoleArn:
    Description: ARN of the ReadOnly Role
    Value: !GetAtt GitHubActionsReadOnlyRole.Arn
    Export:
      Name: GitHubActionsReadOnlyRoleArn

---
# ============================================================================
# Playbook: Configure VMs to Trust Vault SSH CA
# ============================================================================
# Purpose: Configure target VMs to trust Vault's SSH CA for certificate-based auth
# Target: All VMs that should accept SSH certificates signed by Vault
# Run After: 08-cicd-setup-ssh-signer.yml (which generates vault-ca.pub)
# ============================================================================
# Usage: ansible-playbook -i ../inventory 10-cicd-configure-vm-trust-ca.yml
# ============================================================================

- name: Configure VMs to Trust Vault CA (SSH Certificate Authentication)
  hosts: all  # Apply to all hosts, or specify groups like: ansible,k8s,vault
  become: yes
  gather_facts: no

  vars:
    # Path to the Vault CA public key (generated by 08-cicd-setup-ssh-signer.yml)
    ca_public_key_src: "./vault-ca.pub"

    # Where to install the CA on target VMs
    ca_trusted_path: "/etc/ssh/trusted-user-ca-keys.pem"

  tasks:
    # ========================================================================
    # Step 0: Verify CA Public Key Exists
    # ========================================================================
    - name: 00-Check if Vault CA public key exists locally
      stat:
        path: "{{ ca_public_key_src }}"
      delegate_to: localhost
      register: ca_key_check
      run_once: true
      tags: [verify]

    - name: 00a-Fail if CA key not found
      fail:
        msg: |
          ❌ Vault CA public key not found at {{ ca_public_key_src }}

          Please run these playbooks first:
          1. ansible-playbook -i ../inventory 08-cicd-setup-ssh-signer.yml

          This will generate the vault-ca.pub file needed for this playbook.
      when: not ca_key_check.stat.exists
      run_once: true
      tags: [verify]

    - name: 00b-Display CA key found
      debug:
        msg: "✅ Vault CA public key found: {{ ca_public_key_src }}"
      run_once: true
      tags: [verify]

    # ========================================================================
    # Step 1: Copy Vault CA Public Key to Target VMs
    # ========================================================================
    - name: 01-Copy Vault CA Public Key to target VM
      copy:
        src: "{{ ca_public_key_src }}"
        dest: "{{ ca_trusted_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart SSH
      tags: [deploy]

    - name: 01a-Verify CA key copied successfully
      stat:
        path: "{{ ca_trusted_path }}"
      register: ca_deployed
      tags: [deploy]

    - name: 01b-Display deployment status
      debug:
        msg: "✅ CA public key deployed to {{ ansible_hostname }}: {{ ca_trusted_path }}"
      when: ca_deployed.stat.exists
      tags: [deploy]

    # ========================================================================
    # Step 2: Update sshd_config to Trust the CA
    # ========================================================================
    - name: 02-Update sshd_config to trust the CA
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^TrustedUserCAKeys'
        line: "TrustedUserCAKeys {{ ca_trusted_path }}"
        state: present
      notify: Restart SSH
      tags: [configure]

    - name: 02a-Verify sshd_config updated
      shell: grep "^TrustedUserCAKeys" /etc/ssh/sshd_config
      register: sshd_config_check
      changed_when: false
      failed_when: false
      tags: [configure]

    - name: 02b-Display sshd_config status
      debug:
        msg: "✅ sshd_config updated on {{ ansible_hostname }}: {{ sshd_config_check.stdout }}"
      when: sshd_config_check.rc == 0
      tags: [configure]

    # ========================================================================
    # Step 3: Validate Configuration (before restart)
    # ========================================================================
    - name: 03-Test sshd configuration syntax
      command: sshd -t
      register: sshd_test
      changed_when: false
      failed_when: false
      tags: [validate]

    - name: 03a-Display validation result
      debug:
        msg: "{{ '✅' if sshd_test.rc == 0 else '❌' }} SSH config validation on {{ ansible_hostname }}: {{ 'PASS' if sshd_test.rc == 0 else 'FAIL - ' + sshd_test.stderr }}"
      tags: [validate]

    - name: 03b-Fail if sshd config is invalid
      fail:
        msg: |
          ❌ SSHD configuration test failed on {{ ansible_hostname }}!
          Error: {{ sshd_test.stderr }}

          The SSH service will NOT be restarted to prevent lockout.
          Please review the configuration manually.
      when: sshd_test.rc != 0
      tags: [validate]

    # ========================================================================
    # Step 4: Display Summary
    # ========================================================================
    - name: 04-Display configuration summary
      debug:
        msg:
          - "=========================================="
          - "SSH CA Trust Configuration Complete"
          - "=========================================="
          - "Host: {{ ansible_hostname }}"
          - "CA Key Location: {{ ca_trusted_path }}"
          - "sshd_config: TrustedUserCAKeys configured"
          - "Validation: {{ 'PASSED ✅' if sshd_test.rc == 0 else 'FAILED ❌' }}"
          - "=========================================="
          - "SSH service will be restarted automatically"
          - "=========================================="
      tags: [always]

  handlers:
    # ========================================================================
    # Handler: Restart SSH Service
    # ========================================================================
    - name: Restart SSH
      service:
        name: sshd  # Use 'ssh' for Ubuntu/Debian, 'sshd' for RHEL/Rocky
        state: restarted
      tags: [restart]

# ============================================================================
# End of Playbook
# ============================================================================
# Prerequisites:
#   - Vault CA public key generated (run 08-cicd-setup-ssh-signer.yml first)
#   - vault-ca.pub file exists in current directory
#   - Root/sudo access on target VMs
#
# Workflow:
#   1. Run 08-cicd-setup-ssh-signer.yml (generates Vault CA)
#   2. Run 09-cicd-create-ssh-role.yml (creates SSH signing role)
#   3. Run THIS playbook (configures VMs to trust the CA)
#   4. Sign SSH keys with Vault and authenticate with certificates
#
# What This Does:
#   - Copies Vault's SSH CA public key to /etc/ssh/trusted-user-ca-keys.pem
#   - Configures sshd to trust certificates signed by this CA
#   - Validates configuration before restarting SSH
#   - Restarts SSH to apply changes
#
# Target Hosts:
#   - Change 'hosts: all' to specific groups if needed:
#     hosts: ansible,k8s,vault,monitor
#   - Or use --limit flag:
#     ansible-playbook ... --limit k8s
#
# Security Notes:
#   - Any certificate signed by Vault CA will be trusted
#   - Ensure Vault access is properly restricted
#   - Use appropriate TTL values in SSH roles (see 09-cicd-create-ssh-role.yml)
#   - Monitor SSH certificate usage via Vault audit logs
#
# Testing After Deployment:
#   1. Generate a signed certificate:
#      vault write -field=signed_key ssh-client-signer/sign/ansible-role \
#        public_key=@~/.ssh/id_rsa.pub > ~/.ssh/id_rsa-cert.pub
#
#   2. Test SSH with certificate:
#      ssh -i ~/.ssh/id_rsa super_ansible@target-host
#
#   3. Verify certificate was used (on target VM):
#      sudo journalctl -u sshd | grep "Accepted publickey"
#
# Troubleshooting:
#   - If SSH restart fails, manual intervention required via console
#   - Check /var/log/secure or /var/log/auth.log for SSH errors
#   - Verify CA key permissions: ls -l /etc/ssh/trusted-user-ca-keys.pem
#   - Test config syntax: sshd -t
#
# Related Playbooks:
#   - 08-cicd-setup-ssh-signer.yml : Generate Vault SSH CA
#   - 09-cicd-create-ssh-role.yml : Create SSH signing role
#   - ../freeipa/for-cicd/generate-kerberos-keytab.yml : Kerberos integration
# ============================================================================

---
- name: Step 2 - Lock SSH Configuration
  hosts: k8s, ansible
  become: yes

  tasks:
    # ========================================
    # Harden SSH configuration to disable root login
    # Manual equivalent:
    #   vi /etc/ssh/sshd_config
    #   # Find and change: PermitRootLogin yes → PermitRootLogin no
    #   # Or use sed:
    #   sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
    #   # Validate config before applying:
    #   sshd -t
    #   # Restart SSH:
    #   systemctl restart sshd
    # ========================================
    - name: Disable Root Login in main config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        # SAFETY CHECK: Run 'sshd -t' on the new file before saving.
        # %s represents the temporary file Ansible creates.
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    # ========================================
    # Remove Anaconda installer's override file that may re-enable root login
    # Manual equivalent:
    #   rm -f /etc/ssh/sshd_config.d/01-permitrootlogin.conf
    #   systemctl restart sshd
    # ========================================
    - name: Remove Anaconda override file
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
        state: absent
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted

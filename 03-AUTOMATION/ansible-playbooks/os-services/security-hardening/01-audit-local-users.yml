---

- name: Step '1' Audit Users
  hosts: k8s, ansible_host
  become: yes

  tasks:
   # ========================================
   # Task 1: Check for specific local users
   # Manual equivalent:
   #   grep -E "^(admin|sabry):" /etc/passwd
   # Or to check all local users with login shells:
   #   cat /etc/passwd | grep -v nologin | grep -v false
   #   getent passwd | awk -F: '$3 >= 1000 {print $1}'
   # ========================================
   - name: Task '1' Check of admin Or sabry exists locally
     ansible.builtin.command: grep -E "^(admin|sabry):" /etc/passwd
     register: result
     ignore_errors: yes
     changed_when: false

   # ========================================
   # Task 2: Display audit results
   # Manual equivalent:
   #   echo "Return code: $?"  # 0 = found, non-zero = not found
   #   echo "Found lines: <output from grep>"
   # ========================================
   - name: Task '2' Show Results
     ansible.builtin.debug: 
       msg: 
         - "Local admin found: {{ result.rc == 0}}"
         - "Details: {{ result.stdout_lines }}"  

---
- name: Prepare Ansible VM as Jenkins Agent
  hosts: jenkins_agents
  become: yes

  tasks:

    # --- JAVA BLOCK ---
    - name: 01-Java Installation and Verification
      block:
        - name: 01a-Get Java major version
          shell: java -version 2>&1 | grep -oP 'version "\K[0-9]+' || echo "0"
          register: java_version_installed
          changed_when: false
          failed_when: false

        - name: 01b-Install Java 21 OpenJDK if missing
          dnf:
            name: java-21-openjdk-devel
            state: present
          when: java_version_installed.stdout | int != 21

        - name: 01c-Verify Java is now working
          command: java -version
          changed_when: false
      tags: java


    # --- PYTHON BLOCK ---
    - name: 02-Python and HVAC Library Setup
      block:
        - name: 02a-Install Python pip
          dnf:
            name: python3-pip
            state: present

        - name: 02b-Install hvac Python library
          pip:
            name: hvac
            state: present
            executable: pip3
      tags: python, vault


# --- JENKINS AGENT SETUP & ACCESS ---
    - name: 03-Jenkins Agent User, Directories and SSH Setup
      block:
        - name: 03a-Ensure jenkins_agent group exists
          group:
            name: "{{ jenkins_agent_group }}"
            state: present

        - name: 03b-Create User and Generate SSH Key
          user:
            name: "{{ jenkins_agent_user }}"
            group: "{{ jenkins_agent_group }}"
            home: "/var/lib/jenkins_agent"
            shell: /bin/bash
            create_home: yes
            system: yes
            generate_ssh_key: yes        # <--- This creates the key pair for you
            ssh_key_bits: 4096
            ssh_key_type: rsa
            state: present

        - name: 03c-Create required Jenkins directories
          file:
            path: "{{ item }}"
            state: directory
            owner: "{{ jenkins_agent_user }}"
            group: "{{ jenkins_agent_group }}"
            mode: '0755'
          loop:
            - "/var/lib/jenkins_agent"
            - "/var/lib/jenkins"

        - name: 03d-Self-Authorize the generated public key
          shell: |
            cat /var/lib/jenkins_agent/.ssh/id_rsa.pub > /var/lib/jenkins_agent/.ssh/authorized_keys
            chmod 600 /var/lib/jenkins_agent/.ssh/authorized_keys
            chown {{ jenkins_agent_user }}:{{ jenkins_agent_group }} /var/lib/jenkins_agent/.ssh/authorized_keys
          args:
            creates: /var/lib/jenkins_agent/.ssh/authorized_keys

        - name: 03e-Configure Sudo for super_ansible Transition
          copy:
            content: |
              # Allows the unprivileged agent to run tasks as the admin user.
              {{ jenkins_agent_user }} ALL=(super_ansible) NOPASSWD: ALL
            dest: "/etc/sudoers.d/jenkins_agent"
            mode: '0440'
            validate: 'visudo -cf %s'
      tags: agent_setup, security, user_management


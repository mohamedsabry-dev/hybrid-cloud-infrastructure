---
- name: Configure Vault Storage (RAID 1 Safe & Idempotent)
  hosts: vault
  become: yes
  vars:
    disk_1: "/dev/sdb"
    disk_2: "/dev/sdc"
    raid_device: "/dev/md0"
    mount_point: "/var/lib/vault"
    report_path: "/tmp/storage_verification_report.txt"

  tasks:
    # --- PHASE 1: CHECK STATUS ---
    - name: Check if RAID device exists
      stat:
        path: "{{ raid_device }}"
      register: raid_stat

    # --- PHASE 2: CREATION (Only runs if RAID is MISSING) ---
    - name: Create RAID Array
      block:
        - name: Install dependencies
          dnf:
            name: [mdadm, xfsprogs]
            state: present

        - name: Wipe old signatures (Only if no RAID)
          command: wipefs --all --force {{ item }}
          loop: [ "{{ disk_1 }}", "{{ disk_2 }}" ]
          ignore_errors: yes

        - name: Create RAID 1 Mirror
          shell: >
            yes | mdadm --create {{ raid_device }} 
            --level=1 --raid-devices=2 
            {{ disk_1 }} {{ disk_2 }} --force

        - name: Format RAID device with XFS
          filesystem:
            fstype: xfs
            dev: "{{ raid_device }}"
      
      # *** THIS IS THE SAFETY LOCK ***
      when: not raid_stat.stat.exists

    # --- PHASE 3: MOUNT (Always runs to ensure config) ---
    - name: Create Vault Directory
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: '0750'
        owner: root
        group: root

# 1. Get the UUID of the filesystem
    - name: Get Filesystem UUID
      command: blkid -s UUID -o value /dev/md0
      register: fs_uuid
      changed_when: false

    # 2. Mount using UUID
    - name: Permanent Mount (UUID)
      mount:
        path: "{{ mount_point }}"
        src: "UUID={{ fs_uuid.stdout }}"
        fstype: xfs
        state: mounted

    # --- PHASE 4: VERIFICATION ---
    - name: Gather Verification Report
      shell: |
        echo "STATUS REPORT: {{ inventory_hostname }}" > {{ report_path }}
        lsblk -o NAME,SIZE,TYPE,MOUNTPOINT {{ raid_device }} >> {{ report_path }}
        grep "{{ mount_point }}" /etc/fstab >> {{ report_path }}
      changed_when: false

    - name: Show Report
      command: cat {{ report_path }}
      register: output
      changed_when: false

    - debug:
        var: output.stdout_lines
AWSTemplateFormatVersion: '2010-09-09'
Description: "Phase 1: Component Roles (Cleaned & Optimized)"

Resources:
  # =========================================================
  # 1. READ ONLY ROLE (The Auditor)
  # =========================================================
  GitHubActionsReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActions-ReadOnly
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # The Audience is always exact
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # The Subject uses wildcards (*) so it MUST be StringLike
                token.actions.githubusercontent.com:sub:
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/mohamedsabrydev/*

      
      ManagedPolicyArns:
        # 1. Access to S3 State (Read/Write State file)
        - !ImportValue HybridCloud-TerraformStatePolicy-Arn
        # 2. Access to VIEW everything in AWS (The "Global ReadOnly")
        - arn:aws:iam::aws:policy/ReadOnlyAccess

  # =========================================================
  # 2. NETWORK ROLE (The Infrastructure Architect)
  # =========================================================
  GitHubActionsNetworkRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActions-Network
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # The Audience is always exact
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # The Subject uses wildcards (*) so it MUST be StringLike
                token.actions.githubusercontent.com:sub:
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/mohamedsabrydev/*



      ManagedPolicyArns:
        - !ImportValue HybridCloud-TerraformStatePolicy-Arn
        - !ImportValue HybridCloud-TerraformSecurityBoundary-Arn
        - arn:aws:iam::aws:policy/ReadOnlyAccess

      Policies:
        - PolicyName: NetworkFullManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # ONLY WRITE ACTIONS (Create/Delete/Modify)
                  # No need for Describe* anymore!
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  # Security Groups
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                Resource: '*'

  # =========================================================
  # 3. APPLICATION ROLE (The Builder)
  # =========================================================
  GitHubActionsApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActions-Application
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # The Audience is always exact
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # The Subject uses wildcards (*) so it MUST be StringLike
                token.actions.githubusercontent.com:sub:
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/main
                  - repo:mohamedsabry-dev/hybrid-cloud-infrastructure:ref:refs/heads/mohamedsabrydev/*


      ManagedPolicyArns:
        - !ImportValue HybridCloud-TerraformStatePolicy-Arn
        - arn:aws:iam::aws:policy/ReadOnlyAccess

      Policies:
        - PolicyName: ApplicationFullManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # ONLY WRITE ACTIONS (Compute & K8s)
                  # No need for Describe* anymore!
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:AllocateAddress
                  - ec2:AssociateAddress
                  - ec2:ReleaseAddress
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - eks:*
                  - ecr:*
                Resource: '*'
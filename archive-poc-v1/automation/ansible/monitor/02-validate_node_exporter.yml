---
- name: Validate Node Exporter & Connectivity
  hosts: all
  become: yes
  vars:
    # This must match the hostname of your Prometheus server in the inventory
    prometheus_inventory_name: "monitor.home.lab" 

  tasks:
    # --- STEP 1: Are you listening? (Similar to starting the Python server) ---
    - name: Check if Node Exporter Service is Active
      systemd:
        name: node_exporter
      register: service_status
      failed_when: service_status.status.ActiveState != 'active'

    - name: Verify Port 9100 is Listening Locally
      wait_for:
        port: 9100
        state: started
        timeout: 2
        msg: " ERROR: Node Exporter is down or port 9100 is closed locally."

    # --- STEP 2: Can Prometheus hear you? (The 'Remote Test') ---
    - name: "Ask Prometheus to connect to {{ inventory_hostname }}"
      wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 9100
        state: started
        timeout: 3
      # This performs the test FROM the monitor server, targeting the current host
      delegate_to: "{{ prometheus_inventory_name }}"
      ignore_errors: yes
      register: connectivity_test

    # --- STEP 3: Report Results ---
    - name: Connectivity Report
      debug:
        msg: >-
          Target: {{ inventory_hostname }} | 
          Local Service:  UP | 
          Prometheus Connection: {{ ' SUCCESS' if connectivity_test is success else ' BLOCKED (Check Firewall)' }}
      failed_when: connectivity_test is failed


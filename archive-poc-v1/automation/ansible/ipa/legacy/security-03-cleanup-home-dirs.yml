---

- name: cleanup orphanded home dirs
  hosts: k8s, ansible
  become: yes


  tasks:
    # ========================================
    # Clean up orphaned home directories
    # These are directories left behind after users were deleted
    # Manual equivalent:
    #   rm -rf /home/local_user
    # To find orphaned directories:
    #   for dir in /home/*; do
    #     user=$(basename $dir)
    #     if ! id "$user" &>/dev/null; then
    #       echo "Orphaned: $dir"
    #     fi
    #   done
    # ========================================
    - name: Remove home dir of user local_user
      ansible.builtin.file:
        path: /home/local_user
        state: absent

    # Manual equivalent:
    #   rm -rf /home/sshadmin
    - name: Remove home of dir sshadmin
      ansible.builtin.file:
        path: /home/sshadmin
        state: absent

    # Manual equivalent:
    #   rm -rf /home/admin
    - name: Remove home dir of admin
      ansible.builtin.file:
        path: /home/admin
        state: absent

    # Manual equivalent:
    #   rm -rf /home/ansible
    - name: Remove legacy anisble dir
      ansible.builtin.file:
        path: /home/ansible
        state: absent

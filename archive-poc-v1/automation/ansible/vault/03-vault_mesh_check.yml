---
- name: Vault Cluster Mesh Connectivity Test (Final)
  hosts: vault
  become: yes
  vars:
    target_ip: "10.0.20.191"
    target_port: 8201

  tasks:
    # --- 1. Start Server on Vault-01 ONLY ---
    - name: Start Python Listener on Vault-01
      shell: "nohup python3 -m http.server {{ target_port }} --bind {{ target_ip }} > /dev/null 2>&1 &"
      async: 120
      poll: 0
      when: inventory_hostname == "vault-01.home.lab"

    # --- 2. Vault-02 and 03 Check Connection ---
    # We use 'wait_for' on the PEERS. This acts as both a "wait" and a "test".
    - name: Verify Connectivity from Peer
      wait_for:
        host: "{{ target_ip }}"
        port: "{{ target_port }}"
        state: started
        timeout: 5
      when: inventory_hostname != "vault-01.home.lab"

    # --- 3. Cleanup ---
    - name: Kill Python Listener
      shell: "pkill -f 'python3 -m http.server {{ target_port }}'"
      when: inventory_hostname == "vault-01.home.lab"
      ignore_errors: yes
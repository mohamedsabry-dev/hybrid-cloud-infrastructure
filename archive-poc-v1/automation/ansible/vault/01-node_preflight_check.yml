---
- name: Node Readiness Pre-flight Check
  hosts: vault
  become: yes
  tasks:
    - name: 1. Check Firewall Services, Ports, and Rich Rules
      shell: |
            echo "--- Firewall State ---"
            firewall-cmd --state
            echo "--- Allowed Services ---"
            firewall-cmd --list-services
            echo "--- Simple Ports (Global) ---"
            firewall-cmd --list-ports
            echo "--- Rich Rules (Restricted) ---"
            firewall-cmd --list-rich-rules
      register: fw_status

    - name: 2. Check Network Config (IP and Gateway)
      shell: |
        echo "--- IP Address ---"
        ip -4 addr show | grep inet
        echo "--- Default Gateway ---"
        ip route | grep default
      register: nw_status

    - name: 3. Check NTP Synchronization (Chrony)
      shell: |
        chronyc tracking
      register: ntp_status
      failed_when: "'Leap status     : Normal' not in ntp_status.stdout"

    - name: 4. Check DNS Resolution (IPA Domain)
      shell: |
        nslookup {{ ansible_fqdn }}
        nslookup google.com
      register: dns_status

    - name: Display Results
      debug:
        msg: 
          - "{{ fw_status.stdout_lines }}"
          - "{{ nw_status.stdout_lines }}"
          - "{{ ntp_status.stdout_lines }}"
          - "{{ dns_status.stdout_lines }}"